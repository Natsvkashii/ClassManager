            async performPreUpdateBackup() {
                const now = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
                const filename = `backup_pre_aggiornamento_${stamp}.json`;
                const jsonStr = JSON.stringify(this.state, null, 2);

                if (window.electronAPI && typeof window.electronAPI.saveAutoBackup === "function") {
                    try {
                        const res = await window.electronAPI.saveAutoBackup(filename, jsonStr);
                        if (res.success) {
                            console.log("Pre-update backup saved to:", res.path);
                        }
                    } catch (e) {
                        console.error("Auto backup error:", e);
                    }
                }
            }

            parseAppVersion(str) {
                let clean = (str || "").trim().replace(/^[vV\s]+/, "");
                const lower = clean.toLowerCase();
                let unstable = false;
                if (lower.includes("(unstable)") || lower.includes("unstable") || lower.includes("beta")) {
                    unstable = true;
                } else if (lower.includes("(stable)") || lower.includes("stable")) {
                    unstable = false;
                } else if (/[0-9]+b\b|[0-9]+b$/.test(lower)) {
                    unstable = true;
                }

                // Strip status tags like (stable), (unstable), (beta), -stable, -unstable
                const core = clean
                    .replace(/\((?:unstable|stable|beta)\)/gi, "")
                    .replace(/-(?:unstable|stable|beta)/gi, "")
                    .trim();

                let base = core;
                let rev = 0;

                if (core.includes("-")) {
                    const dashIdx = core.indexOf("-");
                    const suffix = core.substring(dashIdx + 1);
                    base = core.substring(0, dashIdx);
                    const digits = suffix.replace(/[^0-9]/g, "");
                    rev = parseInt(digits, 10) || 0;
                }

                const dotParts = base.split(".");
                const major = dotParts.length > 0 ? (parseInt(dotParts[0], 10) || 0) : 0;
                const minor = dotParts.length > 1 ? (parseInt(dotParts[1], 10) || 0) : 0;
                let patch = 0;

                if (dotParts.length > 2) {
                    const pDigits = dotParts[2].replace(/[^0-9]/g, "");
                    patch = parseInt(pDigits, 10) || 0;
                }

                return {
                    major,
                    minor,
                    patch,
                    revision: rev,
                    isUnstable: unstable,
                    isBeta: unstable,
                    raw: clean
                };
            }

            compareAppVersions(lhs, rhs) {
                if (lhs.major !== rhs.major) return lhs.major - rhs.major;
                if (lhs.minor !== rhs.minor) return lhs.minor - rhs.minor;
                if (lhs.patch !== rhs.patch) return lhs.patch - rhs.patch;
                if (lhs.revision !== rhs.revision) return lhs.revision - rhs.revision;

                // Both have identical major.minor.patch.revision
                // An unstable version is strictly earlier than stable release of the same revision:
                if (lhs.isUnstable && !rhs.isUnstable) return -1;
                if (!lhs.isUnstable && rhs.isUnstable) return 1;
                return 0;
            }

            isBetaVersion() {
                const v = String(this.state?.version || INITIAL_DATA.version || "").toLowerCase();
                if (v.includes("(unstable)") || v.includes("unstable") || v.includes("beta")) {
                    return true;
                }
                if (v.includes("(stable)") || v.includes("stable")) {
                    return false;
                }
                return /[0-9]+b\b|[0-9]+b$/.test(v);
            }

            setupBetaDiagnosticsAndBackup() {
                // Global error and unhandled rejection listeners for diagnostic reports
                if (!window._classMgrDiagnosticsSetup) {
                    window._classMgrDiagnosticsSetup = true;

                    window.addEventListener('error', (event) => {
                        try {
                            const errText = `UNCAUGHT ERROR in UI: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}\nStack: ${event.error?.stack || ''}`;
                            if (window.electronAPI && typeof window.electronAPI.saveDiagnosticReport === 'function') {
                                window.electronAPI.saveDiagnosticReport(errText, { message: event.message, filename: event.filename, lineno: event.lineno, colno: event.colno });
                            }
                        } catch(e) {}
                    });

                    window.addEventListener('unhandledrejection', (event) => {
                        try {
                            const reason = event.reason;
                            const errText = `UNHANDLED REJECTION in UI: ${reason?.message || reason}\nStack: ${reason?.stack || ''}`;
                            if (window.electronAPI && typeof window.electronAPI.saveDiagnosticReport === 'function') {
                                window.electronAPI.saveDiagnosticReport(errText, { reason: String(reason), stack: reason?.stack });
                            }
                        } catch(e) {}
                    });
                }

                // If running beta version, schedule auto backup every 5 minutes
                if (this.isBetaVersion() && !window._betaBackupIntervalId) {
                    // Periodic backup every 5 minutes (300,000 ms)
                    window._betaBackupIntervalId = setInterval(() => {
                        this.performBetaAutoBackup();
                    }, 5 * 60 * 1000);

                    // Also perform one initial safety backup 20 seconds after launch
                    setTimeout(() => {
                        this.performBetaAutoBackup();
                    }, 20 * 1000);
                }
            }

            async performBetaAutoBackup() {
                if (!window.electronAPI || typeof window.electronAPI.saveBetaAutoBackup !== "function") return;
                try {
                    const now = new Date();
                    const dStr = now.toISOString().replace(/[:.]/g, "-");
                    const filename = `ClassDesk_BetaBackup_${dStr}.json`;
                    const payload = JSON.stringify(this.state, null, 2);
                    const res = await window.electronAPI.saveBetaAutoBackup(filename, payload);
                    if (res && res.success) {
                        console.log("[Beta Auto-Backup] Salvataggio automatico 5 min completato in Documenti/ClassDesk/Backup:", res.path);
                    }
                } catch (e) {
                    console.error("[Beta Auto-Backup] Errore nel salvataggio del backup:", e);
                }
            }

            handleOnboardingRestoreBackup(event) {
                const file = event.target.files && event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed || typeof parsed !== 'object') {
                            throw new Error('Formato non valido');
                        }
                        const coursesCount = Array.isArray(parsed.courses) ? parsed.courses.length : 0;
                        const studentsCount = Array.isArray(parsed.studentsDirectory) ? parsed.studentsDirectory.length : 0;

                        this.state = parsed;
                        this.ensureDataMigration();

            async checkForUpdates(manual = false) {
                if (manual) {
                    this.updateCheckInProgress = true;
                    if (this.activeTab === "credits") {
                        this.renderCreditsView(document.getElementById("mainContentArea"));
                    }
                    this.openModal(`
                        <div class="p-6 space-y-4 text-xs max-w-md text-center">
                            <div class="w-12 h-12 mx-auto rounded-full bg-sky-100 dark:bg-navy-800 text-sky-600 dark:text-sky-300 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-arrows-rotate fa-spin"></i>
                            </div>
                            <div>
                                <h4 class="text-sm font-extrabold text-slate-900 dark:text-white">Verifica Aggiornamenti</h4>
                                <p class="text-slate-500 mt-1">Controllo della disponibilità di nuove versioni su GitHub in corso...</p>
                            </div>
                            <div class="pt-2">
                                <button type="button" onclick="app.closeModal()" class="px-4 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-100 dark:hover:bg-navy-800 transition">Annulla</button>
                            </div>
                        </div>
                    `, "max-w-md");
                }

                const nowIso = new Date().toISOString();
                if (this.state.settings) {
                    this.state.settings.lastUpdateCheckDate = nowIso;
                    this.persist();
                }

                try {
                    let releases = null;

                    // 1. Try Main process IPC (supports custom User-Agent and fallback to raw manifest)
                    if (window.electronAPI && typeof window.electronAPI.checkForUpdatesAPI === "function") {
                        try {
                            const apiRes = await window.electronAPI.checkForUpdatesAPI();
                            if (apiRes && apiRes.success && Array.isArray(apiRes.releases)) {
                                releases = apiRes.releases;
                            }
                        } catch (apiErr) {
                            console.warn("Main process update check error:", apiErr);
                        }
                    }

                    // 2. Direct renderer fetch fallback
                    if (!releases) {
                        try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 6000);
                            const res = await fetch("https://api.github.com/repos/Natsvkashii/ClassManager/releases", { signal: controller.signal });
                            clearTimeout(timeoutId);
                            if (res.ok) {
                                releases = await res.json();
                            }
                        } catch (e) {
                            console.warn("Renderer fetch releases error:", e);
                        }
                    }

                    // 3. Fallback to raw manifest on stable branch (never rate-limited)
                    if (!releases) {
                        try {
                            const resM = await fetch("https://raw.githubusercontent.com/Natsvkashii/ClassManager/stable/update-manifest.json");
                            if (resM.ok) {
                                const m = await resM.json();
                                if (m && m.version) {
                                    releases = [{
                                        tag_name: m.tag_name || `v${m.version}`,
                                        name: `ClassDesk v${m.version}`,
                                        prerelease: m.prerelease === true,
                                        published_at: m.published_at || new Date().toISOString(),
                                        body: m.body || '',
                                        html_url: `https://github.com/Natsvkashii/ClassManager/releases/tag/${m.tag_name || 'v' + m.version}`,
                                        assets: [
                                            { name: m.setupName || `ClassDesk-${m.version}-Setup.exe`, browser_download_url: m.setupUrl },
                                            ...(m.portableUrl ? [{ name: m.portableName || `ClassDesk-${m.version}-Native.exe`, browser_download_url: m.portableUrl }] : [])
                                        ]
                                    }];
                                }
                            }
                        } catch (e) {}
                    }

                    this.updateCheckInProgress = false;

                    if (!Array.isArray(releases) || releases.length === 0) {
                        if (manual) {
                            this.openModal(`
                                <div class="p-6 space-y-4 text-xs max-w-md text-center">
                                    <div class="w-12 h-12 mx-auto rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 flex items-center justify-center text-xl">
                                        <i class="fa-solid fa-triangle-exclamation"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-extrabold text-slate-900 dark:text-white">Verifica Non Riuscita</h4>
                                        <p class="text-slate-500 mt-1">Impossibile verificare la presenza di aggiornamenti. Verifica la tua connessione Internet o riprova più tardi.</p>
                                    </div>
                                    <div class="flex items-center justify-center gap-2 pt-2">
                                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">Chiudi</button>
                                        <button type="button" onclick="app.checkForUpdates(true)" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold">Riprova</button>
                                    </div>
                                </div>
                            `, "max-w-md");
                        }
                        if (this.activeTab === "credits") this.renderCreditsView(document.getElementById("mainContentArea"));
                        return;
                    }

                    const currentVer = this.parseAppVersion(this.state.version || INITIAL_DATA.version || "26.10.4-012");
                    // Beta versions receive beta updates even if toggle is off until next stable arrives
                    const isCurrentBeta = this.isBetaVersion();
                    const includeBeta = (this.state.settings?.includeBetaUpdates === true) || isCurrentBeta;
                    let highestCandidate = null;

                    for (const rel of releases) {
                        if (rel.prerelease && !includeBeta) continue;
                        const parsed = this.parseAppVersion(rel.tag_name || "");
                        if (parsed.isBeta && !includeBeta) continue;
                        if (!highestCandidate || this.compareAppVersions(parsed, highestCandidate.parsed) > 0) {
                            highestCandidate = { release: rel, parsed };
                        }
                    }

                    if (highestCandidate && this.compareAppVersions(highestCandidate.parsed, currentVer) > 0) {
                        const rel = highestCandidate.release;
                        const assets = rel.assets || [];
                        const setupAsset = assets.find(a => (a.name || "").toLowerCase().includes("setup") && (a.name || "").toLowerCase().endsWith(".exe"));
                        const nativeAsset = assets.find(a => (a.name || "").toLowerCase().includes("native") && (a.name || "").toLowerCase().endsWith(".exe"));
                        const portableAsset = assets.find(a => (a.name || "").toLowerCase().includes("portable") && (a.name || "").toLowerCase().endsWith(".exe"));
                        const anyExe = setupAsset || nativeAsset || portableAsset || assets.find(a => (a.name || "").toLowerCase().endsWith(".exe"));
                        const primaryUrl = setupAsset ? setupAsset.browser_download_url : (anyExe ? anyExe.browser_download_url : (rel.html_url || "https://github.com/Natsvkashii/ClassManager/releases"));
                        const primaryName = setupAsset ? setupAsset.name : (anyExe ? anyExe.name : "Class-Management-Update.exe");
                        const nativeUrl = nativeAsset ? nativeAsset.browser_download_url : null;
                        const nativeName = nativeAsset ? nativeAsset.name : "Class-Management-Native.exe";

                        this.availableUpdate = {
                            release: rel,
                            parsed: highestCandidate.parsed,
                            primaryUrl,
                            primaryName,
                            nativeUrl,
                            nativeName
                        };

                        if (this.activeTab === "credits") {
                            this.renderCreditsView(document.getElementById("mainContentArea"));
                        }

                        if (!manual) {
                            return;
                        }

                        // Present update modal directly with external download options
                        this.openModal(`
                            <div class="p-6 space-y-4 text-xs max-w-md">
                                <div class="flex items-center gap-3">
                                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white flex items-center justify-center text-xl shrink-0 shadow-sm">
                                        <i class="fa-solid fa-cloud-arrow-down"></i>
                                    </div>
                                    <div>

            saveModuleModal(e, levelId, modId = null) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                const lvl = (course?.levels || []).find(l => l.id === levelId);
                if (!course || !lvl) return;
                const name = document.getElementById("modNameInput")?.value.trim() || "M1";
                const description = document.getElementById("modDescInput")?.value.trim() || "";
                const googleMeetUrl = document.getElementById("modGoogleMeetUrlInput")?.value.trim() || "";

                let targetModId = modId;
                if (modId) {
                    const mod = (lvl.modules || []).find(m => m.id === modId);
                    if (mod) {
                        mod.name = name;
                        mod.description = description;
                        mod.googleMeetUrl = googleMeetUrl || null;
                    }
                } else {
                    const prevMod = this.getActiveSection(course);
                    const newMod = {
                        id: "sec-" + Math.random().toString(36).substr(2, 6),
                        name,
                        description,
                        googleMeetUrl: googleMeetUrl || null,
                        startTime: prevMod?.startTime || "19:00",
                        endTime: prevMod?.endTime || "20:30",
                        studentIds: [...(prevMod?.studentIds || [])],
                        dates: [],
                        attendance: {}
                    };
                    lvl.modules.push(newMod);
                    targetModId = newMod.id;
                    this.activeModuleByLevel[`${course.id}_${lvl.id}`] = newMod.id;
                }

                // Propagate the module Google Meet link to ALL lessons in this module
                if (Array.isArray(course.lessons)) {
                    course.lessons.forEach(l => {
                        if (l.sectionId === targetModId) {
                            l.googleMeetUrl = googleMeetUrl || null;
                        }
                    });
                }

                this.syncCourseLevelsAndSections(course);
                this.persist();
                this.closeModal(true);
                this.renderAll();
            }

            generateLessonInvitationText(course, module, slotKey) {
                const les = this.findLessonForSlot(course, module.id, slotKey);
                const sTime = les?.time || module.startTime || course.startTime || "19:00";
                const eTime = les?.endTime || module.endTime || course.endTime || "20:30";
                const timeRange = `${this.formatTimeDisplay(sTime)} - ${this.formatTimeDisplay(eTime)}`;
                const shortWeekday = this.formatShortWeekdayDate(slotKey);
                const fullDate = this.formatDateDisplay(slotKey);

                const allSlots = this.sortModuleSlots(course, module);
                const lessonIdx = (allSlots.indexOf(slotKey) >= 0 ? allSlots.indexOf(slotKey) + 1 : 1);

                const meetUrl = (les?.googleMeetUrl && les.googleMeetUrl.trim()) ? les.googleMeetUrl.trim() : (module.googleMeetUrl ? module.googleMeetUrl.trim() : "");
                const customTitle = (les?.title || "").trim();
                const titleSuffix = customTitle ? ` — ${customTitle}` : "";

                const courseLbl = this.t("lessonInviteCourse");
                const lessonLbl = this.t("lessonInviteLesson");
                const dateLbl = this.t("lessonInviteDate");
                const timeLbl = this.t("lessonInviteTime");
                const linkLbl = this.t("lessonInviteLink");

                const lines = [
                    `🎓 ${courseLbl}: ${course.name} (${module.name})`,
                    `📌 ${lessonLbl} ${lessonIdx}${titleSuffix}`,
                    `📅 ${dateLbl}: ${shortWeekday} (${fullDate})`,
                    `⏰ ${timeLbl}: ${timeRange}`
                ];

                if (meetUrl) {
                    lines.push(`🔗 ${linkLbl}: ${meetUrl}`);
                }

                return lines.join("\n");
            }

            copyLessonStudentInvitation(courseId, sectionId, slotKey) {
                const course = (this.state.courses || []).find(c => c.id === courseId) || this.getActiveCourse();
                if (!course) return;
                let targetSec = null;
                (course.levels || []).forEach(l => {
                    const m = (l.modules || []).find(x => x.id === sectionId);
                    if (m) targetSec = m;
                });
                if (!targetSec) targetSec = this.getActiveSection(course);
                if (!targetSec) return;

                const targetSlotKey = slotKey || (targetSec.dates && targetSec.dates[0]) || new Date().toISOString().substring(0, 10);
                const text = this.generateLessonInvitationText(course, targetSec, targetSlotKey);

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast(`📋 ${this.t("inviteCopiedToast")}`, "success");
                    }).catch(() => {
                        this.showToast("Errore durante la copia", "error");
                    });
                } else {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    this.showToast(`📋 ${this.t("inviteCopiedToast")}`, "success");
                }
            }

            saveLessonPlanModal(e, courseId, sectionId, oldSlotKey = null) {
                if (e) e.preventDefault();
                try {
                    const course = (this.state.courses || []).find(c => c.id === courseId);
                    if (!course) return;
                    let sec = null;
                    (course.levels || []).forEach(l => {
                        const m = (l.modules || []).find(x => x.id === sectionId);
                        if (m) sec = m;
                    });
                    if (!sec) return;

                    const les = oldSlotKey ? this.findLessonForSlot(course, sec.id, oldSlotKey) : null;

                    const newDate = document.getElementById("lpDateInput")?.value;
                    const time = document.getElementById("lpStartTimeInput")?.value || "19:00";
                    const endTime = document.getElementById("lpEndTimeInput")?.value || "20:30";
                    if (!newDate) return;

                    let finalSlotKey = oldSlotKey;
                    if (!finalSlotKey) {
                        finalSlotKey = sec.dates.includes(newDate)
                            ? `${newDate}__${Math.random().toString(36).substr(2, 5)}`
                            : newDate;
                        sec.dates.push(finalSlotKey);
                    } else {
                        const oldDateOnly = this.extractDateFromSlotKey(oldSlotKey);
                        if (oldDateOnly !== newDate) {
                            const candidate = sec.dates.includes(newDate)
                                ? `${newDate}__${Math.random().toString(36).substr(2, 5)}`
                                : newDate;
                            const idx = sec.dates.indexOf(oldSlotKey);
                            if (idx >= 0) sec.dates[idx] = candidate;
                            if (sec.attendance) {
                                Object.keys(sec.attendance).forEach(stId => {
                                    if (sec.attendance[stId]?.[oldSlotKey] !== undefined) {
                                        sec.attendance[stId][candidate] = sec.attendance[stId][oldSlotKey];
                                        delete sec.attendance[stId][oldSlotKey];
                                    }
                                });
                            }
                            finalSlotKey = candidate;
                        }
                    }

                    if (!Array.isArray(course.lessons)) course.lessons = [];
                    const googleMeetUrl = document.getElementById("lpGoogleMeetUrlInput")?.value.trim() || "";
                    const invitedEmails = (document.getElementById("lpInvitedEmailsInput")?.value || "")
                        .split(",")
                        .map(s => s.trim())
                        .filter(Boolean);

                    const lessonData = {
                        id: les?.id || ("les-" + Math.random().toString(36).substr(2, 6)),
                        sectionId: sec.id,
                        date: newDate,
                        slotKey: finalSlotKey,
                        time,
                        endTime,
                        title: document.getElementById("lpTitleInput")?.value.trim() || "",
                        googleMeetUrl,
                        googleCalendarEventId: les?.googleCalendarEventId || null,
                        invitedEmails,
                        objectives: document.getElementById("lpObjectivesInput")?.value.trim() || "",
                        topics: document.getElementById("lpTopicsInput")?.value.trim() || "",
                        methodology: document.getElementById("lpMethodInput")?.value.trim() || "",
                        materials: document.getElementById("lpMaterialsInput")?.value.trim() || "",
                        homework: document.getElementById("lpHomeworkInput")?.value.trim() || "",
                        notes: document.getElementById("lpNotesInput")?.value.trim() || ""
                    };

                    if (les) {
                        Object.assign(les, lessonData);
                    } else {
                        course.lessons.push(lessonData);
                    }

                    this.sortModuleSlots(course, sec);
                    this.persist();
                    this.closeModal(true);
                    this.renderAll();
                    this.showToast(this.t("saveBtn"), "success");
                } catch (err) {
                    console.error("Error saving lesson plan:", err);
                    this.closeModal(true);
                }
            }

            confirmRemoveDateFromModule(slotKey) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                sec.dates = (sec.dates || []).filter(d => d !== slotKey);
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        if (sec.attendance[stId]) delete sec.attendance[stId][slotKey];
                    });
                }
                if (Array.isArray(course.lessons)) {
                    const targetLes = course.lessons.find(l => l.slotKey === slotKey && (!l.sectionId || l.sectionId === sec.id));
                    if (targetLes?.googleCalendarEventId) {
                        this.deleteLessonFromGoogle(targetLes.googleCalendarEventId);
                    }
                    course.lessons = course.lessons.filter(l => !(l.slotKey === slotKey && (!l.sectionId || l.sectionId === sec.id)));
                }
                this.persist();
                this.closeModal(true);
                this.renderAll();
            }

            executeRecurringGenerator(e) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                const startStr = document.getElementById("recStartDate")?.value;
                const count = Math.min(200, Math.max(1, parseInt(document.getElementById("recCount")?.value, 10) || 10));
                const sTime = document.getElementById("recStartTime")?.value || "19:00";
                const eTime = document.getElementById("recEndTime")?.value || "20:30";
                const dows = Array.from(document.querySelectorAll("input[name='recDow']:checked")).map(cb => parseInt(cb.value, 10));
                if (!startStr || dows.length === 0) return;

                sec.startTime = sTime;
                sec.endTime = eTime;
                sec.weekdays = dows;
                if (!Array.isArray(course.lessons)) course.lessons = [];

                const cur = new Date(startStr + "T12:00:00");
                let added = 0;
                let guard = 0;
                while (added < count && guard < 1000) {
                    guard++;
                    if (dows.includes(cur.getDay())) {
                        const iso = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}-${String(cur.getDate()).padStart(2, "0")}`;
                        const slotKey = sec.dates.includes(iso) ? `${iso}__${Math.random().toString(36).substr(2, 5)}` : iso;
                        sec.dates.push(slotKey);
                        course.lessons.push({
                            id: "les-" + Math.random().toString(36).substr(2, 6),
                            sectionId: sec.id,
                            date: iso,
                            slotKey,
                            time: sTime,
                            endTime: eTime,
                            title: ""
                        });
                        added++;
                    }
                    cur.setDate(cur.getDate() + 1);
                }

                this.sortModuleSlots(course, sec);
                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(`+${added} ${this.t("lessonsLower")}`, "success");
                if (this.state.settings?.googleCalendarConnected) {
                    this.syncModuleToGoogleCalendar(course, sec, false);
                }
            }

            downloadBackupJson() {
                const jsonStr = JSON.stringify(this.state, null, 2);
                const fileName = `gestione_corsi_backup_${new Date().toISOString().substring(0, 10)}.json`;
                if (window.webkit?.messageHandlers?.saveJsonBackup) {
                    window.webkit.messageHandlers.saveJsonBackup.postMessage({ filename: fileName, content: jsonStr });
                    this.closeModal(true);
                    return;
                }
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.closeModal(true);
                this.showToast(this.t("exportJsonBtn"), "success");
            }

                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (parsed && typeof parsed === "object") {
                            this.state = parsed;

                            await this.persist();

            /**

             */
            serializeModalFormState() {
                const modal = document.getElementById("modalContent");
                if (!modal) return "";
                const fields = modal.querySelectorAll("input, textarea, select");
                return Array.from(fields).map(el => {
                    if (el.type === "checkbox" || el.type === "radio") return `${el.name || el.id}:${el.checked}`;
                    return `${el.name || el.id}:${el.value}`;
                }).join("|");

            openModal(htmlContent, maxWidthClass = "max-w-2xl", keepManualDirty = false) {
                const bd = document.getElementById("modalBackdrop");
                const mc = document.getElementById("modalContent");
                if (!bd || !mc) return;
                mc.className = `bg-white dark:bg-navy-900 border border-sky-100 dark:border-slate-800 rounded-2xl shadow-2xl w-full ${maxWidthClass} overflow-hidden my-4 transition-all duration-200 relative`;
                mc.innerHTML = htmlContent;
                bd.classList.remove("hidden");
                bd.classList.add("flex");
                if (!keepManualDirty) {
                    this.modalHasManualChanges = false;
                    requestAnimationFrame(() => {
                        this.modalInitialSnapshot = this.serializeModalFormState();
                    });
                }
            }

            isModalDirty() {
                if (this.modalHasManualChanges) return true;
                const mc = document.getElementById("modalContent");
                if (!mc || !mc.querySelector("form")) return false;
                if (this.modalInitialSnapshot === null) return false;
                return this.serializeModalFormState() !== this.modalInitialSnapshot;
            }

            closeModal(force = false) {
                if (!force && this.isModalDirty()) {
                    const promptBd = document.getElementById("unsavedPromptBackdrop");
                    if (promptBd) {
                        promptBd.classList.remove("hidden");
                        promptBd.classList.add("flex");
                    }
                    return;
                }
                this.forceCloseModalWithoutSaving();
            }

                if (promptBd) {
                    promptBd.classList.add("hidden");

            // =====================================================================================
            // MARK: - Google Calendar & Google Meet Integration
            // =====================================================================================
            getGoogleOAuthConfig() {
                const xd = (h, k = 0x5A) => {
                    let s = "";
                    for (let i = 0; i < h.length; i += 2) {
                        s += String.fromCharCode(parseInt(h.substr(i, 2), 16) ^ k);
                    }
                    return s;
                };
                return {
                    clientId: xd("63626f6c636e6a6a6b6c6c772a6f6f3b383137636c6333286c2833283b2f312a29332b312f2a683b6a6b2869743b2a2a29743d35353d363f2f293f283935342e3f342e74393537"),
                    clientSecret: xd("1d1519090a02770f6c6f376d6d183538773f100b15143323123f0c14301b233419620f"),
                    redirectUri: "http://127.0.0.1:8089/oauth2callback",
                    scopes: "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/userinfo.email"
                };
            }

            async startGoogleOAuth() {
                this.isAuthenticatingGoogle = true;
                this.googleOAuthError = null;
                this.renderAll();

                const config = this.getGoogleOAuthConfig();
                const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${config.clientId}&redirect_uri=${encodeURIComponent(config.redirectUri)}&response_type=code&scope=${encodeURIComponent(config.scopes)}&access_type=offline&prompt=consent`;

                if (window.electronAPI && typeof window.electronAPI.startGoogleOAuth === "function") {
                    window.electronAPI.startGoogleOAuth(authUrl);
                    this.showToast("Accesso a Google avviato nel browser predefinito...", "info");
                } else if (window.electronAPI && typeof window.electronAPI.openExternal === "function") {
                    window.electronAPI.openExternal(authUrl);
                    this.showToast("Accesso a Google avviato nel browser predefinito...", "info");
                } else {
                    window.open(authUrl, "_blank");
                }
            }

            cancelGoogleOAuth(reason = "Accesso annullato") {
                this.isAuthenticatingGoogle = false;
                this.googleOAuthError = reason;
                if (window.electronAPI && typeof window.electronAPI.cancelGoogleOAuth === "function") {
                    window.electronAPI.cancelGoogleOAuth();
                }
                this.showToast(reason, "info");
                this.renderAll();
            }

            onGoogleOAuthError(msg) {
                this.isAuthenticatingGoogle = false;
                this.googleOAuthError = msg || "Autorizzazione Google non riuscita";
                this.showToast(this.googleOAuthError, "warning");
                this.renderAll();
            }

            async onGoogleOAuthSuccess(code) {
                this.isAuthenticatingGoogle = false;
                this.googleOAuthError = null;
                const config = this.getGoogleOAuthConfig();
                try {
                    this.showToast("Finalizzazione accesso Google Calendar...", "info");
                    const res = await fetch("https://oauth2.googleapis.com/token", {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: new URLSearchParams({
                            code: code,
                            client_id: config.clientId,
                            client_secret: config.clientSecret,
                            redirect_uri: config.redirectUri,
                            grant_type: "authorization_code"
                        })
                    });
                    const data = await res.json();
                    if (data.access_token) {
                        this.state.settings = this.state.settings || {};
                        this.state.settings.googleAccessToken = data.access_token;
                        if (data.refresh_token) this.state.settings.googleRefreshToken = data.refresh_token;
                        this.state.settings.googleTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
                        this.state.settings.googleCalendarConnected = true;

                        try {
                            const uRes = await fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
                                headers: { "Authorization": `Bearer ${data.access_token}` }
                            });
                            const uData = await uRes.json();
                            if (uData.email) this.state.settings.googleCalendarEmail = uData.email;
                        } catch (ue) {
                            console.warn("Could not retrieve Google user email", ue);
                        }

                        this.persist();
                        this.showToast("Account Google Calendar collegato con successo!", "success");
                        await this.refreshGoogleCalendarEvents(true);
                        this.renderAll();
                    } else {
                        throw new Error(data.error_description || "Token di accesso non ricevuto");
                    }
                } catch (err) {
                    console.error("OAuth Exchange Error:", err);
                    this.googleOAuthError = err.message;
                    this.showToast("Errore durante l'autenticazione Google: " + err.message, "error");
                    this.renderAll();
                }
            }

            async ensureValidGoogleToken() {
                const s = this.state.settings;
                if (!s || !s.googleCalendarConnected) return null;
                const now = Date.now();
                if (s.googleAccessToken && s.googleTokenExpiry && s.googleTokenExpiry > (now + 60000)) {
                    return s.googleAccessToken;
                }
                if (!s.googleRefreshToken) return null;

                const config = this.getGoogleOAuthConfig();
                try {
                    const res = await fetch("https://oauth2.googleapis.com/token", {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: new URLSearchParams({
                            refresh_token: s.googleRefreshToken,
                            client_id: config.clientId,
                            client_secret: config.clientSecret,
                            grant_type: "refresh_token"
                        })
                    });
                    const data = await res.json();
                    if (data.access_token) {
                        s.googleAccessToken = data.access_token;
                        s.googleTokenExpiry = Date.now() + (data.expires_in || 3600) * 1000;
                        this.persist();
                        return data.access_token;
                    }
                } catch (e) {
                    console.error("Refresh token error:", e);
                }
                return null;
            }

            disconnectGoogleCalendar() {
                if (!confirm("Sei sicuro di voler disconnettere Google Calendar?")) return;
                const s = this.state.settings;
                if (s) {
                    s.googleCalendarConnected = false;
                    s.googleCalendarEmail = "";
                    s.googleAccessToken = "";
                    s.googleRefreshToken = "";
                    s.googleTokenExpiry = 0;
                }
                this.googleEvents = [];
                this.persist();
                this.showToast("Google Calendar disconnesso", "info");
                this.renderAll();
            }

            async refreshGoogleCalendarEvents(showNotify = false) {
                if (!this.state.settings?.googleCalendarConnected) return;
                const token = await this.ensureValidGoogleToken();
                if (!token) return;

                this.isSyncingGoogle = true;
                if (showNotify) this.showToast("Sincronizzazione eventi Google...", "info");

                try {
                    const cursor = this.calendarCursor || new Date();
                    const year = cursor.getFullYear();
                    const month = cursor.getMonth();
                    const minDate = new Date(year, month - 1, 1).toISOString();
                    const maxDate = new Date(year, month + 2, 0).toISOString();

                    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(minDate)}&timeMax=${encodeURIComponent(maxDate)}&singleEvents=true&orderBy=startTime&maxResults=250`;
                    const res = await fetch(url, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const items = data.items || [];
                        this.googleEvents = items.filter(it => {
                            const desc = it.description || "";
                            return !desc.includes("[ClassManagementSlot:") && !desc.includes("[GestioneCorsiSlot:");
                        });
                        if (showNotify) this.showToast(`Sincronizzati ${this.googleEvents.length} eventi personali da Google Calendar`, "success");
                        if (this.currentTab === "calendar") {
                            this.renderMainView();
                        }
                    }
                } catch (e) {
                    console.error("Error fetching Google events:", e);
                    if (showNotify) this.showToast("Errore durante il recupero eventi Google", "error");
                } finally {
                    this.isSyncingGoogle = false;
                }
            }

            runNativeWindowsInstaller() {
                if (window.electronAPI && window.electronAPI.runNativeInstaller) {
                    window.electronAPI.runNativeInstaller();
                } else {
                    this.showToast("Installer nativo disponibile nell'applicazione Windows", "info");
                }
            }

            getParticipantSuffix(course, module) {
                if (!module || !Array.isArray(module.studentIds)) return "";
                const enrolled = (this.state.studentsDirectory || []).filter(s => module.studentIds.includes(s.id));
                if (enrolled.length === 1) {
                    const s = enrolled[0];
                    const name = `${s.firstName || ""} ${s.lastName || ""}`.trim();
                    return name ? ` (${name})` : "";
                } else if (enrolled.length > 1 && enrolled.length <= 3) {
                    const names = enrolled.map(s => s.firstName || s.lastName || "").filter(Boolean).join(", ");
                    return ` (${names})`;
                } else if (enrolled.length > 3) {
                    return ` (Gruppo — ${enrolled.length} iscritti)`;
                } else if (course?.type === "group") {
                    return " (Gruppo)";
                }
                return "";
            }

            async createModuleGoogleMeet(course, module) {
                if (!course || !module) return null;
                if (!this.state.settings?.googleCalendarConnected) {
                    this.showToast("Collega prima Google Calendar nelle Impostazioni", "warning");
                    return null;
                }
                const token = await this.ensureValidGoogleToken();
                if (!token) return null;

                const pSuffix = this.getParticipantSuffix(course, module);
                const codePrefix = (course.code && course.code.trim()) ? `[${course.code.trim()}] ` : "";
                const summary = `${codePrefix}${course.name} — ${module.name}${pSuffix}`;

                let dateOnly = new Date().toISOString().substring(0, 10);
                if (Array.isArray(module.dates) && module.dates.length > 0) {
                    dateOnly = this.extractDateFromSlotKey(module.dates[0]);
                }
                const sTime = module.startTime || "19:00";
                const eTime = module.endTime || "20:30";
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

                const attendees = [];
                (module.studentIds || []).forEach(stId => {
                    const st = (this.state.studentsDirectory || []).find(s => s.id === stId);
                    if (st && st.email && st.email.includes("@")) {
                        attendees.push({ email: st.email.trim() });
                    }
                });

                const payload = {
                    summary,
                    description: `Stanza Google Meet permanente per ${course.name} — ${module.name}.\nGestita con ClassDesk.`,
                    start: { dateTime: `${dateOnly}T${sTime}:00`, timeZone },
                    end: { dateTime: `${dateOnly}T${eTime}:00`, timeZone },
                    conferenceData: {
                        createRequest: {
                            requestId: "cm-mod-" + Math.random().toString(36).substring(2, 10) + Date.now(),
                            conferenceSolutionKey: { type: "hangoutsMeet" }
                        }
                    }
                };
                if (attendees.length > 0) payload.attendees = attendees;

                try {
                    const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1&sendUpdates=all", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const eventObj = await res.json();
                        const meetUrl = eventObj.hangoutLink || "";
                        if (meetUrl) {
                            module.googleMeetUrl = meetUrl;
                            if (Array.isArray(course.lessons)) {
                                course.lessons.forEach(l => {
                                    if (l.sectionId === module.id) {
                                        l.googleMeetUrl = meetUrl;
                                    }
                                });
                            }
                            this.persist();
                            this.renderAll();
                            this.showToast("Stanza Google Meet creata per tutte le lezioni!", "success");
                            return meetUrl;
                        }
                    }
                    this.showToast("Impossibile ottenere il link Meet da Google", "error");
                } catch (err) {
                    console.error("Error creating module meet room:", err);
                    this.showToast("Errore creazione Google Meet: " + err.message, "error");
                }
                return null;
            }

            removeModuleGoogleMeet(course, module) {
                if (!course || !module) return;
                module.googleMeetUrl = null;
                if (Array.isArray(course.lessons)) {
                    course.lessons.forEach(l => {
                        if (l.sectionId === module.id) {
                            l.googleMeetUrl = null;
                        }
                    });
                }

            async syncModuleToGoogleCalendar(course, module, showNotify = true) {
                if (!course || !module) return;
                if (!this.state.settings?.googleCalendarConnected) return;
                const token = await this.ensureValidGoogleToken();
                if (!token) return;

                if (showNotify) this.showToast("Sincronizzazione modulo su Google Calendar...", "info");

                const moduleStudentIds = new Set(module.studentIds || []);
                const attendeeEmails = (this.state.studentsDirectory || [])
                    .filter(st => moduleStudentIds.has(st.id) && st.email && st.email.includes("@"))
                    .map(st => st.email.trim());

                const slots = [...this.sortModuleSlots(course, module)];
                let syncedCount = 0;

                for (let i = 0; i < slots.length; i++) {
                    const slotKey = slots[i];
                    let lessonData = this.findLessonForSlot(course, module.id, slotKey);
                    if (!lessonData) {
                        const dStr = this.extractDateFromSlotKey(slotKey);
                        lessonData = {
                            id: "les-" + Math.random().toString(36).substring(2, 8),
                            sectionId: module.id,
                            date: dStr,
                            slotKey: slotKey,
                            time: module.startTime || "19:00",
                            endTime: module.endTime || "20:30",
                            title: "",
                            objectives: "",
                            topics: "",
                            homework: "",
                            notes: "",
                            invitedEmails: attendeeEmails
                        };
                        course.lessons = course.lessons || [];
                        course.lessons.push(lessonData);
                    } else {
                        lessonData.invitedEmails = attendeeEmails;
                    }

                    try {
                        await this.syncLessonToGoogle(course, module, lessonData, false);
                        syncedCount++;
                    } catch (e) {
                        console.error("Error syncing slot", slotKey, e);
                    }
                }

                this.persist();
                if (showNotify) {
                    this.showToast(`Google Calendar: ${syncedCount} lezioni sincronizzate con Meet!`, "success");
                }
            }

            async executeGoogleCalendarScan(courseId, moduleId) {
                const course = (this.state.courses || []).find(c => c.id === courseId) || this.getActiveCourse();
                const module = (course.levels || []).flatMap(l => l.modules || []).find(m => m.id === moduleId) || this.getActiveSection(course);
                if (!course || !module) return;

                const codeInput = document.getElementById("scanGroupCodeInput");
                const fromDateInput = document.getElementById("scanFromDateInput");
                const resultsCont = document.getElementById("scanResultsContainer");
                const scanBtn = document.getElementById("scanExecuteBtn");

                const code = (codeInput?.value || "").trim();
                const fromDate = fromDateInput?.value || new Date().toISOString().substring(0, 10);

                if (!code) {
                    this.showToast("Inserisci un codice valido per la ricerca", "warning");
                    if (codeInput) codeInput.focus();
                    return;
                }

                if (code !== course.code) {
                    course.code = code;
                    this.persist();
                }

                if (resultsCont) {
                    resultsCont.classList.remove("hidden");
                    resultsCont.innerHTML = `
                        <div class="py-8 flex flex-col items-center justify-center text-slate-500 gap-2">
                            <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i>
                            <p class="font-bold">Scansione del calendario Google in corso...</p>
                        </div>
                    `;
                }

                if (scanBtn) scanBtn.disabled = true;

                try {
                    const token = await this.ensureValidGoogleToken();
                    if (!token) {
                        if (resultsCont) {
                            resultsCont.innerHTML = `<p class="text-rose-500 font-bold p-3 bg-rose-50 dark:bg-rose-950/40 rounded-xl">Token Google Calendar non valido. Ricollega l'account nelle Impostazioni.</p>`;
                        }
                        return;
                    }

                    const timeMin = new Date(fromDate + "T00:00:00Z").toISOString();
                    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&q=${encodeURIComponent(code)}&singleEvents=true&orderBy=startTime&maxResults=250`;
                    const res = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
                    if (!res.ok) {
                        throw new Error(`Google API status: ${res.status}`);
                    }
                    const data = await res.json();
                    const cleanCode = code.toLowerCase();
                    const items = data.items || [];
                    const matched = [];

                    for (const it of items) {
                        const summary = (it.summary || "");
                        if (!summary.toLowerCase().includes(cleanCode)) continue;

                        let sIso = "", eIso = "", dateOnly = "", isAllDay = false, sTime = "09:00", eTime = "10:00";
                        if (it.start?.dateTime) {
                            sIso = it.start.dateTime;
                            dateOnly = sIso.substring(0, 10);
                            if (sIso.length >= 16) sTime = sIso.substring(11, 16);
                        } else if (it.start?.date) {
                            sIso = it.start.date;
                            dateOnly = sIso;
                            isAllDay = true;
                            sTime = "Tutto il giorno";
                            eTime = "";
                        }

                        if (it.end?.dateTime && !isAllDay) {
                            eIso = it.end.dateTime;
                            if (eIso.length >= 16) eTime = eIso.substring(11, 16);
                        }

                        if (dateOnly >= fromDate) {
                            matched.push({
                                id: it.id,
                                summary,
                                description: it.description || "",
                                location: it.location || "",
                                startIso: sIso,
                                endIso: eIso,
                                startTimeDisplay: sTime,
                                endTimeDisplay: eTime,
                                dateOnly,
                                hangoutLink: it.hangoutLink || "",
                                htmlLink: it.htmlLink || "",
                                isAllDay
                            });
                        }
                    }

                    matched.sort((a, b) => a.dateOnly !== b.dateOnly ? a.dateOnly.localeCompare(b.dateOnly) : a.startTimeDisplay.localeCompare(b.startTimeDisplay));
                    this.lastScannedGoogleEvents = matched;
                    this.lastScannedFromDate = fromDate;

                    if (matched.length === 0) {
                        resultsCont.innerHTML = `
                            <div class="p-6 text-center space-y-3 bg-slate-50 dark:bg-navy-950 rounded-2xl border border-sky-100 dark:border-slate-800">
                                <i class="fa-regular fa-calendar-xmark text-3xl text-slate-400"></i>
                                <p class="text-slate-600 dark:text-slate-300">Nessun evento trovato su Google Calendar con il codice '<strong>${this.escapeHtml(code)}</strong>' a partire dal ${this.formatDateDisplay(fromDate)}.</p>
                                <button type="button" onclick="app.closeModal(); app.syncModuleToGoogleCalendar(app.getActiveCourse(), app.getActiveSection(app.getActiveCourse()), true);" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold flex items-center gap-2 mx-auto shadow-2xs">
                                    <i class="fa-solid fa-plus-circle"></i> Crea nuovi eventi per tutte le lezioni del modulo
                                </button>
                            </div>
                        `;
                    } else {
                        resultsCont.innerHTML = `
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="font-extrabold text-slate-900 dark:text-white">Trovati ${matched.length} eventi con il codice '${this.escapeHtml(code)}'</span>
                                    <button type="button" onclick="app.associateScannedGoogleEvents('${course.id}', '${module.id}')" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold flex items-center gap-1.5 shadow-2xs">
                                        <i class="fa-solid fa-link"></i> Associa Eventi al Modulo
                                    </button>
                                </div>
                                <div class="max-h-56 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                    ${matched.map(ev => `
                                        <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-navy-950 border border-sky-100 dark:border-slate-800 flex items-center justify-between gap-3 text-xs">
                                            <div class="flex items-center gap-2.5 min-w-0">
                                                <span class="font-bold text-sky-700 dark:text-sky-300 w-24 shrink-0">${this.formatDateDisplay(ev.dateOnly)}</span>
                                                <span class="text-slate-400 w-24 shrink-0 text-[11px]">${ev.isAllDay ? 'Tutto il giorno' : `${ev.startTimeDisplay} - ${ev.endTimeDisplay}`}</span>
                                                <span class="font-bold text-slate-800 dark:text-slate-200 truncate">${this.escapeHtml(ev.summary)}</span>
                                            </div>
                                            ${ev.hangoutLink ? `
                                                <span class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 text-[10px] font-extrabold flex items-center gap-1 shrink-0">
                                                    <i class="fa-solid fa-video"></i> Meet
                                                </span>
                                            ` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                } catch (err) {
                    console.error("Scan Google Calendar error:", err);
                    if (resultsCont) {
                        resultsCont.innerHTML = `<p class="text-rose-500 font-bold p-3 bg-rose-50 dark:bg-rose-950/40 rounded-xl">Errore durante la scansione: ${this.escapeHtml(err.message || String(err))}</p>`;
                    }
                } finally {
                    if (scanBtn) scanBtn.disabled = false;
                }
            }

            associateScannedGoogleEvents(courseId, moduleId) {
                const course = (this.state.courses || []).find(c => c.id === courseId) || this.getActiveCourse();
                const module = (course.levels || []).flatMap(l => l.modules || []).find(m => m.id === moduleId) || this.getActiveSection(course);
                if (!course || !module) return;

                const events = [...(this.lastScannedGoogleEvents || [])];
                const fromDate = this.lastScannedFromDate || new Date().toISOString().substring(0, 10);
                if (events.length === 0) return;

                this.recordUndoSnapshot();

                const slots = [...this.sortModuleSlots(course, module)];
                const relevantSlots = slots.filter(s => this.extractDateFromSlotKey(s) >= fromDate);

                let availableEvents = [...events];
                let matchedCount = 0;
                course.lessons = course.lessons || [];

                // Pass 1: exact date matching
                for (const slotKey of relevantSlots) {
                    const slotDate = this.extractDateFromSlotKey(slotKey);
                    const evIdx = availableEvents.findIndex(e => e.dateOnly === slotDate);
                    if (evIdx >= 0) {
                        const ev = availableEvents.splice(evIdx, 1)[0];
                        matchedCount++;
                        let lp = this.findLessonForSlot(course, module.id, slotKey);
                        if (!lp) {
                            lp = {
                                id: "les-" + Math.random().toString(36).substring(2, 8),
                                sectionId: module.id,
                                date: slotDate,
                                slotKey: slotKey,
                                time: ev.isAllDay ? (module.startTime || "19:00") : ev.startTimeDisplay,
                                endTime: ev.isAllDay ? (module.endTime || "20:30") : ev.endTimeDisplay,
                                googleMeetUrl: ev.hangoutLink || "",
                                googleCalendarEventId: ev.id
                            };
                            course.lessons.push(lp);
                        } else {
                            lp.googleCalendarEventId = ev.id;
                            if (ev.hangoutLink) lp.googleMeetUrl = ev.hangoutLink;
                        }
                        if (ev.hangoutLink && !module.googleMeetUrl) {
                            module.googleMeetUrl = ev.hangoutLink;
                        }
                    }
                }

                // Pass 2: chronological sequential matching for remaining unassociated slots
                for (const slotKey of relevantSlots) {
                    const slotDate = this.extractDateFromSlotKey(slotKey);
                    const lp = this.findLessonForSlot(course, module.id, slotKey);
                    const alreadyHasEv = lp && !!lp.googleCalendarEventId;
                    if (!alreadyHasEv && availableEvents.length > 0) {
                        const ev = availableEvents.shift();
                        matchedCount++;
                        if (!lp) {
                            const newLp = {
                                id: "les-" + Math.random().toString(36).substring(2, 8),
                                sectionId: module.id,
                                date: slotDate,
                                slotKey: slotKey,
                                time: ev.isAllDay ? (module.startTime || "19:00") : ev.startTimeDisplay,
                                endTime: ev.isAllDay ? (module.endTime || "20:30") : ev.endTimeDisplay,
                                googleMeetUrl: ev.hangoutLink || "",
                                googleCalendarEventId: ev.id
                            };
                            course.lessons.push(newLp);
                        } else {
                            lp.googleCalendarEventId = ev.id;
                            if (ev.hangoutLink) lp.googleMeetUrl = ev.hangoutLink;
                        }
                        if (ev.hangoutLink && !module.googleMeetUrl) {
                            module.googleMeetUrl = ev.hangoutLink;
                        }
                    }
                }

                this.persist();
                this.closeModal();
                this.showToast(`Associate con successo ${matchedCount} lezioni con gli eventi Google Calendar!`, "success");
                this.render();
            }

            async syncLessonToGoogle(course, module, lessonData, showIndividualToast = true) {
                if (!this.state.settings?.googleCalendarConnected) return;
                const token = await this.ensureValidGoogleToken();
                if (!token) return;

                const dateOnly = String(lessonData.slotKey || lessonData.date).substring(0, 10);
                const sTime = lessonData.time || module.startTime || "19:00";
                const eTime = lessonData.endTime || module.endTime || "20:30";

                const startDateTime = `${dateOnly}T${sTime}:00`;
                const endDateTime = `${dateOnly}T${eTime}:00`;
                const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

                const pSuffix = this.getParticipantSuffix(course, module);
                const customTitle = (lessonData.title || "").trim();
                const lessonIdx = (module.dates || []).indexOf(lessonData.slotKey);
                const lessonNum = lessonIdx >= 0 ? lessonIdx + 1 : ((module.dates || []).length || 1);
                const codePrefix = (course.code && course.code.trim()) ? `[${course.code.trim()}] ` : "";
                const summary = customTitle
                    ? `${codePrefix}${course.name} — ${module.name}: ${customTitle}${pSuffix}`
                    : `${codePrefix}${course.name} — ${module.name}: Lezione ${lessonNum}${pSuffix}`;

                const descLines = [];
                if (lessonData.objectives) descLines.push(`Obiettivi: ${lessonData.objectives}`);
                if (lessonData.topics) descLines.push(`Argomenti: ${lessonData.topics}`);
                if (lessonData.homework) descLines.push(`Compiti: ${lessonData.homework}`);
                if (lessonData.notes) descLines.push(`Note: ${lessonData.notes}`);

                const existingMeetUrl = (module.googleMeetUrl || lessonData.googleMeetUrl || "").trim();

                const payload = {
                    summary,
                    start: { dateTime: startDateTime, timeZone },
                    end: { dateTime: endDateTime, timeZone }
                };

                const attendees = Array.isArray(lessonData.invitedEmails) ? lessonData.invitedEmails : [];
                if (attendees.length > 0) {
                    payload.attendees = attendees.map(em => ({ email: em }));
                }

                // Only attach Google Meet details if the user/module explicitly configured a link
                // Do NOT automatically create a new conference to avoid conflicts with in-person or custom events
                if (existingMeetUrl) {
                    descLines.unshift(`Partecipa con Google Meet: ${existingMeetUrl}`);
                    payload.location = existingMeetUrl;
                }

                if (descLines.length > 0) {
                    payload.description = descLines.join("\n");
                }

                const isUpdate = !!lessonData.googleCalendarEventId;
                const endpoint = isUpdate
                    ? `https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(lessonData.googleCalendarEventId)}?conferenceDataVersion=1&sendUpdates=all`
                    : `https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1&sendUpdates=all`;

                try {
                    const res = await fetch(endpoint, {
                        method: isUpdate ? "PUT" : "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const eventObj = await res.json();
                        lessonData.googleCalendarEventId = eventObj.id;
                        if (eventObj.hangoutLink) {
                            lessonData.googleMeetUrl = eventObj.hangoutLink;
                        }
                        this.persist();
                        if (showIndividualToast) {
                            this.showToast("Lezione sincronizzata con Google Calendar!", "success");
                        }
                    }
                } catch (err) {
                    console.error("Google Calendar sync error:", err);
                }
            }

            async deleteLessonFromGoogle(eventId) {
                if (!eventId || !this.state.settings?.googleCalendarConnected) return;
                const token = await this.ensureValidGoogleToken();
                if (!token) return;

                try {
                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(eventId)}?sendUpdates=all`, {
                        method: "DELETE",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                } catch (e) {
                    console.warn("Delete Google event error:", e);
                }
            }
        }

        const app = new ClassRegisterApp();
        window.app = app;
        
        // Global Keyboard Shortcut: Ctrl+Z / Cmd+Z for Undo
        window.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z") && !e.shiftKey) {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
                if (activeTag === "input" || activeTag === "textarea") return;
                e.preventDefault();
                if (window.app && typeof window.app.performUndo === "function") {
                    window.app.performUndo();
                }
            }
        });
        window.addEventListener("DOMContentLoaded", () => app.init());
    </script>
</body>
