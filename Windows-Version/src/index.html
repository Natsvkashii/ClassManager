                `;
            }

            /**
             * Attendance Register View:
             * - Lesson number is alone at the top
             * - Date is below the lesson number
             * - Time is below the date
             * - Lesson title is at the bottom
             */
            renderAttendanceView(container) {
                const course = this.getActiveCourse();
                if (!course || course.archived) {
                    this.renderHomeView(container);
                    return;
                }
                const activeLevel = this.getActiveLevel(course);
                const activeSection = this.getActiveSection(course);
                if (!activeLevel || !activeSection) return;

                const modStudents = this.getModuleStudents(course, activeSection);
                const dates = [...this.sortModuleSlots(course, activeSection)];
                const selectedDatesCount = Array.from(this.selectedDatesForDelete).filter(d => dates.includes(d)).length;

                container.innerHTML = `
                    <div class="space-y-4">
                        <!-- Compact Action Toolbar -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-3.5 shadow-xs flex flex-wrap items-center justify-between gap-3">
                            <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-3">
                                <span><strong class="text-slate-800 dark:text-slate-100">${modStudents.length}</strong> ${this.t("enrolledLower")}</span>
                                <span>•</span>
                                <span><strong class="text-slate-800 dark:text-slate-100">${dates.length}</strong> ${this.t("lessonsLower")}</span>
                                ${activeSection.description ? `<span class="hidden sm:inline">• ${this.escapeHtml(activeSection.description)}</span>` : ''}
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="app.openAddDateModal()" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-calendar-plus"></i> ${this.t("addDateBtn")}
                                </button>
                                <button onclick="app.openRecurringGeneratorModal()" class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-navy-800 text-xs font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-repeat text-sky-600"></i> ${this.t("recurringBtn")}
                                </button>
                                <button onclick="app.toggleAttendanceDateEditMode()" class="px-3 py-1.5 rounded-xl border ${this.attendanceDateEditMode ? 'bg-amber-500 text-white border-amber-500 shadow-xs' : 'border-sky-200 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-navy-800 text-slate-700 dark:text-slate-200'} text-xs font-bold flex items-center gap-1.5 transition">
                                    <i class="fa-solid ${this.attendanceDateEditMode ? 'fa-check' : 'fa-pen-to-square text-sky-600'}"></i>
                                    ${this.attendanceDateEditMode ? this.t("exitEditDatesModeBtn") : this.t("editDatesModeBtn")}
                                </button>
                                <button onclick="app.openManageModuleStudentsModal()" class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-navy-800 text-xs font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-user-plus text-sky-600"></i> ${this.t("addStudentToModBtn")}
                                </button>
                            </div>
                        </div>

                        ${this.attendanceDateEditMode && dates.length > 0 ? `
                            <div id="attendanceBatchToolbarContainer" class="bg-amber-50/90 dark:bg-amber-950/30 border border-amber-300 dark:border-amber-800 rounded-2xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
                                <div class="flex flex-wrap items-center gap-3">
                                    <label class="flex items-center gap-2 font-extrabold text-amber-900 dark:text-amber-200 cursor-pointer">
                                        <input type="checkbox" onchange="app.toggleSelectAllModuleDates(this.checked)" ${selectedDatesCount === dates.length && dates.length > 0 ? 'checked' : ''} class="w-4 h-4 accent-rose-600 rounded">
                                        <span>${this.t("allDatesLabel")} (${dates.length})</span>
                                    </label>
                                    <span id="attendanceBatchSelectedCount" class="text-amber-700 dark:text-amber-300 font-semibold">• ${selectedDatesCount} ${this.t("selectedLower")}</span>
                                </div>
                                <div id="attendanceBatchActionsContainer" class="flex items-center gap-2">
                                    ${selectedDatesCount > 0 ? `
                                        <button onclick="app.confirmBatchDeleteDates()" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold flex items-center gap-1.5 shadow-2xs transition">
                                            <i class="fa-solid fa-trash-can"></i> ${this.t("deleteBtn")} (${selectedDatesCount})
                                        </button>
                                    ` : `<span class="text-[11px] text-amber-700 dark:text-amber-400">${this.t("selectDatesToDeleteHint")}</span>`}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Attendance Table -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 shadow-xs overflow-hidden">
                            <div id="attendanceScrollContainer" class="overflow-x-auto custom-scrollbar">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-sky-50/80 dark:bg-navy-800/90 border-b border-sky-100 dark:border-slate-800 text-slate-600 dark:text-slate-300">
                                            <th class="sticky-col align-top bg-sky-50 dark:bg-navy-800 px-4 py-3 font-extrabold min-w-[220px] min-h-[82px] border-r border-sky-100 dark:border-slate-800">
                                                <div class="h-full flex items-center">
                                                    <span>${this.t("studentCol")} (${modStudents.length})</span>
                                                </div>
                                            </th>
                                            ${dates.map((slotKey, idx) => {
                                                const dOnly = this.extractDateFromSlotKey(slotKey);
                                                const lessonObj = this.findLessonForSlot(course, activeSection.id, slotKey);
                                                const sTime = lessonObj?.time || activeSection.startTime || course.startTime || "19:00";
                                                const eTime = lessonObj?.endTime || activeSection.endTime || course.endTime || "20:30";
                                                const isDateSelected = this.selectedDatesForDelete.has(slotKey);
                                                return `
                                                    <th data-slotkey="${this.escapeHtml(slotKey)}" class="align-top px-2 py-2.5 text-center font-bold min-w-[122px] border-r border-sky-100/60 dark:border-slate-800 group ${isDateSelected ? 'bg-rose-50/80 dark:bg-rose-950/30' : ''}">
                                                        <button onclick="app.openLessonPlanModal('${course.id}', '${activeSection.id}', '${slotKey}')" class="w-full min-h-[76px] rounded-lg p-1 hover:bg-sky-100/70 dark:hover:bg-navy-900 transition flex flex-col items-center justify-between" title="${this.t("lessonPlanTitle")}">
                                                            <div class="flex items-center justify-center text-[10px] text-sky-700 dark:text-sky-400 font-extrabold">
                                                                <span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-navy-900">${idx + 1}</span>
                                                            </div>
                                                            <div class="text-[11px] text-slate-800 dark:text-slate-100 underline decoration-dotted underline-offset-2 mt-1">${this.escapeHtml(this.formatShortWeekdayDate(dOnly))}</div>
                                                            <div class="text-[9px] font-bold text-slate-400 mt-0.5">${this.formatTimeDisplay(sTime)}-${this.formatTimeDisplay(eTime)}</div>
                                                            ${lessonObj?.title ? `<div class="text-[10px] font-bold text-emerald-700 dark:text-emerald-300 max-w-[130px] truncate mt-1">${this.escapeHtml(lessonObj.title)}</div>` : ''}
                                                        </button>
                                                        ${this.attendanceDateEditMode ? `
                                                            <div class="flex items-center justify-center gap-1.5 mt-1.5 pt-1 border-t border-sky-200/60 dark:border-slate-700">
                                                                <input type="checkbox" onchange="app.toggleDateSelectionForDelete('${slotKey}', this.checked)" ${isDateSelected ? 'checked' : ''} class="w-3.5 h-3.5 accent-rose-600 rounded cursor-pointer">
                                                                <button onclick="app.openEditSingleDateModal('${slotKey}')" class="w-6 h-6 rounded-md bg-amber-100 dark:bg-amber-950/70 text-amber-700 dark:text-amber-300 hover:bg-amber-200 flex items-center justify-center text-[10px]" title="${this.t("editBtn")}">
                                                                    <i class="fa-solid fa-calendar-day"></i>
                                                                </button>
                                                                <button onclick="app.confirmRemoveDateFromModule('${slotKey}')" class="w-6 h-6 rounded-md bg-rose-100 dark:bg-rose-950/70 text-rose-600 dark:text-rose-300 hover:bg-rose-200 flex items-center justify-center text-[10px]" title="${this.t("deleteBtn")}">
                                                                    <i class="fa-solid fa-trash-can"></i>
                                                                </button>
                                                            </div>
                                                        ` : ''}
                                                    </th>
                                                `;
                                            }).join("")}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-sky-100/60 dark:divide-slate-800">
                                        ${modStudents.length === 0 ? `
                                            <tr>
                                                <td colspan="${Math.max(2, dates.length + 1)}" class="px-6 py-10 text-center text-slate-400">
                                                    ${this.t("noStudentsInModulePrompt")} <strong>"${this.t("addStudentToModBtn")}"</strong> ${this.t("toEnrollThem")}
                                                </td>
                                            </tr>
                                        ` : modStudents.map(st => {
                                            const stAtt = activeSection.attendance?.[st.id] || {};
                                            return `
                                                <tr class="hover:bg-sky-50/40 dark:hover:bg-navy-800/50 transition">
                                                    <td class="sticky-col bg-white dark:bg-navy-900 px-4 py-3 font-bold text-slate-900 dark:text-white border-r border-sky-100 dark:border-slate-800">
                                                        <button onclick="app.openStudentDetailModal('${st.id}')" class="hover:text-sky-600 dark:hover:text-sky-400 text-left truncate block w-full">
                                                            ${this.escapeHtml(st.name)}
                                                        </button>
                                                    </td>
                                                    ${dates.map(dStr => {
                                                        const val = stAtt[dStr] || "";
                                                        let btnClass = "bg-slate-100 dark:bg-navy-800 text-slate-400";
                                                        if (val === "P") btnClass = "bg-emerald-500 text-white font-extrabold shadow-2xs";
                                                        else if (val === "A") btnClass = "bg-rose-500 text-white font-extrabold shadow-2xs";
                                                        else if (val === "G") btnClass = "bg-amber-500 text-white font-extrabold shadow-2xs";
                                                        return `
                                                            <td class="px-2 py-2 text-center border-r border-sky-100/50 dark:border-slate-800/70">
                                                                <button onclick="app.cycleAttendance('${st.id}', '${dStr}', this)" class="w-9 h-8 rounded-lg text-xs transition ${btnClass}">
                                                                    ${val || "·"}
                                                                </button>
                                                            </td>
                                                        `;
                                                    }).join("")}
                                                </tr>
                                            `;
                                        }).join("")}
                                    </tbody>
                                </table>
                            </div>
                            <div class="px-4 py-2.5 bg-sky-50/50 dark:bg-navy-800/50 border-t border-sky-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-4">
                                    <span><strong class="text-emerald-600">P</strong> = ${this.t("presentLabel")}</span>
                                    <span><strong class="text-rose-600">A</strong> = ${this.t("absentLabel")}</span>
                                    <span><strong class="text-amber-600">G</strong> = ${this.t("justifiedLabel")}</span>
                                </div>
                                <span>${this.t("attendanceFooterHint")}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            toggleAttendanceDateEditMode() {
                this.attendanceDateEditMode = !this.attendanceDateEditMode;
                if (!this.attendanceDateEditMode) {
                    this.selectedDatesForDelete.clear();
                }
                this.renderMainView();
            }

            toggleDateSelectionForDelete(dateStr, isChecked) {
                if (isChecked) this.selectedDatesForDelete.add(dateStr);
                else this.selectedDatesForDelete.delete(dateStr);

                // Targeted in-place DOM update (avoids entire view re-render and jitter)
                const th = document.querySelector(`th[data-slotkey="${CSS.escape(dateStr)}"]`);
                if (th) {
                    if (isChecked) {
                        th.classList.add('bg-rose-50/80', 'dark:bg-rose-950/30');
                    } else {
                        th.classList.remove('bg-rose-50/80', 'dark:bg-rose-950/30');
                    }
                }
                this.updateAttendanceBatchToolbar();
            }

            toggleSelectAllModuleDates(isChecked) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!sec) return;
                if (isChecked) {
                    (sec.dates || []).forEach(d => this.selectedDatesForDelete.add(d));
                } else {
                    this.selectedDatesForDelete.clear();
                }
                document.querySelectorAll('th[data-slotkey]').forEach(th => {
                    const sk = th.getAttribute('data-slotkey');
                    const cb = th.querySelector('input[type="checkbox"]');
                    const isSel = this.selectedDatesForDelete.has(sk);
                    if (cb) cb.checked = isSel;
                    if (isSel) {
                        th.classList.add('bg-rose-50/80', 'dark:bg-rose-950/30');
                    } else {
                        th.classList.remove('bg-rose-50/80', 'dark:bg-rose-950/30');
                    }
                });
                this.updateAttendanceBatchToolbar();
            }

            updateAttendanceBatchToolbar() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!sec) return;
                const dates = Array.isArray(sec.dates) ? sec.dates : [];
                const selectedDatesCount = Array.from(this.selectedDatesForDelete).filter(d => dates.includes(d)).length;

                const countEl = document.getElementById("attendanceBatchSelectedCount");
                if (countEl) {
                    countEl.textContent = `• ${selectedDatesCount} ${this.t("selectedLower")}`;
                }
                const actionsCont = document.getElementById("attendanceBatchActionsContainer");
                if (actionsCont) {
                    actionsCont.innerHTML = selectedDatesCount > 0 ? `
                        <button onclick="app.confirmBatchDeleteDates()" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold flex items-center gap-1.5 shadow-2xs transition">
                            <i class="fa-solid fa-trash-can"></i> ${this.t("deleteBtn")} (${selectedDatesCount})
                        </button>
                    ` : `<span class="text-[11px] text-amber-700 dark:text-amber-400">${this.t("selectDatesToDeleteHint")}</span>`;
                }
                const selectAllCb = document.querySelector('#attendanceBatchToolbarContainer input[type="checkbox"]');
                if (selectAllCb) {
                    selectAllCb.checked = (selectedDatesCount === dates.length && dates.length > 0);
                }
            }

            confirmBatchDeleteDates() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const toDelete = Array.from(this.selectedDatesForDelete).filter(d => (sec.dates || []).includes(d)).sort();
                if (toDelete.length === 0) return;

                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <h3 class="text-base font-bold text-rose-600">${this.t("confirmDeleteTitle")} (${toDelete.length} ${this.t("lessonsLower")})</h3>
                        <div class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2.5 rounded-xl bg-rose-50/60 dark:bg-rose-950/30 border border-rose-200/70 dark:border-rose-900/50">
                            ${toDelete.map(d => `<span class="px-2 py-1 rounded-lg bg-white dark:bg-navy-800 font-bold text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800">${this.formatDateDisplay(this.extractDateFromSlotKey(d))}</span>`).join("")}
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700">${this.t("cancelBtn")}</button>
                            <button onclick="app.executeBatchDeleteDates()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">${this.t("deleteBtn")} (${toDelete.length})</button>
                        </div>
                    </div>
                `);
            }

            executeBatchDeleteDates() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const toDeleteSet = new Set(this.selectedDatesForDelete);
                const removedCount = (sec.dates || []).filter(d => toDeleteSet.has(d)).length;

                sec.dates = (sec.dates || []).filter(d => !toDeleteSet.has(d));
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        toDeleteSet.forEach(d => {
                            if (sec.attendance[stId]) delete sec.attendance[stId][d];
                        });
                    });
                }
                if (Array.isArray(course.lessons)) {
                    course.lessons = course.lessons.filter(l => {
                        if (l.sectionId && l.sectionId !== sec.id) return true;
                        if (l.slotKey && toDeleteSet.has(l.slotKey)) return false;
                        if (!l.slotKey && toDeleteSet.has(l.date)) return false;
                        return true;
                    });
                }
                this.selectedDatesForDelete.clear();
                this.persist();
                this.closeModal();
                this.renderAll();
                this.showToast(`${removedCount} ${this.t("lessonsLower")}`, "info");
            }

            openEditSingleDateModal(oldSlotKey) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const dOnly = this.extractDateFromSlotKey(oldSlotKey);
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white">${this.t("editBtn")} (${this.formatDateDisplay(dOnly)})</h3>
                        <form onsubmit="app.confirmEditSingleDate(event, '${oldSlotKey}')" class="space-y-3">
                            <div>
                                <input type="date" id="editedSingleDateInput" required value="${dOnly}" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700">${this.t("cancelBtn")}</button>
                                <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-bold">${this.t("saveBtn")}</button>
                            </div>
                        </form>
                    </div>
                `);
            }

            confirmEditSingleDate(e, oldSlotKey) {
                e.preventDefault();
                const newDateStr = document.getElementById("editedSingleDateInput").value;
                const oldDateOnly = this.extractDateFromSlotKey(oldSlotKey);
                if (!newDateStr || newDateStr === oldDateOnly) {
                    this.closeModal(true);
                    return;
                }
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                let newSlotKey = newDateStr;
                if (sec.dates.includes(newSlotKey)) {
                    newSlotKey = `${newDateStr}__${Math.random().toString(36).substr(2, 5)}`;
                }

                const idx = sec.dates.indexOf(oldSlotKey);
                if (idx >= 0) {
                    sec.dates[idx] = newSlotKey;
                }
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        if (sec.attendance[stId] && sec.attendance[stId][oldSlotKey] !== undefined) {
                            sec.attendance[stId][newSlotKey] = sec.attendance[stId][oldSlotKey];
                            delete sec.attendance[stId][oldSlotKey];
                        }
                    });
                }
                const les = this.findLessonForSlot(course, sec.id, oldSlotKey);
                if (les) {
                    les.date = newDateStr;
                    les.slotKey = newSlotKey;
                }
                this.sortModuleSlots(course, sec);
                this.persist();
                this.closeModal(true);
                this.renderAll();
            }

            cycleAttendance(studentId, dateStr, btnElement = null) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                if (!sec.attendance[studentId]) sec.attendance[studentId] = {};
                const order = ["", "P", "A", "G"];
                const curr = sec.attendance[studentId][dateStr] || "";
                const next = order[(order.indexOf(curr) + 1) % order.length];
                if (next === "") delete sec.attendance[studentId][dateStr];
                else sec.attendance[studentId][dateStr] = next;
                this.persist();

                // In-place button update to eliminate layout reflow and scroll jumps
                const btn = btnElement || (typeof event !== 'undefined' ? event?.currentTarget : null);
                if (btn && btn.tagName === 'BUTTON') {
                    btn.textContent = next || "·";
                    let btnClass = "w-9 h-8 rounded-lg text-xs transition bg-slate-100 dark:bg-navy-800 text-slate-400";
                    if (next === "P") btnClass = "w-9 h-8 rounded-lg text-xs transition bg-emerald-500 text-white font-extrabold shadow-2xs";
                    else if (next === "A") btnClass = "w-9 h-8 rounded-lg text-xs transition bg-rose-500 text-white font-extrabold shadow-2xs";
                    else if (next === "G") btnClass = "w-9 h-8 rounded-lg text-xs transition bg-amber-500 text-white font-extrabold shadow-2xs";
                    btn.className = btnClass;
                } else {
                    this.renderMainView();
                }
            }

            getStudentAttendanceEvaluationInfo(course, studentId, moduleObj = null) {
                if (!course) return { score: 0, recordedCount: 0, totalLessons: 0, isComplete: false };
                const mod = moduleObj || this.getActiveSection(course);
                const dates = Array.isArray(mod?.dates) ? mod.dates : [];
                const totalLessons = dates.length;
                if (totalLessons === 0) {
                    return { score: 0, recordedCount: 0, totalLessons: 0, isComplete: false };
                }
                const stAtt = (mod.attendance && mod.attendance[studentId]) || {};
                let recordedCount = 0;
                let creditCount = 0;
                dates.forEach(dStr => {
                    const status = stAtt[dStr];
                    if (status === "P" || status === "G" || status === "A") {
                        recordedCount++;
                        if (status === "P" || status === "G") {
                            creditCount++;
                        }
                    }
                });
                const score = Number(((creditCount / totalLessons) * 10).toFixed(2));
                const isComplete = totalLessons > 0 && recordedCount === totalLessons;
                return { score, recordedCount, totalLessons, isComplete };
            }

            calculateStudentAttendanceScore(course, studentId, moduleObj = null) {
                const info = this.getStudentAttendanceEvaluationInfo(course, studentId, moduleObj);
                return info.isComplete ? info.score : null;
            }

            isAttendanceEvaluationEnabled(course, moduleObj = null) {
                if (!course) return false;
                const mod = moduleObj || this.getActiveSection(course);
                if (mod && mod.evaluateAttendance !== undefined) {
                    return !!mod.evaluateAttendance;
                }
                return !!course.gradeConfig?.evaluateAttendance;
            }

            getAttendanceWeight(course, moduleObj = null) {
                if (!course) return 5;
                const mod = moduleObj || this.getActiveSection(course);
                if (mod && mod.attendanceWeight !== undefined) {
                    return Math.max(0, parseFloat(mod.attendanceWeight) || 0);
                }
                return Math.max(0, parseFloat(course.gradeConfig?.attendanceWeight) ?? 5);
            }

            /**
             * Checks whether ALL required evaluations for a student are present:
             * - Every activity in the course must have a numeric grade recorded for the student
             * - If attendance evaluation is enabled, all module lessons must be recorded for the student
             * - At least one evaluation element (activity or attendance) must exist
             */
            areAllStudentGradesPresent(course, studentId, moduleObj = null) {
                if (!course || !course.gradeConfig) return false;
                const cfg = course.gradeConfig;
                const acts = cfg.activities || [];
                const evalAtt = this.isAttendanceEvaluationEnabled(course, moduleObj);
                const stGrades = (course.grades && course.grades[studentId]) ? course.grades[studentId] : {};

                if (acts.length === 0 && !evalAtt) return false;

                for (const a of acts) {
                    const raw = stGrades[a.id];
                    if (raw === undefined || raw === "" || raw === null || isNaN(parseFloat(raw))) {
                        return false;
                    }
                }

                if (evalAtt) {
                    const attInfo = this.getStudentAttendanceEvaluationInfo(course, studentId, moduleObj);
                    if (!attInfo.isComplete) return false;
                }

                return true;
            }

            toggleCourseAttendanceEvaluation(isChecked) {
                const course = this.getActiveCourse();
                const mod = this.getActiveSection(course);
                if (!course) return;
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.evaluateAttendance = !!isChecked;
                if (course.gradeConfig.attendanceWeight === undefined) course.gradeConfig.attendanceWeight = 5;
                if (mod) {
                    mod.evaluateAttendance = !!isChecked;
                    if (mod.attendanceWeight === undefined) mod.attendanceWeight = course.gradeConfig.attendanceWeight || 5;
                }
                this.persist();
                this.renderMainView();
            }

            updateCourseAttendanceWeight(val) {
                const course = this.getActiveCourse();
                const mod = this.getActiveSection(course);
                if (!course) return;
                const num = Math.min(100, Math.max(0, parseFloat(val) || 0));
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.attendanceWeight = num;
                if (mod) mod.attendanceWeight = num;
                this.persist();
                this.renderMainView();
            }

            /**
             * Dedicated "Voti" View:
             * - Presenze header shows no icon and only the percentage below (no "Peso:" or "(Auto)")
             * - Media header and student average badge do not display "/ 10"
             * - Student outcome (Promosso / Recupero) is shown ONLY when all grades are present
             */
            renderGradesView(container) {
                const course = this.getActiveCourse();

                container.innerHTML = `
                    <div class="space-y-5">

                            <select onchange="app.updateGradeConfigMethod(this.value)" class="rounded-xl border border-sky-200 dark:border-slate-700 bg-sky-50/50 dark:bg-navy-800 px-3 py-1.5 font-bold">
                                <option value="average" ${cfg.calcMethod === 'average' ? 'selected' : ''}>${this.t("calcMethodAverage")}</option>

                                <span class="font-semibold">Min:</span>
                                <input type="text" inputmode="decimal" value="${cfg.minPass ?? 6}" onchange="app.updateGradeMinPass(this.value)" class="w-12 bg-transparent font-extrabold text-center focus:outline-none">
                            </div>
                            <!-- Attendance Evaluation Quick Control (Base 5%) -->
                            <div class="flex items-center gap-2 bg-emerald-50/70 dark:bg-emerald-950/30 px-3 py-1.5 rounded-xl border border-emerald-200 dark:border-emerald-800/70">
                                <label class="flex items-center gap-1.5 font-bold text-emerald-800 dark:text-emerald-300 cursor-pointer">
                                    <input type="checkbox" onchange="app.toggleCourseAttendanceEvaluation(this.checked)" ${evalAtt ? 'checked' : ''} class="w-3.5 h-3.5 accent-emerald-600 rounded">

                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 shadow-xs overflow-hidden">
                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-sky-50/80 dark:bg-navy-800 border-b border-sky-100 dark:border-slate-800">

                                                </div>
                                            </th>
                                            ${evalAtt ? `
                                                <th class="px-3 py-3 text-center font-extrabold min-w-[120px] bg-emerald-50/50 dark:bg-emerald-950/20 border-r border-sky-100/60 dark:border-slate-800">
                                                    <div class="text-emerald-700 dark:text-emerald-300 flex items-center justify-center">
                                                        <span>${this.t("navAttendance")}</span>
                                                    </div>
                                                    <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold block mt-0.5">${attWeight}%</span>
                                                </th>
                                            ` : ''}
                                            ${activities.map(act => {
                                                const rubricEnabled = !!(act.useRubric && act.rubricId && rubrics.some(r => r.id === act.rubricId));
                                                return `
                                                    <th class="px-3 py-3 text-center font-bold min-w-[150px] border-r border-sky-100/60 dark:border-slate-800">

                                                        <div class="flex items-center justify-center gap-1.5 mt-0.5">
                                                            ${cfg.calcMethod === 'weighted' ? `<span class="text-[10px] text-sky-600">${act.weight || 0}%</span>` : ''}
                                                            ${rubricEnabled ? `<span class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-extrabold"><i class="fa-solid fa-table-cells-large mr-0.5"></i>${this.t("rubricBadgeShort")}</span>` : ''}
                                                        </div>

                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-sky-100/60 dark:divide-slate-800">
                                        ${modStudents.length === 0 ? `
                                            <tr>
                                                <td colspan="${Math.max(2, activities.length + (evalAtt ? 2 : 1))}" class="px-6 py-10 text-center text-slate-400">

                                                </td>
                                            </tr>
                                        ` : modStudents.map(st => {
                                            const stGrades = (course.grades && course.grades[st.id]) ? course.grades[st.id] : {};
                                            const avg = this.calculateStudentCourseAverage(course, st.id, activeSection);
                                            const allEvaluated = this.areAllStudentGradesPresent(course, st.id, activeSection);
                                            const passed = allEvaluated && avg !== null && avg >= (cfg.minPass || 6);
                                            const attInfo = evalAtt ? this.getStudentAttendanceEvaluationInfo(course, st.id, activeSection) : null;

                                            let statusIconHtml = `<span class="w-6 h-6 rounded-full bg-slate-100 dark:bg-navy-800 text-slate-400 inline-flex items-center justify-center shrink-0" title="${this.t("pendingBadge")} (${this.t("pendingEvalSub")})"><i class="fa-solid fa-minus text-[10px]"></i></span>`;
                                            if (allEvaluated && avg !== null) {
                                                if (passed) {
                                                    statusIconHtml = `<span class="w-6 h-6 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 inline-flex items-center justify-center shrink-0 shadow-2xs" title="${this.t("passedBadge")} (≥ ${cfg.minPass || 6})"><i class="fa-solid fa-circle-check text-xs"></i></span>`;
                                                } else {
                                                    statusIconHtml = `<span class="w-6 h-6 rounded-full bg-rose-100 dark:bg-rose-950/80 text-rose-600 dark:text-rose-400 inline-flex items-center justify-center shrink-0 shadow-2xs" title="${this.t("recoverBadge")} (< ${cfg.minPass || 6})"><i class="fa-solid fa-triangle-exclamation text-xs"></i></span>`;
                                                }
                                            }

                                            let avgBadgeClass = "bg-slate-100 dark:bg-navy-800 text-slate-400";
                                            if (avg !== null) {
                                                if (!allEvaluated) {
                                                    avgBadgeClass = "bg-slate-100 dark:bg-navy-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700";
                                                } else if (passed) {
                                                    avgBadgeClass = "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800";
                                                } else {
                                                    avgBadgeClass = "bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800";
                                                }
                                            }

                                            return `
                                                <tr class="hover:bg-sky-50/40 dark:hover:bg-navy-800/50">
                                                    <td class="sticky-col bg-white dark:bg-navy-900 px-4 py-3 font-bold border-r border-sky-100 dark:border-slate-800">
                                                        <div class="flex items-center justify-between gap-2">
                                                            <div class="flex items-center gap-2.5 min-w-0">
                                                                ${statusIconHtml}
                                                                <button onclick="app.openStudentDetailModal('${st.id}')" class="hover:text-sky-600 truncate text-left">${this.escapeHtml(st.name)}</button>
                                                            </div>
                                                            <span class="px-2.5 py-1 rounded-lg font-extrabold text-xs shrink-0 ${avgBadgeClass}" title="${this.t("finalAvgCol")}">
                                                                ${avg !== null ? `${avg.toFixed(2)}` : "—"}
                                                            </span>
                                                        </div>
                                                    </td>
                                                    ${evalAtt ? `
                                                        <td class="px-3 py-2 text-center border-r border-sky-100/50 dark:border-slate-800/70 ${attInfo?.isComplete ? 'bg-emerald-50/20 dark:bg-emerald-950/10' : 'bg-slate-50/40 dark:bg-navy-950/20'}">
                                                            ${attInfo && attInfo.totalLessons > 0 ? (
                                                                attInfo.isComplete ? `

                                                    ${activities.map(act => {

                                                        const hasVal = val !== "" && val !== null;
                                                        return `

                                                                <div class="inline-flex items-center gap-1.5">
                                                                    <input type="text" inputmode="decimal" value="${val}" placeholder="0-10"
                                                                        onchange="app.updateStudentGrade('${st.id}', '${act.id}', this.value)"
                                                                        class="w-16 h-8 text-center rounded-xl border ${hasVal ? 'border-sky-300 dark:border-sky-600/70 bg-white dark:bg-navy-800 text-slate-900 dark:text-white shadow-2xs' : 'border-slate-200/80 dark:border-slate-700/80 bg-slate-50/60 dark:bg-navy-950/50 text-slate-700 dark:text-slate-200'} px-2 text-xs font-extrabold placeholder:text-slate-300 dark:placeholder:text-slate-600 placeholder:font-normal placeholder:text-[10px] hover:border-sky-300 dark:hover:border-slate-600 focus:bg-white dark:focus:bg-navy-900 focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500 transition">
                                                                    ${rubricEnabledForAct ? `
                                                                        <button onclick="app.openStudentRubricEvaluationModal('${st.id}', '${act.id}')" class="w-8 h-8 rounded-xl border ${evalRecord ? 'bg-emerald-600 text-white border-emerald-600 shadow-2xs' : 'border-sky-200 dark:border-slate-700 bg-sky-50/70 dark:bg-navy-800 text-sky-700 dark:text-sky-300 hover:bg-sky-100'} flex items-center justify-center transition" title="${this.t("evalWithRubricTitle")}">
                                                                            <i class="fa-solid fa-table-cells-large text-xs"></i>
                                                                        </button>
                                                                    ` : ''}
                                                                </div>
                                                            </td>
                                                        `;
                                                    }).join("")}
                                                </tr>
                                            `;
                                        }).join("")}
                                    </tbody>
                                </table>
                            </div>

                            <!-- Bottom Outcome & Evaluation Legend -->
                            <div class="px-4 py-3 bg-sky-50/50 dark:bg-navy-800/50 border-t border-sky-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-[11px] text-slate-600 dark:text-slate-300">
                                <div class="flex flex-wrap items-center gap-4">
                                    <span class="font-extrabold uppercase tracking-wider text-[10px] text-slate-400">${this.t("outcomeLegendTitle")}</span>
                                    <span class="inline-flex items-center gap-1.5">
                                        <span class="w-5 h-5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 inline-flex items-center justify-center"><i class="fa-solid fa-circle-check text-[10px]"></i></span>
                                        <strong>${this.t("passedBadge")}</strong> (≥ ${cfg.minPass ?? 6})
                                    </span>
                                    <span class="inline-flex items-center gap-1.5">
                                        <span class="w-5 h-5 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 inline-flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></span>
                                        <strong>${this.t("recoverBadge")}</strong> (&lt; ${cfg.minPass ?? 6})

                                        <span class="w-5 h-5 rounded-full bg-slate-100 dark:bg-navy-800 text-slate-400 inline-flex items-center justify-center"><i class="fa-solid fa-minus text-[9px]"></i></span>
                                        <strong>${this.t("pendingBadge")}</strong> (${this.t("pendingEvalSub")})
