                                <div class="text-slate-500">
                                    <i class="fa-solid fa-table-cells-large text-emerald-600 mr-1"></i>${this.t("rubricIconLegendHint")}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            /**
             * Dedicated "Attività" View (Removed "Valutazione libera (senza griglia)" and its alternatives)
             */
            renderActivitiesView(container) {
                const course = this.getActiveCourse();
                if (!course) {
                    this.renderHomeView(container);
                    return;
                }
                if (!course.gradeConfig) {
                    course.gradeConfig = { calcMethod: "average", minPass: 6, evaluateAttendance: false, attendanceWeight: 5, activities: [] };
                }
                const cfg = course.gradeConfig;
                const activities = cfg.activities || [];
                const rubrics = this.state.rubrics || [];

                container.innerHTML = `
                    <div class="space-y-5">
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs space-y-4">
                            <div class="flex flex-wrap items-center justify-end gap-2 text-xs">
                                <button onclick="app.openRubricsManagerModal()" class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-navy-800 font-bold flex items-center gap-1.5 text-sky-700 dark:text-sky-300">
                                    <i class="fa-solid fa-table-cells-large"></i> ${this.t("rubricsLabel")}
                                </button>
                                <button onclick="app.openActivityModal()" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center gap-1.5 shadow-2xs">
                                    <i class="fa-solid fa-plus"></i> ${this.t("newActivityBtn")}
                                </button>
                            </div>

                            ${activities.length === 0 ? `
                                <div class="p-10 rounded-2xl border border-dashed border-sky-200 dark:border-slate-700 text-center space-y-3 bg-sky-50/30 dark:bg-navy-950/40">
                                    <p class="text-xs font-bold text-slate-600 dark:text-slate-300">${this.t("noActivitiesPrompt")}</p>
                                </div>
                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 pt-2">
                                    ${activities.map(act => {
                                        const linkedRubric = act.useRubric ? rubrics.find(r => r.id === act.rubricId) : null;
                                        return `
                                            <div onclick="app.openActivityModal('${act.id}')" class="cursor-pointer p-4 rounded-xl border border-sky-100 dark:border-slate-800 hover:border-sky-400 dark:hover:border-sky-500 bg-sky-50/40 dark:bg-navy-800/60 flex flex-col justify-between gap-3 text-xs transition group">
                                                <div class="space-y-1.5">
                                                    <div class="flex items-start justify-between gap-2">
                                                        <h4 class="font-extrabold text-slate-900 dark:text-white group-hover:text-sky-600 dark:group-hover:text-sky-400 transition">${this.escapeHtml(act.name)}</h4>
                                                        <div class="flex items-center gap-1 shrink-0">
                                                            ${linkedRubric ? `<span class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold" title="${this.escapeHtml(linkedRubric.name)}"><i class="fa-solid fa-table-cells mr-1"></i>${this.t("rubricBadgeShort")}</span>` : ''}
                                                            ${cfg.calcMethod === 'weighted' ? `<span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 text-[10px] font-bold">${act.weight || 0}%</span>` : ''}
                                                        </div>
                                                    </div>
                                                    ${(act.startDate || act.endDate) ? `
                                                        <div class="text-[11px] font-semibold text-sky-700 dark:text-sky-400 flex flex-wrap items-center gap-2">
                                                            ${act.startDate ? `<span><i class="fa-regular fa-calendar mr-1"></i>${this.formatDateDisplay(act.startDate)}</span>` : ''}
                                                            ${act.endDate && act.endDate !== act.startDate ? `<span>→ ${this.formatDateDisplay(act.endDate)}</span>` : ''}
                                                        </div>
                                                    ` : ''}
                                                    ${act.objectives ? `<p class="text-[11px] text-slate-600 dark:text-slate-300 line-clamp-2">${this.escapeHtml(act.objectives)}</p>` : ''}
                                                </div>
                                                <div class="flex items-center justify-between gap-2 pt-2 border-t border-sky-100/70 dark:border-slate-700/60" onclick="event.stopPropagation()">
                                                    <span class="text-[10px] text-slate-400">${act.createdAt ? this.formatCreatedAtDisplay(act.createdAt) : ''}</span>
                                                    <div class="flex items-center gap-2">
                                                        <button onclick="app.deleteActivity('${act.id}')" class="text-rose-500 hover:underline text-[11px] font-semibold">${this.t("deleteBtn")}</button>
                                                    </div>
                                                </div>
                                            </div>
                                        `;
                                    }).join("")}
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            openRubricsManagerModal() {
                const rubrics = this.state.rubrics || [];
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs max-h-[88vh] overflow-y-auto custom-scrollbar">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <div>
                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("rubricsLabel")}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="app.openRubricEditorModal()" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> ${this.t("newRubricBtn")}
                                </button>
                                <button onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>

                        ${rubrics.length === 0 ? `
                            <p class="text-slate-400 text-center py-8">—</p>
                        ` : `
                            <div class="space-y-3">
                                ${rubrics.map(rub => {
                                    const maxPts = this.calculateRubricMaxPoints(rub);
                                    return `
                                        <div class="p-4 rounded-2xl border border-sky-100 dark:border-slate-800 bg-sky-50/40 dark:bg-navy-800/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <h4 class="font-extrabold text-sm text-slate-900 dark:text-white">${this.escapeHtml(rub.name)}</h4>
                                                    <span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 text-[10px] font-extrabold">${(rub.criteria || []).length} • Max ${maxPts} pt</span>
                                                </div>
                                                ${rub.description ? `<p class="text-slate-500">${this.escapeHtml(rub.description)}</p>` : ''}
                                            </div>
                                            <div class="flex items-center gap-2 shrink-0">
                                                <button onclick="app.openRubricEditorModal('${rub.id}')" class="px-3 py-1.5 rounded-xl bg-white dark:bg-navy-900 border border-sky-200 dark:border-slate-700 font-bold text-sky-700 dark:text-sky-300 hover:bg-sky-50">
                                                    <i class="fa-solid fa-pen mr-1"></i>${this.t("editBtn")}
                                                </button>
                                                <button onclick="app.deleteRubric('${rub.id}')" class="px-3 py-1.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 font-bold">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join("")}
                            </div>
                        `}
                    </div>
                `, "max-w-3xl");
            }

            calculateRubricMaxPoints(rubric) {
                if (!rubric || !Array.isArray(rubric.criteria)) return 0;
                return rubric.criteria.reduce((sum, crit) => {
                    const maxLvl = (crit.levels || []).reduce((m, l) => Math.max(m, parseFloat(l.points) || 0), 0);
                    return sum + maxLvl;
                }, 0);
            }

            openRubricEditorModal(rubricId = null) {
                const existing = rubricId ? (this.state.rubrics || []).find(r => r.id === rubricId) : null;
                if (existing) {
                    this.tempRubricDraft = JSON.parse(JSON.stringify(existing));
                } else {
                    this.tempRubricDraft = {
                        id: "rub-" + Math.random().toString(36).substr(2, 6),
                        name: "",
                        description: "",
                        criteria: [
                            {
                                id: "crit-" + Math.random().toString(36).substr(2, 5),
                                name: "Valutazione Generale della Prova",
                                levels: [
                                    { id: "lvl-1", label: "Insufficiente", points: 4, desc: "Obiettivi raggiunti in modo parziale." },
                                    { id: "lvl-2", label: "Sufficiente", points: 6, desc: "Obiettivi di base raggiunti." },
                                    { id: "lvl-3", label: "Buono", points: 8, desc: "Prova svolta con sicurezza e correttezza." },
                                    { id: "lvl-4", label: "Eccellente", points: 10, desc: "Padronanza completa ed efficace." }
                                ]
                            }
                        ]
                    };
                }
                this.renderRubricEditorModalContent(!!existing);
            }

            syncRubricDraftFromInputs() {
                if (!this.tempRubricDraft) return;
                const nameEl = document.getElementById("rubEditName");
                const descEl = document.getElementById("rubEditDesc");
                if (nameEl) this.tempRubricDraft.name = nameEl.value;
                if (descEl) this.tempRubricDraft.description = descEl.value;

                (this.tempRubricDraft.criteria || []).forEach((crit, cIdx) => {
                    const cNameEl = document.getElementById(`rubCritName_${cIdx}`);
                    if (cNameEl) crit.name = cNameEl.value;
                    (crit.levels || []).forEach((lvl, lIdx) => {
                        const lLab = document.getElementById(`rubLvlLabel_${cIdx}_${lIdx}`);
                        const lPts = document.getElementById(`rubLvlPts_${cIdx}_${lIdx}`);
                        const lDesc = document.getElementById(`rubLvlDesc_${cIdx}_${lIdx}`);
                        if (lLab) lvl.label = lLab.value;
                        if (lPts) lvl.points = parseFloat(lPts.value) || 0;
                        if (lDesc) lvl.desc = lDesc.value;
                    });
                });
            }

            addRubricCriterion() {
                this.syncRubricDraftFromInputs();
                if (!this.tempRubricDraft) return;
                this.modalHasManualChanges = true;
                const nextNum = (this.tempRubricDraft.criteria?.length || 0) + 1;
                this.tempRubricDraft.criteria.push({
                    id: "crit-" + Math.random().toString(36).substr(2, 5),
                    name: `Criterio ${nextNum}`,
                    levels: [
                        { id: "l1-" + Math.random().toString(36).substr(2, 4), label: "Base", points: 1, desc: "" },
                        { id: "l2-" + Math.random().toString(36).substr(2, 4), label: "Intermedio", points: 2, desc: "" },
                        { id: "l3-" + Math.random().toString(36).substr(2, 4), label: "Avanzato", points: 2.5, desc: "" }
                    ]
                });
                this.renderRubricEditorModalContent(true);
            }

            removeRubricCriterion(cIdx) {
                this.syncRubricDraftFromInputs();
                if (!this.tempRubricDraft || this.tempRubricDraft.criteria.length <= 1) return;
                this.modalHasManualChanges = true;
                this.tempRubricDraft.criteria.splice(cIdx, 1);
                this.renderRubricEditorModalContent(true);
            }

            addRubricLevelToCriterion(cIdx) {
                this.syncRubricDraftFromInputs();
                const crit = this.tempRubricDraft?.criteria?.[cIdx];
                if (!crit) return;
                this.modalHasManualChanges = true;
                crit.levels.push({
                    id: "lvl-" + Math.random().toString(36).substr(2, 5),
                    label: `${this.t("levelShort")} ${crit.levels.length + 1}`,
                    points: crit.levels.length + 1,
                    desc: ""
                });
                this.renderRubricEditorModalContent(true);
            }

            removeRubricLevelFromCriterion(cIdx, lIdx) {
                this.syncRubricDraftFromInputs();
                const crit = this.tempRubricDraft?.criteria?.[cIdx];
                if (!crit || crit.levels.length <= 1) return;
                this.modalHasManualChanges = true;
                crit.levels.splice(lIdx, 1);
                this.renderRubricEditorModalContent(true);
            }

            renderRubricEditorModalContent(keepManualDirty = false) {
                const rub = this.tempRubricDraft;
                if (!rub) return;
                const maxPts = this.calculateRubricMaxPoints(rub);
                this.openModal(`
                    <form id="rubricEditorForm" onsubmit="app.saveRubricFromEditor(event)" class="p-6 space-y-4 text-xs max-h-[88vh] overflow-y-auto custom-scrollbar">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <div>
                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("rubricsLabel")}</h3>
                                <p class="text-[11px] text-slate-500">Max: <strong>${maxPts} pt</strong></p>
                            </div>
                            <button type="button" onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">Nome Scheda *</label>
                                <input type="text" id="rubEditName" required value="${this.escapeHtml(rub.name)}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">Descrizione</label>
                                <input type="text" id="rubEditDesc" value="${this.escapeHtml(rub.description || '')}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2">
                            </div>
                        </div>

                        <div class="space-y-4 pt-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wider text-[11px]">Criteri di Valutazione</h4>
                                <button type="button" onclick="app.addRubricCriterion()" class="px-3 py-1.5 rounded-xl bg-sky-100 dark:bg-navy-800 text-sky-700 dark:text-sky-300 font-bold hover:bg-sky-200">
                                    <i class="fa-solid fa-plus mr-1"></i>+ Criterio
                                </button>
                            </div>

                            ${(rub.criteria || []).map((crit, cIdx) => `
                                <div class="p-4 rounded-2xl border border-sky-200/80 dark:border-slate-700 bg-sky-50/30 dark:bg-navy-800/50 space-y-3">
                                    <div class="flex items-center justify-between gap-2">
                                        <input type="text" id="rubCritName_${cIdx}" required value="${this.escapeHtml(crit.name)}" oninput="app.syncRubricDraftFromInputs()" class="flex-1 rounded-xl border border-sky-200 dark:border-slate-700 bg-white dark:bg-navy-900 px-3 py-1.5 font-extrabold">
                                        <div class="flex items-center gap-1.5">
                                            <button type="button" onclick="app.addRubricLevelToCriterion(${cIdx})" class="px-2.5 py-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 font-bold text-[11px]">+ ${this.t("levelShort")}</button>
                                            ${rub.criteria.length > 1 ? `
                                                <button type="button" onclick="app.removeRubricCriterion(${cIdx})" class="w-7 h-7 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 flex items-center justify-center">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                                        ${(crit.levels || []).map((lvl, lIdx) => `
                                            <div class="p-2.5 rounded-xl bg-white dark:bg-navy-900 border border-sky-100 dark:border-slate-800 space-y-2 flex flex-col justify-between">
                                                <div class="space-y-1.5">
                                                    <div class="flex items-center justify-between gap-1.5">
                                                        <input type="text" id="rubLvlLabel_${cIdx}_${lIdx}" value="${this.escapeHtml(lvl.label)}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 font-bold text-[11px]" placeholder="Livello">
                                                        ${crit.levels.length > 1 ? `
                                                            <button type="button" onclick="app.removeRubricLevelFromCriterion(${cIdx}, ${lIdx})" class="text-rose-500 hover:text-rose-700 px-1"><i class="fa-solid fa-xmark"></i></button>
                                                        ` : ''}
                                                    </div>
                                                    <div class="flex items-center gap-1.5">
                                                        <span class="text-[10px] text-slate-400 font-bold">Pt:</span>
                                                        <input type="number" step="0.25" id="rubLvlPts_${cIdx}_${lIdx}" value="${lvl.points}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 font-extrabold text-sky-700 dark:text-sky-400">
                                                    </div>
                                                    <textarea id="rubLvlDesc_${cIdx}_${lIdx}" rows="2" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent p-1.5 text-[11px]" placeholder="Descrittore...">${this.escapeHtml(lvl.desc || '')}</textarea>
                                                </div>
                                            </div>
                                        `).join("")}
                                    </div>
                                </div>
                            `).join("")}
                        </div>

                        <div class="flex justify-end gap-2 pt-3 border-t border-sky-100 dark:border-slate-800">
                            <button type="button" onclick="app.openRubricsManagerModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("backBtn")}</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold shadow-xs">${this.t("saveBtn")}</button>
                        </div>
                    </form>
                `, "max-w-4xl", keepManualDirty);
            }

            saveRubricFromEditor(e) {
                if (e) e.preventDefault();
                this.syncRubricDraftFromInputs();
                const draft = this.tempRubricDraft;
                if (!draft || !draft.name.trim()) return;
                if (!Array.isArray(this.state.rubrics)) this.state.rubrics = [];
                const idx = this.state.rubrics.findIndex(r => r.id === draft.id);
                if (idx >= 0) this.state.rubrics[idx] = draft;
                else this.state.rubrics.push(draft);
                this.tempRubricDraft = null;
                this.persist();
                this.openRubricsManagerModal();
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }

            deleteRubric(rubricId) {
                if ((this.state.rubrics || []).length <= 1) {
                    this.showToast("Mantieni almeno una scheda di valutazione", "error");
                    return;
                }
                this.state.rubrics = (this.state.rubrics || []).filter(r => r.id !== rubricId);
                this.persist();
                this.openRubricsManagerModal();
                this.renderAll();
            }

            openStudentRubricEvaluationModal(studentId, activityId) {
                const course = this.getActiveCourse();
                if (!course) return;
                const act = (course.gradeConfig?.activities || []).find(a => a.id === activityId);
                if (!act) return;
                const rubric = (this.state.rubrics || []).find(r => r.id === act.rubricId) || this.state.rubrics[0];
                if (!rubric) return;
                const st = (this.state.studentsDirectory || []).find(s => s.id === studentId);
                const stName = st ? `${st.firstName} ${st.lastName}`.trim() : "Studente";

                if (!course.rubricEvaluations) course.rubricEvaluations = {};
                const key = `${studentId}_${activityId}`;
                const existingEval = course.rubricEvaluations[key] || { selections: {}, notes: "" };
                const selections = existingEval.selections || {};

                const maxPoints = this.calculateRubricMaxPoints(rubric);
                let rawPoints = 0;
                (rubric.criteria || []).forEach(c => {
                    const selLvlId = selections[c.id];
                    const lvl = (c.levels || []).find(l => l.id === selLvlId);
                    if (lvl) rawPoints += parseFloat(lvl.points) || 0;
                });
                const gradeOutOf10 = maxPoints > 0 ? Number(((rawPoints / maxPoints) * 10).toFixed(2)) : 0;

                this.openModal(`
                    <form onsubmit="app.saveStudentRubricEvaluation(event, '${studentId}', '${activityId}')" class="p-6 space-y-4 text-xs max-h-[88vh] overflow-y-auto custom-scrollbar">
                        <div class="flex items-start justify-between gap-3 border-b border-sky-100 dark:border-slate-800 pb-3">
                            <div>
                                <span class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-[10px] font-extrabold">${this.escapeHtml(rubric.name)}</span>
                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white mt-1">${this.escapeHtml(stName)} — ${this.escapeHtml(act.name)}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="px-3 py-1.5 rounded-xl bg-sky-50 dark:bg-navy-800 border border-sky-200 dark:border-slate-700 text-right">
                                    <span class="text-[10px] text-slate-400 block">Voto (/10)</span>
                                    <span class="text-sm font-extrabold text-sky-700 dark:text-sky-300">${gradeOutOf10.toFixed(2)}</span>
                                </div>
                                <button type="button" onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>

                        <div class="space-y-4">
                            ${(rubric.criteria || []).map(crit => {
                                const selectedLvlId = selections[crit.id] || "";
                                return `
                                    <div class="p-4 rounded-2xl border border-sky-100 dark:border-slate-800 bg-sky-50/30 dark:bg-navy-800/40 space-y-2.5">
                                        <h4 class="font-extrabold text-slate-800 dark:text-slate-100">${this.escapeHtml(crit.name)}</h4>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                                            ${(crit.levels || []).map(lvl => {
                                                const isSel = lvl.id === selectedLvlId;
                                                return `
                                                    <button type="button" onclick="app.selectStudentRubricLevel('${studentId}', '${activityId}', '${crit.id}', '${lvl.id}')"
                                                        class="p-3 rounded-xl border text-left transition flex flex-col justify-between gap-2 ${isSel ? 'border-emerald-500 bg-emerald-50/90 dark:bg-emerald-950/50 ring-2 ring-emerald-500/30' : 'border-sky-100 dark:border-slate-700 bg-white dark:bg-navy-900 hover:border-sky-300'}">
                                                        <div>
                                                            <div class="flex items-center justify-between gap-1">
                                                                <span class="font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(lvl.label)}</span>
                                                                <span class="px-1.5 py-0.5 rounded bg-sky-100 dark:bg-navy-800 text-sky-700 dark:text-sky-300 font-extrabold text-[10px]">${lvl.points} pt</span>
                                                            </div>
                                                            ${lvl.desc ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">${this.escapeHtml(lvl.desc)}</p>` : ''}
                                                        </div>
                                                        ${isSel ? `<span class="text-[10px] font-extrabold text-emerald-600 dark:text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i>${this.t("selectedBadge")}</span>` : ''}
                                                    </button>
                                                `;
                                            }).join("")}
                                        </div>
                                    </div>
                                `;
                            }).join("")}
                        </div>

                        <div>
                            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">${this.t("notesLabel")}</label>
                            <textarea id="rubricEvalNotesInput" rows="2" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent p-2.5">${this.escapeHtml(existingEval.notes || '')}</textarea>
                        </div>

                        <div class="flex justify-end gap-2 pt-2 border-t border-sky-100 dark:border-slate-800">
                            <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("cancelBtn")}</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold shadow-xs">${this.t("saveBtn")}</button>
                        </div>
                    </form>
                `, "max-w-4xl");
            }

            selectStudentRubricLevel(studentId, activityId, critId, levelId) {
                const course = this.getActiveCourse();
                if (!course) return;
                if (!course.rubricEvaluations) course.rubricEvaluations = {};
                const key = `${studentId}_${activityId}`;
                if (!course.rubricEvaluations[key]) {
                    course.rubricEvaluations[key] = { selections: {}, notes: "" };
                }
                const notesEl = document.getElementById("rubricEvalNotesInput");
                if (notesEl) course.rubricEvaluations[key].notes = notesEl.value;
                course.rubricEvaluations[key].selections[critId] = levelId;
                this.openStudentRubricEvaluationModal(studentId, activityId);
            }

            saveStudentRubricEvaluation(e, studentId, activityId) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                if (!course) return;
                const act = (course.gradeConfig?.activities || []).find(a => a.id === activityId);
                if (!act) return;
                const rubric = (this.state.rubrics || []).find(r => r.id === act.rubricId) || this.state.rubrics[0];
                if (!rubric) return;

                if (!course.rubricEvaluations) course.rubricEvaluations = {};
                const key = `${studentId}_${activityId}`;
                if (!course.rubricEvaluations[key]) {
                    course.rubricEvaluations[key] = { selections: {}, notes: "" };
                }
                const notesEl = document.getElementById("rubricEvalNotesInput");
                if (notesEl) course.rubricEvaluations[key].notes = notesEl.value;

                const selections = course.rubricEvaluations[key].selections || {};
                const maxPoints = this.calculateRubricMaxPoints(rubric);
                let rawPoints = 0;
                (rubric.criteria || []).forEach(c => {
                    const selLvlId = selections[c.id];
                    const lvl = (c.levels || []).find(l => l.id === selLvlId);
                    if (lvl) rawPoints += parseFloat(lvl.points) || 0;
                });
                const gradeOutOf10 = maxPoints > 0 ? Number(((rawPoints / maxPoints) * 10).toFixed(2)) : 0;

                if (!course.grades) course.grades = {};
                if (!course.grades[studentId]) course.grades[studentId] = {};
                course.grades[studentId][activityId] = gradeOutOf10;

                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }

            updateGradeConfigMethod(method) {
                const course = this.getActiveCourse();
                if (!course) return;
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.calcMethod = method === "weighted" ? "weighted" : "average";
                this.persist();
                this.renderMainView();
            }

            updateGradeMinPass(val) {
                const course = this.getActiveCourse();
                if (!course) return;
                const num = Math.min(10, Math.max(1, parseFloat(String(val).replace(",", ".")) || 6));
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.minPass = num;
                this.persist();
                this.renderMainView();
            }

            updateStudentGrade(studentId, activityId, rawVal) {
                const course = this.getActiveCourse();
                if (!course) return;
                if (!course.grades) course.grades = {};
                if (!course.grades[studentId]) course.grades[studentId] = {};
                const str = String(rawVal ?? "").trim().replace(",", ".");
                if (str === "") {
                    delete course.grades[studentId][activityId];
                } else {
                    const num = parseFloat(str);
                    if (!isNaN(num)) {
                        course.grades[studentId][activityId] = Math.min(10, Math.max(0, Number(num.toFixed(2))));
                    }
                }
                this.persist();
                this.renderMainView();
            }

            calculateStudentCourseAverage(course, studentId, moduleObj = null) {
                if (!course || !course.gradeConfig) return null;
                const cfg = course.gradeConfig;
                const acts = cfg.activities || [];
                const stGrades = (course.grades && course.grades[studentId]) ? course.grades[studentId] : {};
                const evalAtt = this.isAttendanceEvaluationEnabled(course, moduleObj);
                const attWeight = this.getAttendanceWeight(course, moduleObj);
                const attScore = evalAtt ? this.calculateStudentAttendanceScore(course, studentId, moduleObj) : null;

                if (cfg.calcMethod === "weighted") {
                    let weightedSum = 0;
                    let weightTotal = 0;
                    acts.forEach(a => {
                        const g = parseFloat(stGrades[a.id]);
                        const w = parseFloat(a.weight) || 0;
                        if (!isNaN(g) && w > 0) {
                            weightedSum += g * w;
                            weightTotal += w;
                        }
                    });
                    if (evalAtt && attScore !== null && attWeight > 0) {
                        weightedSum += attScore * attWeight;
                        weightTotal += attWeight;
                    }
                    if (weightTotal <= 0) return null;
                    return Number((weightedSum / weightTotal).toFixed(2));
                } else {
                    const vals = [];
                    acts.forEach(a => {
                        const g = parseFloat(stGrades[a.id]);
                        if (!isNaN(g)) vals.push(g);
                    });
                    if (evalAtt && attScore !== null) {
                        if (attWeight > 0 && vals.length > 0) {
                            const actAvg = vals.reduce((s, v) => s + v, 0) / vals.length;
                            const w = Math.min(100, Math.max(0, attWeight)) / 100;
                            return Number((actAvg * (1 - w) + attScore * w).toFixed(2));
                        }
                        vals.push(attScore);
                    }
                    if (vals.length === 0) return null;
                    return Number((vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(2));
                }
            }

            // ==============================================================================
            // UNDO & SNAPSHOT SYSTEM (Ctrl+Z)
            // ==============================================================================
            recordUndoSnapshot() {
                if (!this.state) return;
                try {
                    if (!this.undoStack) this.undoStack = [];
                    const snap = JSON.stringify(this.state);
                    this.undoStack.push(snap);
                    if (this.undoStack.length > 25) this.undoStack.shift();
                } catch (e) {
                    console.error("Undo snapshot error:", e);
                }
            }

            performUndo() {
                if (!this.undoStack || this.undoStack.length === 0) {
                    this.showToast("Nessuna modifica da annullare", "info");
                    return;
                }
                try {
                    const prev = this.undoStack.pop();
                    this.state = JSON.parse(prev);
                    this.persist();
                    this.renderAll();
                    this.showToast("↩️ Modifica annullata con successo", "success");
                } catch (e) {
                    console.error("Undo error:", e);
                }
            }

            // ==============================================================================
            // 30-DAY TRASH BIN ("CESTINO")
            // ==============================================================================
            moveToTrash(itemType, title, subtitle, payload, courseId = null, sectionId = null) {
                this.recordUndoSnapshot();
                if (!Array.isArray(this.state.deletedItems)) this.state.deletedItems = [];
                const item = {
                    id: "bin-" + Math.random().toString(36).substr(2, 8),
                    itemType,
                    title: title || "Elemento",
                    subtitle: subtitle || "",
                    deletedAt: new Date().toISOString(),
                    courseId,
                    sectionId,
                    payloadJSON: JSON.stringify(payload)
                };
                this.state.deletedItems.unshift(item);
                this.persist();
                this.showToast(`🗑️ "${title}" spostato nel cestino (30 giorni)`, "info");
            }

            daysRemainingInTrash(item) {
                if (!item || !item.deletedAt) return 30;
                const d = new Date(item.deletedAt).getTime();
                const now = Date.now();
                const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
                return Math.max(0, 30 - diffDays);
            }

            restoreTrashItem(id) {
                this.recordUndoSnapshot();
                const idx = (this.state.deletedItems || []).findIndex(x => x.id === id);
                if (idx < 0) return;
                const item = this.state.deletedItems[idx];
                try {
                    const data = JSON.parse(item.payloadJSON);
                    if (item.itemType === "course") {
                        data.archived = false;
                        this.state.courses.push(data);
                        this.state.activeCourseId = data.id;
                    } else if (item.itemType === "student") {
                        this.state.studentsDirectory.push(data);
                    } else if (item.itemType === "activity") {
                        const course = this.state.courses.find(c => c.id === item.courseId) || this.getActiveCourse();
                        if (course) {
                            if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                            course.gradeConfig.activities.push(data);
                        }
                    } else if (item.itemType === "rubric") {
                        this.state.rubrics.push(data);
                    } else if (item.itemType === "module") {
                        const course = this.state.courses.find(c => c.id === item.courseId) || this.getActiveCourse();
                        if (course && course.levels && course.levels.length > 0) {
                            course.levels[0].modules.push(data);

            /**
             * Continuous Module Calendar ("Calendario Modulo") View
             * - Starts from the Monday/Sunday of the week of the first lesson and displays all weeks continuously until the end of the module.

             */

            // ==============================================================================
            // DYNAMIC DRAG & DROP MODULE CALENDAR ("CALENDARIO MODULO")
            // ==============================================================================
            // DYNAMIC DRAG & DROP MODULE CALENDAR ("CALENDARIO MODULO")
            // ==============================================================================
            handleLessonDragStart(e, slotKey) {
                this.draggedSlotKey = slotKey;
                this.isDraggingLesson = true;
                this.hasJustDragged = true;
                if (e?.dataTransfer) {
                    try {
                        e.dataTransfer.setData("text/plain", slotKey);
                        e.dataTransfer.effectAllowed = "move";
                    } catch (_) {}
                }
                if (e?.currentTarget) e.currentTarget.classList.add("opacity-40");
                document.querySelectorAll(".calendar-drag-sensor").forEach(el => {
                    el.classList.remove("hidden");
                    el.classList.add("flex");
                });
            }

            handleLessonDragEnd(e) {
                if (e?.currentTarget) e.currentTarget.classList.remove("opacity-40");
                document.querySelectorAll(".calendar-day-cell").forEach(el => {
                    el.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                });
                document.querySelectorAll(".calendar-drag-sensor").forEach(el => {
                    el.classList.add("hidden");
                    el.classList.remove("flex");
                });
                this.stopAutoScroll();
                // Delay clearing draggedSlotKey so that drop events dispatched asynchronously by WebView2 are handled properly
                setTimeout(() => {
                    this.draggedSlotKey = null;
                    this.isDraggingLesson = false;
                    setTimeout(() => { this.hasJustDragged = false; }, 200);
                }, 350);
            }

            handleDayDragOver(e, dayIso) {
                if (e && typeof e.preventDefault === "function") e.preventDefault();
                if (e?.dataTransfer) e.dataTransfer.dropEffect = "move";
                const cell = e?.currentTarget;
                if (cell) {
                    cell.classList.add("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                }
            }

            handleDayDragLeave(e, dayIso) {
                const cell = e?.currentTarget;
                if (cell) {
                    cell.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                }
            }

            handleDayDrop(e, newDateStr) {
                if (e && typeof e.preventDefault === "function") e.preventDefault();
                this.stopAutoScroll();
                const slotKey = this.draggedSlotKey || (e?.dataTransfer ? e.dataTransfer.getData("text/plain") : null);
                this.draggedSlotKey = null;
                this.isDraggingLesson = false;
                this.hasJustDragged = true;
                setTimeout(() => { this.hasJustDragged = false; }, 350);
                document.querySelectorAll(".calendar-drag-sensor").forEach(el => {
                    el.classList.add("hidden");
                    el.classList.remove("flex");
                });
                document.querySelectorAll(".calendar-day-cell").forEach(el => {
                    el.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                });
                if (!slotKey || !newDateStr) return;

                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                const oldDate = this.extractDateFromSlotKey(slotKey);
                if (oldDate === newDateStr) return;

                const isCollision = (sec.dates || []).some(k => this.extractDateFromSlotKey(k) === newDateStr && k !== slotKey);
                if (isCollision) {
                    this.openCollisionMoveModal(slotKey, newDateStr);
                } else {
                    this.moveLesson(slotKey, newDateStr);
                }
            }

            startLessonMouseDrag(e, slotKey) {
                if (e.button !== 0) return; // left click only
                const startX = e.clientX;
                const startY = e.clientY;
                let isDragging = false;
                let ghost = null;
                let lastCell = null;

                const onMouseMove = (moveEv) => {
                    const dist = Math.hypot(moveEv.clientX - startX, moveEv.clientY - startY);
                    if (!isDragging && dist > 5) {
                        isDragging = true;
                        this.isDraggingLesson = true;
                        this.hasJustDragged = true;
                        this.draggedSlotKey = slotKey;

                        ghost = document.createElement("div");
                        ghost.className = "fixed pointer-events-none z-50 px-2.5 py-1 rounded-lg bg-sky-600 text-white font-extrabold text-[10.5px] shadow-2xl opacity-90";
                        ghost.innerHTML = `<i class="fa-solid fa-arrows-up-down-left-right mr-1"></i> Sposta lezione`;
                        document.body.appendChild(ghost);
                    }
                    if (isDragging) {
                        if (ghost) {
                            ghost.style.left = `${moveEv.clientX + 10}px`;
                            ghost.style.top = `${moveEv.clientY + 10}px`;
                        }
                        const el = document.elementFromPoint(moveEv.clientX, moveEv.clientY);
                        const cell = el ? el.closest(".calendar-day-cell") : null;
                        if (cell !== lastCell) {
                            if (lastCell) lastCell.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                            if (cell) cell.classList.add("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                            lastCell = cell;
                        }
                    }
                };

                const onMouseUp = (upEv) => {
                    window.removeEventListener("mousemove", onMouseMove);
                    window.removeEventListener("mouseup", onMouseUp);
                    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
                    if (lastCell) lastCell.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                    if (isDragging) {
                        const el = document.elementFromPoint(upEv.clientX, upEv.clientY);
                        const cell = el ? el.closest(".calendar-day-cell") : null;
                        const dayIso = cell ? cell.getAttribute("data-day-iso") : null;
                        if (dayIso && slotKey) {
                            this.handleDayDrop({ preventDefault: () => {} }, dayIso);
                        }
                        setTimeout(() => {
                            this.isDraggingLesson = false;
                            this.draggedSlotKey = null;
                            setTimeout(() => { this.hasJustDragged = false; }, 200);
                        }, 100);
                    }
                };

                window.addEventListener("mousemove", onMouseMove);
                window.addEventListener("mouseup", onMouseUp);
            }

            openCollisionMoveModal(slotKey, newDateStr) {
                const dateDisplay = this.formatDateDisplay(newDateStr);
                this.openModal(`

            getModuleRecurrenceWeekdays(course, sec) {
                if (Array.isArray(sec.weekdays) && sec.weekdays.length > 0) {
                    return [...sec.weekdays].sort((a, b) => a - b);
                }
                const set = new Set();
                (sec.dates || []).forEach(slot => {
                    const dStr = this.extractDateFromSlotKey(slot);
                    const dt = new Date(dStr + "T12:00:00");
                    if (!isNaN(dt.getTime())) {
                        set.add(dt.getDay());
                    }
                });
                if (set.size === 0) return [1, 3];
                return Array.from(set).sort((a, b) => a - b);
            }

            moveLessonShiftingForward(slotKey, newDateStr) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                const scrollEl = document.getElementById("calendarScrollContainer");
                const savedCalendarScrollTop = scrollEl ? scrollEl.scrollTop : 0;
                const savedWindowScrollY = window.scrollY || document.documentElement.scrollTop || 0;

                this.recordUndoSnapshot();

                const weekdays = this.getModuleRecurrenceWeekdays(course, sec);

                function getNextValidDate(d) {
                    const next = new Date(d);
                    next.setDate(next.getDate() + 1);
                    for (let g = 0; g < 14; g++) {
                        if (weekdays.includes(next.getDay())) {
                            return next;
                        }
                        next.setDate(next.getDate() + 1);
                    }
                    return next;
                }

                function formatIso(d) {
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
                }

                const otherSlots = (sec.dates || []).filter(k => k !== slotKey).sort((a, b) => {
                    const da = a.substring(0, 10);
                    const db = b.substring(0, 10);
                    return da.localeCompare(db) || a.localeCompare(b);
                });

                const beforeSlots = otherSlots.filter(k => this.extractDateFromSlotKey(k) < newDateStr);
                const atOrAfterSlots = otherSlots.filter(k => this.extractDateFromSlotKey(k) >= newDateStr);

                const slotMigrations = [];
                const finalDates = [...beforeSlots];

                const movedNewKey = finalDates.includes(newDateStr)
                    ? `${newDateStr}__${Math.random().toString(36).substr(2, 5)}`
                    : newDateStr;
                slotMigrations.push({ oldKey: slotKey, newKey: movedNewKey, newDate: newDateStr });
                finalDates.push(movedNewKey);

                let lastDate = new Date(newDateStr + "T12:00:00");
                for (const oldSlot of atOrAfterSlots) {
                    lastDate = getNextValidDate(lastDate);
                    const nextDateStr = formatIso(lastDate);
                    const nextSlotKey = finalDates.includes(nextDateStr)
                        ? `${nextDateStr}__${Math.random().toString(36).substr(2, 5)}`
                        : nextDateStr;
                    slotMigrations.push({ oldKey: oldSlot, newKey: nextSlotKey, newDate: nextDateStr });
                    finalDates.push(nextSlotKey);
                }

                for (const mig of slotMigrations) {
                    if (mig.oldKey === mig.newKey) continue;
                    if (sec.attendance) {
                        Object.keys(sec.attendance).forEach(stId => {
                            if (sec.attendance[stId] && sec.attendance[stId][mig.oldKey] !== undefined) {
                                sec.attendance[stId][mig.newKey] = sec.attendance[stId][mig.oldKey];
                                delete sec.attendance[stId][mig.oldKey];
                            }
                        });
                    }
                    if (course.lessons) {
                        const les = course.lessons.find(l => l.slotKey === mig.oldKey && (l.sectionId === null || l.sectionId === sec.id));
                        if (les) {
                            les.date = mig.newDate;
                            les.slotKey = mig.newKey;
                        }
                    }
                }

                sec.dates = finalDates;
                this.sortModuleSlots(course, sec);
                this.persist();
                this.renderAll();

                const restoreScroll = () => {
                    const newScrollEl = document.getElementById("calendarScrollContainer");
                    if (newScrollEl && savedCalendarScrollTop > 0) newScrollEl.scrollTop = savedCalendarScrollTop;
                    if (savedWindowScrollY > 0) window.scrollTo({ top: savedWindowScrollY, behavior: "instant" });
                };
                restoreScroll();
                requestAnimationFrame(restoreScroll);
                setTimeout(restoreScroll, 20);

                this.showToast(`📅 Lezioni riprogrammate a partire dal ${this.formatDateDisplay(newDateStr)}`, "success");
            }

            startAutoScrollUp() {
                const scrollEl = document.getElementById("calendarScrollContainer");
                if (!scrollEl) return;
                if (this.autoScrollTimer) clearInterval(this.autoScrollTimer);
                scrollEl.scrollTop -= 35;
                this.autoScrollTimer = setInterval(() => {
                    scrollEl.scrollTop -= 30;
                }, 40);
            }

            startAutoScrollDown() {
                const scrollEl = document.getElementById("calendarScrollContainer");
                if (!scrollEl) return;
                if (this.autoScrollTimer) clearInterval(this.autoScrollTimer);
                scrollEl.scrollTop += 35;
                this.autoScrollTimer = setInterval(() => {
                    scrollEl.scrollTop += 30;
                }, 40);
            }

            stopAutoScroll() {
                if (this.autoScrollTimer) {
                    clearInterval(this.autoScrollTimer);
                    this.autoScrollTimer = null;
                }
            }

            moveLesson(slotKey, newDateStr) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                const oldDate = this.extractDateFromSlotKey(slotKey);
                if (oldDate === newDateStr) return;

                // Capture current scroll positions before modifying state and re-rendering
                const scrollEl = document.getElementById("calendarScrollContainer");
                const savedCalendarScrollTop = scrollEl ? scrollEl.scrollTop : 0;
                const savedWindowScrollY = window.scrollY || document.documentElement.scrollTop || 0;

                this.recordUndoSnapshot();

                let candidate = newDateStr;
                if ((sec.dates || []).includes(candidate)) {
                    candidate = `${newDateStr}__${Math.random().toString(36).substr(2, 5)}`;
                }

                // Update section dates array
                const idx = (sec.dates || []).indexOf(slotKey);
                if (idx >= 0) {
                    sec.dates[idx] = candidate;
                } else {
                    sec.dates.push(candidate);
                }

                // Migrate student attendance
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        if (sec.attendance[stId] && sec.attendance[stId][slotKey] !== undefined) {
                            sec.attendance[stId][candidate] = sec.attendance[stId][slotKey];
                            delete sec.attendance[stId][slotKey];
                        }
                    });
                }

                // Update lesson plan date and slotKey
                if (course.lessons) {
                    const les = course.lessons.find(l => l.slotKey === slotKey && (l.sectionId === null || l.sectionId === sec.id));
                    if (les) {
                        les.date = newDateStr;
                        les.slotKey = candidate;
                    }
                }

                this.sortModuleSlots(course, sec);
                this.persist();
                this.renderAll();

                // Restore scroll positions so the screen NEVER jumps to the top
                const restoreScroll = () => {
                    const newScrollEl = document.getElementById("calendarScrollContainer");
                    if (newScrollEl && savedCalendarScrollTop > 0) {
                        newScrollEl.scrollTop = savedCalendarScrollTop;
                    }
                    if (savedWindowScrollY > 0) {
                        window.scrollTo({ top: savedWindowScrollY, behavior: "instant" });
                    }
                };
                restoreScroll();
                requestAnimationFrame(restoreScroll);
                setTimeout(restoreScroll, 20);

                this.showToast(`📅 Lezione spostata al ${this.formatDateDisplay(newDateStr)}`, "success");
            }

            computeDurationText(start, end, fallbackHours = 1.5) {
                let diffMins = 0;
                if (start && end) {
                    const sParts = start.split(":").map(Number);
                    const eParts = end.split(":").map(Number);
                    if (sParts.length >= 2 && eParts.length >= 2 && !isNaN(sParts[0]) && !isNaN(eParts[0])) {
                        const sTotal = sParts[0] * 60 + sParts[1];
                        const eTotal = eParts[0] * 60 + eParts[1];
                        diffMins = eTotal - sTotal;
                    }
                }
                if (diffMins <= 0) {
                    diffMins = Math.round(fallbackHours * 60);
                }
                const h = Math.floor(diffMins / 60);
                const m = diffMins % 60;
                if (h > 0 && m > 0) return `${h}h ${m}m`;
                if (h > 0) return `${h}h`;
                return `${m}m`;
            }

            formatLocalizedShortDate(isoDate, lang = "it") {
                if (!isoDate) return "";
                const parts = isoDate.split("-").map(Number);
                if (parts.length !== 3) return isoDate;
                const [y, m, d] = parts;
                const date = new Date(y, m - 1, d, 12, 0, 0);
                const dow = date.getDay(); // 0=Sun, 1=Mon...

                const itDays = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
                const itMonths = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];

                const enDays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                const enMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

                const esDays = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
                const esMonths = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

                const mIdx = Math.max(0, Math.min(11, m - 1));
                const dowIdx = Math.max(0, Math.min(6, dow));

                if (lang === "en") {
                    return `${enDays[dowIdx]} ${enMonths[mIdx]} ${d}, ${y}`;
                } else if (lang === "es") {
                    return `${esDays[dowIdx]} ${d} ${esMonths[mIdx]} ${y}`;
                } else {
                    return `${itDays[dowIdx]} ${d} ${itMonths[mIdx]} ${y}`;
                }
            }

            downloadCalendarSquarePng(lang = null) {
                if (!lang) {
                    this.openExportLanguageModal(
                        this.t("exportLanguageTitle") || "Lingua di Esportazione",
                        this.t("exportLanguagePrompt") || "Seleziona la lingua per le intestazioni, date e testi dell'immagine PNG:",
                        (chosenLang) => this.downloadCalendarSquarePng(chosenLang)
                    );
                    return;

                const course = this.getActiveCourse();

                canvas.height = 1200;
                const ctx = canvas.getContext("2d");

                // Background gradient
                const grad = ctx.createLinearGradient(0, 0, 1200, 1200);

                grad.addColorStop(1, "#18223c");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1200, 1200);

                // Top Accent Bar
                ctx.fillStyle = pal.hex || "#0284c7";
                ctx.fillRect(0, 0, 1200, 20);

                // Header
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 44px sans-serif";

                const subtitleMap = {
                    it: " • Calendario Ufficiale Lezioni",

                    it: `Totale: ${slots.length} lezioni programmate`,

            renderModuleStudentCalendarView(container) {
                const prevScrollEl = document.getElementById("calendarScrollContainer");
                const savedScrollTop = prevScrollEl ? prevScrollEl.scrollTop : null;
                const savedWinScroll = window.scrollY || document.documentElement.scrollTop || 0;

                const course = this.getActiveCourse();
                if (!course) {
                    this.renderHomeView(container);
                    return;
                }
                const activeSection = this.getActiveSection(course);
                if (!activeSection) return;
                const slots = [...this.sortModuleSlots(course, activeSection)];
                const pal = this.getCourseColorObj(course.color);

                if (slots.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-10 text-center space-y-3 text-xs">
                            <p class="text-slate-400 font-bold">${this.t("noScheduledLessonsMsg")}</p>
                            <div class="flex justify-center gap-2">
                                <button onclick="app.openAddDateModal()" class="px-3.5 py-2 rounded-xl bg-sky-600 text-white font-bold">${this.t("addDateBtn")}</button>
                                <button onclick="app.openRecurringGeneratorModal()" class="px-3.5 py-2 rounded-xl border border-sky-200 dark:border-slate-700 font-bold">${this.t("recurringBtn")}</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                const now = new Date();
                const nowY = now.getFullYear();
                const nowM = now.getMonth();
                const todayIso = `${nowY}-${String(nowM + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
                const nowTime = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

                const startFirstDayMon = (this.state?.settings?.firstDayOfWeek || "monday") === "monday";
                const dayHeaders = startFirstDayMon ? this.t("daysShortMon") : this.t("daysShortSun");

                // Map current module slots by ISO date
                const slotsByDate = {};
                slots.forEach((slotKey, idx) => {
                    const dStr = this.extractDateFromSlotKey(slotKey);
                    if (!slotsByDate[dStr]) slotsByDate[dStr] = [];
                    const les = this.findLessonForSlot(course, activeSection.id, slotKey);
                    slotsByDate[dStr].push({
                        slotKey,
                        iso: dStr,
                        lessonNumber: idx + 1,
                        time: les?.time || activeSection.startTime || course.startTime || "19:00",
                        endTime: les?.endTime || activeSection.endTime || course.endTime || "20:30",
                        title: les?.title || ""
                    });
                });

                // Map past lessons from other modules by ISO date (to show in gray, excluded from PNG & WhatsApp)
                const otherPastLessonsByDate = {};
                (course.levels || []).forEach(lvl => {
                    (lvl.modules || []).forEach(m => {
                        if (m.id !== activeSection.id) {
                            (m.dates || []).forEach((sk, sIdx) => {
                                const dStr = this.extractDateFromSlotKey(sk);
                                if (dStr <= todayIso) {
                                    if (!otherPastLessonsByDate[dStr]) otherPastLessonsByDate[dStr] = [];
                                    const les = this.findLessonForSlot(course, m.id, sk);
                                    otherPastLessonsByDate[dStr].push({
                                        slotKey: sk,
                                        iso: dStr,
                                        moduleName: m.name || `M`,
                                        lessonNumber: sIdx + 1,
                                        time: les?.time || m.startTime || course.startTime || "19:00",
                                        endTime: les?.endTime || m.endTime || course.endTime || "20:30",
                                        title: les?.title || "",
                                        isOtherModule: true
                                    });
                                }
                            });
                        }
                    });
                });

                // Extract unique complete calendar months in which courses take place
                const uniqueMonthMap = {};
                slots.forEach(sk => {
                    const dStr = this.extractDateFromSlotKey(sk);
                    if (dStr && dStr.length >= 7) {
                        const ym = dStr.substring(0, 7); // 'YYYY-MM'
                        const parts = ym.split("-").map(Number);
                        if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                            uniqueMonthMap[ym] = { year: parts[0], month: parts[1] - 1 };
                        }
                    }
                });

                let activeMonths = Object.keys(uniqueMonthMap).sort().map(k => uniqueMonthMap[k]);
                if (activeMonths.length === 0) {
                    activeMonths = [{ year: nowY, month: nowM }];
                }

                const monthsData = [];
                const monthNames = this.t("months");

                for (const mItem of activeMonths) {
                    const y = mItem.year;
                    const m = mItem.month;
                    const monthTitle = `${monthNames[m]} ${y}`;
                    const isCurrentMonthCalendar = (y === nowY && m === nowM);

                    // Build weeks for this specific month
                    const firstDayOfMonth = new Date(y, m, 1);
                    const lastDayOfMonth = new Date(y, m + 1, 0);

                    const startCursor = new Date(firstDayOfMonth);
                    const fDow = startCursor.getDay();
                    const startOffset = startFirstDayMon ? (fDow === 0 ? -6 : 1 - fDow) : -fDow;
                    startCursor.setDate(startCursor.getDate() + startOffset);

                    const endCursor = new Date(lastDayOfMonth);
                    const lDow = endCursor.getDay();
                    const endOffset = startFirstDayMon ? (lDow === 0 ? 0 : 7 - lDow) : (6 - lDow);
                    endCursor.setDate(endCursor.getDate() + endOffset);

                    const weeks = [];
                    let wCursor = new Date(startCursor);
                    let monthSessionCount = 0;
                    let weekGuard = 0;

                    while (wCursor <= endCursor && weekGuard++ < 12) {
                        const weekDays = [];
                        for (let i = 0; i < 7; i++) {
                            const curY = wCursor.getFullYear();
                            const curM = String(wCursor.getMonth() + 1).padStart(2, "0");
                            const curD = String(wCursor.getDate()).padStart(2, "0");
                            const iso = `${curY}-${curM}-${curD}`;
                            const isCurrentMonth = wCursor.getMonth() === m;
                            const currentSessions = slotsByDate[iso] || [];
                            const otherPastSessions = otherPastLessonsByDate[iso] || [];
                            if (isCurrentMonth) monthSessionCount += currentSessions.length;

                            weekDays.push({
                                iso,
                                dayNum: wCursor.getDate(),
                                isCurrentMonth,
                                sessions: currentSessions,
                                otherPastSessions
                            });
                            wCursor.setDate(wCursor.getDate() + 1);
                        }
                        weeks.push(weekDays);
                    }

                    monthsData.push({
                        id: `month-${y}-${m}`,
                        title: monthTitle,
                        isCurrentMonthCalendar,
                        sessionCount: monthSessionCount,
                        weeks
                    });
                }

                                    <i class="fa-solid fa-print text-sky-600"></i> ${this.t("printBtn")}

                                        <i class="fa-brands fa-google text-sm"></i> Sincronizza Google

                                        <i class="fa-solid fa-video text-sm"></i> Partecipa a Meet

                                        <i class="fa-solid fa-video text-sm"></i> Crea Google Meet
                                    </button>

                            <i class="fa-solid fa-chevron-up mr-1.5 animate-bounce"></i> Trascina qui per scorrere al mese precedente

                            ${monthsData.map(mSec => `
                                <div id="${mSec.id}" class="bg-white dark:bg-navy-900 rounded-2xl border ${mSec.isCurrentMonthCalendar ? 'border-sky-400 dark:border-sky-600 ring-2 ring-sky-400/20 shadow-md' : 'border-sky-100 dark:border-slate-800 shadow-xs'} p-5 space-y-3">

                                        <div class="flex items-center gap-2">
                                            <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(mSec.title)}</h3>

                                                <span class="px-2 py-0.5 rounded-full bg-sky-600 text-white text-[10px] font-extrabold uppercase">Mese Corrente</span>

                                            ${mSec.sessionCount > 0 ? `

                                            ` : ''}
                                        </div>
                                    </div>

                                    <!-- Weekdays -->
                                    <div class="grid grid-cols-7 gap-2 text-center text-[11px] font-extrabold uppercase text-slate-400">
                                        ${dayHeaders.map(dh => `<div>${this.escapeHtml(dh)}</div>`).join("")}
                                    </div>

                                    <!-- Weeks & Days Grid -->
                                    <div class="space-y-2">
                                        ${mSec.weeks.map(week => `
                                            <div class="grid grid-cols-7 gap-2">
