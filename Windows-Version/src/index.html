        class MemoryDB {
            constructor() {
                this.dbName = "GestioneCorsiDB_v1";
                this.storeName = "appStateStore";
                this.db = null;
            }

            async init() {
                return new Promise((resolve) => {
                    if (!window.indexedDB) {
                        resolve(false);
                        return;
                    }
                    const request = indexedDB.open(this.dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName);
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(true);
                    };
                    request.onerror = () => resolve(false);
                });
            }

            async loadState() {
                try {
                    if (this.db) {
                        const data = await new Promise((resolve) => {
                            const tx = this.db.transaction(this.storeName, "readonly");
                            const store = tx.objectStore(this.storeName);
                            const req = store.get("rootState");
                            req.onsuccess = () => resolve(req.result || null);
                            req.onerror = () => resolve(null);
                        });
                        if (data && Array.isArray(data.courses) && data.courses.length > 0) return data;
                    }
                } catch (e) {
                    console.warn("IndexedDB load fallback:", e);
                }
                try {
                    const raw = localStorage.getItem("classdesk_state_v1") || localStorage.getItem("class_management_state_v1") || localStorage.getItem("gestione_corsi_state_v1");
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.courses) && parsed.courses.length > 0) return parsed;
                    }
                } catch (e) {}

                // Automatic legacy data migration: if fresh install or empty profile, check existing backups in Documents
                if (window.electronAPI && typeof window.electronAPI.checkExistingLegacyData === "function") {
                    try {
                        const legacy = await window.electronAPI.checkExistingLegacyData();
                        if (legacy && legacy.success && legacy.data) {
                            const parsed = typeof legacy.data === "string" ? JSON.parse(legacy.data) : legacy.data;
                            if (parsed && Array.isArray(parsed.courses) && parsed.courses.length > 0) {
                                console.log("[Data-Migration] Dati storici rilevati e ripristinati automaticamente!", parsed.courses.length, "corsi.");
                                await this.saveState(parsed);
                                return parsed;
                            }
                        }
                    } catch (migErr) {
                        console.warn("[Data-Migration] Avviso verifica dati pregressi:", migErr);
                    }
                }
                return null;
            }

            async saveState(state) {
                try {
                    // Optimization: prune historical changelog bloat before disk/storage serialization
                    const toPersist = {
                        ...state,
                        changelog: Array.isArray(state.changelog) && state.changelog.length > 0 ? [state.changelog[0]] : []
                    };
                    const serialized = JSON.stringify(toPersist);
                    localStorage.setItem("classdesk_state_v1", serialized);
                    localStorage.setItem("class_management_state_v1", serialized); // mirror for backward compatibility
                    if (this.db) {
                        await new Promise((resolve) => {
                            const tx = this.db.transaction(this.storeName, "readwrite");
                            const store = tx.objectStore(this.storeName);
                            store.put(toPersist, "rootState");
                            tx.oncomplete = () => resolve(true);
                            tx.onerror = () => resolve(false);
                        });
                    }
                } catch (e) {
                    console.warn("localStorage/IndexedDB save warning:", e);
                }
            }

            async clearAll() {
                try {
                    localStorage.removeItem("classdesk_state_v1");
                    localStorage.removeItem("class_management_state_v1");
                    localStorage.removeItem("gestione_corsi_state_v1");
                } catch (e) {}
                if (!this.db) return;
                try {
                    await new Promise((resolve) => {
                        const tx = this.db.transaction(this.storeName, "readwrite");
                        tx.objectStore(this.storeName).clear();
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch (e) {}
            }
        }

                this.selectedGroupStudents = new Set();
                this.selectedGlobalStudents = new Set();
                this.showFormerGroupStudents = false;

                this.showSensitiveDirectoryData = false;
                this.studentSearchQuery = "";
                this.studentLevelFilter = "ALL";
                this.selectedBillingCourseId = null;
                this.showGroupBillingData = false;
                this.tempRubricDraft = null;

            toggleSensitiveGroupData() {

            toggleSensitiveDirectoryData() {

            getCurrency() {
                return this.state?.settings?.currency || "$";

            formatMoney(amount) {
                const num = Number(amount) || 0;
                return `${this.getCurrency()}${num.toFixed(2)}`;

            getCourseColorObj(colorId) {
                return COURSE_COLOR_PALETTE.find(c => c.id === colorId) || COURSE_COLOR_PALETTE[0];
            }

            pickNextAvailableCourseColor(excludeCourseId = null) {
                const usedColors = new Set(
                    (this.state.courses || [])
                        .filter(c => c.id !== excludeCourseId && !c.archived && c.color)
                        .map(c => c.color)
                );
                const unused = COURSE_COLOR_PALETTE.find(p => !usedColors.has(p.id));
                if (unused) return unused.id;
                const idx = (this.state.courses || []).length % COURSE_COLOR_PALETTE.length;
                return COURSE_COLOR_PALETTE[idx].id;
            }

            applyActiveCourseColorTheme() {
                const course = this.getActiveCourse();

            formatCreatedAtDisplay(isoStr) {
                if (!isoStr) return "";
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return isoStr;
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, "0");
                const day = String(d.getDate()).padStart(2, "0");
                const hh = String(d.getHours()).padStart(2, "0");
                const mm = String(d.getMinutes()).padStart(2, "0");
                return `${this.formatDateDisplay(`${y}-${m}-${day}`)} • ${this.formatTimeDisplay(`${hh}:${mm}`)}`;
            }

            autoResizeTextarea(el) {
                if (!el) return;
                el.style.height = "auto";
                el.style.height = Math.max(52, el.scrollHeight) + "px";
            }

            autoResizeAllTextareas() {
                requestAnimationFrame(() => {
                    document.querySelectorAll("#modalContent textarea.auto-expand").forEach(ta => {
                        this.autoResizeTextarea(ta);
                    });
                });
            }

            async init() {
                await this.memoryDB.init();
                const saved = await this.memoryDB.loadState();
                if (saved && typeof saved === "object") {
                    this.state = saved;
                }
                this.ensureDataMigration();
                this.setupSystemThemeListener();
                this.applyTheme();
                this.applySidebarState();

                if (!this.state.activeCourseId || !this.state.courses.some(c => c.id === this.state.activeCourseId && !c.archived)) {
                    const firstActive = this.state.courses.find(c => !c.archived);
                    this.state.activeCourseId = firstActive ? firstActive.id : "";
                }
                this.state.courses.forEach(c => this.selectLatestLevelAndModule(c));
                this.renderAll();

                // Auto-refresh Google Calendar events if connected
                if (this.state.settings?.googleCalendarConnected) {
                    this.refreshGoogleCalendarEvents();
                }

                // Setup beta 5-minute auto backup & diagnostic crash reporting
                this.setupBetaDiagnosticsAndBackup();

                // Show onboarding wizard on first run, otherwise check updates on startup
                if (this.state.settings && this.state.settings.onboardingCompleted === false) {
                    this.openOnboardingWizard();
                } else {
                    const hasPending = await this.checkPendingUpdateOnStartup();
                    if (!hasPending) {
                        setTimeout(() => this.checkUpdatesOnStartupIfNeeded(), 1500);
                    }
                }
            }

            t(key) {
                const lang = this.state?.settings?.language || "it";
                const dict = I18N[lang] || I18N.it;
                return dict[key] !== undefined ? dict[key] : (I18N.it[key] || key);
            }

            escapeHtml(str) {
                if (str === null || str === undefined) return "";
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            normalizeCefrLevel(raw) {
                if (!raw) return "A1";
                const str = String(raw).trim().toUpperCase();
                const match = str.match(/\b(A1|A2|B1|B2|C1|C2)\b/);
                if (match) return match[1];
                if (str === "ALTRO" || str === "OTHER" || str === "OTRO") return "Altro";
                return "Altro";
            }

            extractModuleShortCode(modName, fallbackIndex = 1) {
                if (!modName) return `M${fallbackIndex}`;
                const str = String(modName).trim();
                const mMatch = str.match(/\bM\s*(\d+)\b/i) || str.match(/Modulo\s*(\d+)/i) || str.match(/Sezione\s*(\d+)/i) || str.match(/^(\d+)$/);
                if (mMatch) return `M${mMatch[1]}`;
                return str.length <= 10 ? str : `M${fallbackIndex}`;
            }

            formatLevelModuleBadge(course, levelObj, moduleObj) {
                if (!course) return "A1";
                const lvl = levelObj || this.getActiveLevel(course);
                const mod = moduleObj || this.getActiveSection(course);
                const code = this.normalizeCefrLevel(lvl?.code || lvl?.name || course.level || "A1");
                const lvlDisplay = code === "Altro" ? (lvl?.customName || this.t("otherLevelOpt")) : code;
                const modIdx = lvl && Array.isArray(lvl.modules)
                    ? Math.max(1, lvl.modules.findIndex(m => m.id === mod?.id) + 1)
                    : 1;
                const mCode = this.extractModuleShortCode(mod?.name, modIdx);
                return `${lvlDisplay} ${mCode}`;
            }

            syncAllStudentsLevels() {
                if (!Array.isArray(this.state.studentsDirectory)) return;
                // High-performance single-pass inverse index lookup O(C*L*M + S)
                const studentMap = new Map();
                (this.state.courses || []).forEach(course => {
                    if (course.archived) return;
                    this.syncCourseLevelsAndSections(course);
                    (course.levels || []).forEach(lvl => {
                        const lvlCode = this.normalizeCefrLevel(lvl.code || lvl.name || course.level);
                        const lvlName = (lvlCode === "Altro") ? (lvl.customName || this.t("otherLevelOpt")) : lvlCode;
                        (lvl.modules || []).forEach((mod, mIdx) => {
                            const mShort = this.extractModuleShortCode(mod.name, mIdx + 1);
                            const display = `${lvlName} ${mShort}`;
                            (mod.studentIds || []).forEach(stId => {
                                studentMap.set(stId, { code: lvlCode, display: display });
                            });
                        });
                    });
                });

                this.state.studentsDirectory.forEach(st => {
                    const match = studentMap.get(st.id);
                    if (match) {
                        st.currentLevel = match.code;
                        st.lastFollowedLevel = match.display;
                    } else {
                        const fallbackCode = this.normalizeCefrLevel(st.currentLevel) || "A1";
                        st.currentLevel = fallbackCode;
                        st.lastFollowedLevel = fallbackCode === "Altro" ? this.t("otherLevelOpt") : fallbackCode;
                    }
                });
            }

            ensureDataMigration() {
                let migrated = false;
                if (!this.state.settings) {
                    this.state.settings = JSON.parse(JSON.stringify(INITIAL_DATA.settings));
                    migrated = true;
                }
                if (!this.state.settings.currency) {
                    this.state.settings.currency = "$";
                    migrated = true;
                }
                if (this.state.settings.maxAbsenceThreshold !== undefined) {
                    delete this.state.settings.maxAbsenceThreshold;
                    migrated = true;
                }
                if (!Array.isArray(this.state.rubrics) || this.state.rubrics.length === 0) {
                    this.state.rubrics = JSON.parse(JSON.stringify(INITIAL_DATA.rubrics));
                    migrated = true;
                } else {
                    const oldDefaultIdx = this.state.rubrics.findIndex(r => r.id === "rub-default-1" && (r.criteria || []).length === 4);
                    if (oldDefaultIdx >= 0) {
                        this.state.rubrics[oldDefaultIdx] = JSON.parse(JSON.stringify(INITIAL_DATA.rubrics[0]));
                        migrated = true;
                    }
                }
                if (!Array.isArray(this.state.studentsDirectory)) {
                    this.state.studentsDirectory = [];
                    migrated = true;
                }
                if (!Array.isArray(this.state.courses)) {
                    this.state.courses = [];
                    migrated = true;
                }
                if (!Array.isArray(this.state.deletedItems)) {
                    this.state.deletedItems = [];
                    migrated = true;
                } else {
                    const now = Date.now();
                    const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
                    const prevCount = this.state.deletedItems.length;
                    this.state.deletedItems = this.state.deletedItems.filter(item => {
                        const t = item.deletedAt ? new Date(item.deletedAt).getTime() : now;
                        return (now - t) < thirtyDaysMs;
                    });
                    if (this.state.deletedItems.length !== prevCount) migrated = true;
                }
                if (!this.state.settings.updateCheckFrequency) {
                    this.state.settings.updateCheckFrequency = "startup";
                    migrated = true;
                }
                if (this.state.settings.autoDownloadUpdates === undefined) {
                    this.state.settings.autoDownloadUpdates = true;
                    migrated = true;
                }
                if (this.state.settings.onboardingCompleted === undefined) {
                    const hasExistingData = (this.state.courses && this.state.courses.length > 0) ||
                                            (this.state.studentsDirectory && this.state.studentsDirectory.length > 0);
                    this.state.settings.onboardingCompleted = hasExistingData;
                    migrated = true;
                }
                if (this.state.settings.showGoogleCalendarEvents === undefined) {
                    this.state.settings.showGoogleCalendarEvents = true;
                    migrated = true;
                }
                if (this.state.settings.googleCalendarConnected === undefined) {
                    this.state.settings.googleCalendarConnected = false;
                    migrated = true;
                }

                this.state.studentsDirectory.forEach(st => {
                    if (st.phone === undefined) { st.phone = ""; migrated = true; }
                    st.currentLevel = this.normalizeCefrLevel(st.currentLevel || "A1");
                    if (!st.billingInfo) {
                        st.billingInfo = {
                            idType: "cedula",
                            idNumber: "",
                            fullName: `${st.firstName || ""} ${st.lastName || ""}`.trim(),
                            city: st.city || "",
                            address: "",
                            phone: st.phone || "",
                            email: st.email || ""
                        };
                        migrated = true;
                    }
                });

                const assignedColors = new Set();
                this.state.courses.forEach((c, cIdx) => {
                    c.level = this.normalizeCefrLevel(c.level || "A1");
                    if (!c.color || !COURSE_COLOR_PALETTE.some(p => p.id === c.color) || assignedColors.has(c.color)) {
                        const freePal = COURSE_COLOR_PALETTE.find(p => !assignedColors.has(p.id)) || COURSE_COLOR_PALETTE[cIdx % COURSE_COLOR_PALETTE.length];
                        c.color = freePal.id;
                        migrated = true;
                    }
                    assignedColors.add(c.color);

                    if (!c.gradeConfig) {
                        c.gradeConfig = {
                            calcMethod: "average",
                            minPass: this.state.settings.passThreshold || 6,
                            evaluateAttendance: false,
                            attendanceWeight: 5,
                            activities: []
                        };
                        migrated = true;
                    } else {
                        if (c.gradeConfig.evaluateAttendance === undefined) {
                            c.gradeConfig.evaluateAttendance = false;
                            migrated = true;
                        }
                        if (c.gradeConfig.attendanceWeight === undefined) {
                            c.gradeConfig.attendanceWeight = 5;
                            migrated = true;
                        }
                        (c.gradeConfig.activities || []).forEach(act => {
                            if (act.useRubric === undefined) {
                                act.useRubric = !!act.rubricId;
                                migrated = true;
                            }
                        });
                    }

                    this.syncCourseLevelsAndSections(c);
                    if (!c.billingConfig) {
                        c.billingConfig = {
                            hourlyRateNet: 10,
                            lessonDurationHours: 1.5,
                            vatPercent: 15,
                            billingInfo: {
                                idType: "cedula",
                                idNumber: "",
                                fullName: c.name || "",
                                city: "",
                                address: "",
                                phone: "",
                                email: ""
                            }
                        };
                        migrated = true;
                    }
                    if (!c.rubricEvaluations || typeof c.rubricEvaluations !== "object") {
                        c.rubricEvaluations = {};
                        migrated = true;
                    }
                });

                this.syncAllStudentsLevels();

                if (this.state.version !== INITIAL_DATA.version) {
                    this.state.version = INITIAL_DATA.version;
                    migrated = true;
                }
                // Always populate full historical release notes for the UI changelog modal
                this.state.changelog = INITIAL_DATA.changelog;

                if (migrated) {
                    this.persist();
                }
            }

            extractDateFromSlotKey(slotKey) {
                if (!slotKey) return "";
                return String(slotKey).substring(0, 10);
            }

            findLessonForSlot(course, sectionId, slotKey) {
                if (!course || !Array.isArray(course.lessons) || !slotKey) return null;
                const dPart = this.extractDateFromSlotKey(slotKey);
                let les = course.lessons.find(l => l.slotKey === slotKey && (!l.sectionId || l.sectionId === sectionId));
                if (les) return les;
                if (slotKey.length === 10) {
                    return course.lessons.find(l => l.date === dPart && !l.slotKey && (!l.sectionId || l.sectionId === sectionId)) || null;
                }
                return null;
            }

            sortModuleSlots(course, mod) {
                if (!mod || !Array.isArray(mod.dates)) return [];
                const refStart = mod.startTime || course?.startTime || "19:00";
                mod.dates.sort((a, b) => {
                    const da = this.extractDateFromSlotKey(a);
                    const db = this.extractDateFromSlotKey(b);
                    if (da !== db) return da.localeCompare(db);
                    const la = this.findLessonForSlot(course, mod.id, a);
                    const lb = this.findLessonForSlot(course, mod.id, b);
                    const ta = la?.time || refStart;
                    const tb = lb?.time || refStart;
                    if (ta !== tb) return ta.localeCompare(tb);
                    return String(a).localeCompare(String(b));
                });
                return mod.dates;
            }

            hasAttendanceRecord(section, slotKey) {
                if (!section || !section.attendance) return false;
                for (const stId of Object.keys(section.attendance)) {
                    const val = section.attendance[stId]?.[slotKey];
                    if (val && typeof val === "string" && val.trim() !== "") {
                        return true;
                    }
                }
                return false;
            }

            openExternalLink(url) {
                if (!url) return;
                const trimmed = String(url).trim();
                if (!trimmed) return;
                if (window.electronAPI && typeof window.electronAPI.openExternal === "function") {
                    window.electronAPI.openExternal(trimmed);
                } else {
                    window.open(trimmed, "_blank");
                }
            }

            calculateLessonDurationMinutes(startTime, endTime) {
                if (!startTime || !endTime) return 90;
                const [sh, sm] = String(startTime).split(":").map(Number);
                const [eh, em] = String(endTime).split(":").map(Number);
                let diff = ((eh || 0) * 60 + (em || 0)) - ((sh || 0) * 60 + (sm || 0));
                if (diff <= 0) diff += 24 * 60;
                return diff || 90;
            }

            formatDurationHuman(diffMinutes) {
                const mins = Math.max(1, parseInt(diffMinutes, 10) || 90);
                const h = Math.floor(mins / 60);
                const m = mins % 60;
                if (h > 0 && m > 0) return `${h}h ${m}m`;
                if (h > 0) return `${h}h`;
                return `${m}m`;
            }

            getAllScheduledLessons(activeCourses) {
                const list = [];
                const now = new Date();
                const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
                const nowTime = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

                for (const c of (activeCourses || [])) {
                    const pal = this.getCourseColorObj(c.color);
                    for (const lvl of (c.levels || [])) {
                        for (const mod of (lvl.modules || [])) {
                            const badge = this.formatLevelModuleBadge(c, lvl, mod);
                            const stCount = (mod.studentIds || []).length;
                            const sortedSlots = this.sortModuleSlots(c, mod) || [];

                            const enrolledStudentNames = (mod.studentIds || []).map(sid => {
                                const st = (this.state.studentsDirectory || []).find(s => s.id === sid);
                                return st ? `${st.firstName} ${st.lastName}`.trim() : "";
                            }).filter(Boolean);

                            for (let i = 0; i < sortedSlots.length; i++) {
                                const slotKey = sortedSlots[i];
                                const dateIso = this.extractDateFromSlotKey(slotKey);
                                const les = this.findLessonForSlot(c, mod.id, slotKey);
                                const sTime = les?.time || mod.startTime || c.startTime || "19:00";
                                const eTime = les?.endTime || mod.endTime || c.endTime || "20:30";
                                const meetUrl = (les?.googleMeetUrl && les.googleMeetUrl.trim()) ? les.googleMeetUrl.trim() : (mod.googleMeetUrl ? mod.googleMeetUrl.trim() : "");
                                const durMins = this.calculateLessonDurationMinutes(sTime, eTime);
                                const durHuman = this.formatDurationHuman(durMins);
                                const lessonNum = i + 1;
                                const rawTitle = (les?.title || "").trim();
                                const hasCustomTitle = rawTitle.length > 0;
                                const lessonTitle = hasCustomTitle ? rawTitle : `${this.t("lessonNumberTitle")} ${lessonNum}`;
                                const hasAttendance = this.hasAttendanceRecord(mod, slotKey);

                                const isLiveNow = (dateIso === todayIso && sTime <= nowTime && nowTime < eTime);
                                const isFutureOrToday = (dateIso > todayIso) || (dateIso === todayIso && eTime > nowTime);
                                const isPast = (dateIso < todayIso) || (dateIso === todayIso && eTime <= nowTime);

                                list.push({
                                    course: c,
                                    level: lvl,
                                    module: mod,
                                    slotKey,
                                    dateIso,
                                    sTime,
                                    eTime,
                                    durMins,
                                    durHuman,
                                    meetUrl,
                                    lessonNum,
                                    lessonTitle,
                                    hasCustomTitle,
                                    badge,
                                    color: pal,
                                    studentCount: stCount,
                                    studentNames: enrolledStudentNames,
                                    topics: (les?.topics || "").trim(),
                                    objectives: (les?.objectives || "").trim(),
                                    homework: (les?.homework || "").trim(),
                                    notes: (les?.notes || "").trim(),
                                    hasAttendance,
                                    isLiveNow,
                                    isFutureOrToday,
                                    isPast
                                });
                            }
                        }
                    }
                }

                list.sort((a, b) => {
                    if (a.dateIso !== b.dateIso) return a.dateIso.localeCompare(b.dateIso);
                    return a.sTime.localeCompare(b.sTime);
                });

                return list;
            }

            parseStudentWhatsAppPhone(rawPhone) {
                if (!rawPhone) return { hasPrefix: false, cleanDigits: "" };
                const trimmed = String(rawPhone).trim();
                const hasExplicitPlus = trimmed.startsWith("+") || trimmed.startsWith("00");
                let digits = trimmed.replace(/\D+/g, "");
                if (trimmed.startsWith("00")) {
                    digits = digits.substring(2);
                }
                if (!digits) return { hasPrefix: false, cleanDigits: "" };

                if (hasExplicitPlus) {
                    return { hasPrefix: true, cleanDigits: digits };
                }

                if (digits.startsWith("0")) {
                    return { hasPrefix: false, cleanDigits: digits };
                }

                const matchedPrefix = COUNTRY_DIAL_PREFIXES.find(p => digits.startsWith(p.code) && (digits.length - p.code.length) >= 8);
                if (matchedPrefix) {
                    return { hasPrefix: true, cleanDigits: digits };
                }

                return { hasPrefix: false, cleanDigits: digits };
            }

            contactStudentViaWhatsApp(studentId) {
                const st = (this.state.studentsDirectory || []).find(s => s.id === studentId);
                if (!st) return;

                if (!st.phone || !String(st.phone).trim()) {
                    this.showToast("Nessun numero di telefono registrato per questo studente", "error");
                    return;
                }

                const parsed = this.parseStudentWhatsAppPhone(st.phone);
                if (!parsed.cleanDigits) {
                    this.showToast("Numero di telefono non valido", "error");
                    return;
                }

                if (parsed.hasPrefix) {
                    const waUrl = `https://wa.me/${parsed.cleanDigits}`;
                    window.open(waUrl, "_blank", "noopener,noreferrer");
                } else {
                    this.openWhatsAppPrefixSelectorModal(st.id);
                }
            }

                                    <span class="px-2.5 py-0.5 rounded-lg bg-emerald-600 text-white font-extrabold flex items-center gap-1">
                                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                                    </span>
                                    <span class="font-bold text-slate-500">${this.escapeHtml(st.firstName)} ${this.escapeHtml(st.lastName)}</span>
                                </div>
                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white mt-1">Seleziona il Prefisso Internazionale</h3>
                                <p class="text-[11px] text-slate-500 mt-0.5">
                                    Il numero <strong>${this.escapeHtml(st.phone)}</strong> non include il prefisso del paese. Scegli la nazione qui sotto per aggiungerlo automaticamente alla scheda dello studente e aprire WhatsApp:
                                </p>

                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                            ${COUNTRY_DIAL_PREFIXES.map(c => `

                            <div class="flex items-center gap-2">
                                <label class="font-bold text-slate-600 dark:text-slate-300">Altro prefisso:</label>

            applyPrefixAndOpenWhatsApp(studentId, rawPrefixCode) {
                const st = (this.state.studentsDirectory || []).find(s => s.id === studentId);
                if (!st) return;

                const cleanPrefix = String(rawPrefixCode || "").replace(/\D+/g, "");
                if (!cleanPrefix) {
                    this.showToast("Inserisci un prefisso valido", "error");
                    return;
                }

                let localDigits = String(st.phone || "").replace(/\D+/g, "");
                if (localDigits.startsWith("0")) {
                    localDigits = localDigits.replace(/^0+/, "");
                }

                const fullCleanDigits = `${cleanPrefix}${localDigits}`;
                st.phone = `+${cleanPrefix} ${localDigits}`;
                if (st.billingInfo) {
                    st.billingInfo.phone = st.phone;
                }

                this.persist();
                this.openStudentDetailModal(st.id);
                this.renderAll();
                this.showToast(`Prefisso +${cleanPrefix} salvato nella scheda dello studente`, "success");

                const waUrl = `https://wa.me/${fullCleanDigits}`;
                window.open(waUrl, "_blank", "noopener,noreferrer");
            }

            syncCourseLevelsAndSections(course) {
                if (!course) return;
                if (!Array.isArray(course.levels) || course.levels.length === 0) {
                    const defaultCode = this.normalizeCefrLevel(course.level || "A1");
                    const modules = Array.isArray(course.sections) && course.sections.length > 0
                        ? course.sections.map((s, idx) => ({
                            id: s.id || ("sec-" + Math.random().toString(36).substr(2, 6)),
                            name: this.extractModuleShortCode(s.name, idx + 1),
                            description: s.description || "",
                            startTime: s.startTime || course.startTime || "19:00",
                            endTime: s.endTime || course.endTime || "20:30",
                            scheduleNote: s.scheduleNote || course.scheduleNote || "",
                            studentIds: Array.isArray(s.studentIds) ? s.studentIds : (course.students || []).map(st => st.id),
                            dates: Array.isArray(s.dates) ? s.dates : [],
                            attendance: s.attendance || {},
                            billing: s.billing || null
                        }))
                        : [{
                            id: "sec-" + Math.random().toString(36).substr(2, 6),
                            name: "M1",
                            description: "",
                            startTime: course.startTime || "19:00",
                            endTime: course.endTime || "20:30",
                            scheduleNote: course.scheduleNote || "",
                            studentIds: (course.students || []).map(st => st.id),
                            dates: [],
                            attendance: {},
                            billing: null
                        }];
                    course.levels = [{
                        id: "lvl-" + Math.random().toString(36).substr(2, 6),
                        code: defaultCode,
                        customName: "",
                        name: defaultCode === "Altro" ? this.t("otherLevelOpt") : defaultCode,
                        sublevel: "",
                        modules
                    }];
                }

                const defaultHourly = parseFloat(course.billingConfig?.hourlyRateNet) || 10;
                const defaultDur = parseFloat(course.billingConfig?.lessonDurationHours) || 1.5;
                const defaultVat = course.billingConfig?.vatPercent !== undefined ? parseFloat(course.billingConfig.vatPercent) : 15;

                course.levels.forEach(lvl => {
                    lvl.code = this.normalizeCefrLevel(lvl.code || lvl.name || course.level || "A1");
                    lvl.name = lvl.code === "Altro" ? (lvl.customName || this.t("otherLevelOpt")) : lvl.code;
                    if (!Array.isArray(lvl.modules) || lvl.modules.length === 0) {
                        lvl.modules = [{
                            id: "sec-" + Math.random().toString(36).substr(2, 6),
                            name: "M1",
                            description: "",
                            startTime: course.startTime || "19:00",
                            endTime: course.endTime || "20:30",
                            scheduleNote: course.scheduleNote || "",
                            studentIds: (course.students || []).map(st => st.id),
                            dates: [],
                            attendance: {},
                            billing: null
                        }];
                    }
                    lvl.modules.forEach(mod => {
                        if (!Array.isArray(mod.studentIds)) mod.studentIds = [];
                        if (!Array.isArray(mod.dates)) mod.dates = [];
                        if (!mod.attendance || typeof mod.attendance !== "object") mod.attendance = {};
                        if (mod.description === undefined) mod.description = "";
                        if (!mod.startTime) mod.startTime = course.startTime || "19:00";
                        if (!mod.endTime) mod.endTime = course.endTime || "20:30";
                        if (mod.scheduleNote === undefined) mod.scheduleNote = course.scheduleNote || "";
                        if (mod.evaluateAttendance === undefined) {
                            mod.evaluateAttendance = !!course.gradeConfig?.evaluateAttendance;
                        }
                        if (mod.attendanceWeight === undefined) {
                            mod.attendanceWeight = course.gradeConfig?.attendanceWeight !== undefined ? Number(course.gradeConfig.attendanceWeight) : 5;
                        }
                        if (!mod.billing || typeof mod.billing !== "object") {
                            mod.billing = {
                                hourlyRateNet: defaultHourly,
                                lessonDurationHours: defaultDur,
                                vatPercent: defaultVat,
                                discountType: "percent",
                                discountTarget: "total",
                                discountValue: 0
                            };
                        }
                    });
                });
            }

            selectLatestLevelAndModule(course) {
                if (!course) return;
                this.syncCourseLevelsAndSections(course);
                const levels = course.levels || [];
                if (levels.length > 0) {
                    const lastLvl = levels[levels.length - 1];
                    this.activeLevelByCourse[course.id] = lastLvl.id;
                    const mods = lastLvl.modules || [];
                    if (mods.length > 0) {
                        const lastMod = mods[mods.length - 1];
                        this.activeModuleByLevel[`${course.id}_${lastLvl.id}`] = lastMod.id;
                    }
                }
            }

            getActiveCourse() {
                return (this.state.courses || []).find(c => c.id === this.state.activeCourseId) || null;
            }

            getActiveLevel(course) {
                if (!course) return null;
                this.syncCourseLevelsAndSections(course);
                const targetId = this.activeLevelByCourse[course.id];
                let lvl = (course.levels || []).find(l => l.id === targetId);
                if (!lvl) {
                    lvl = course.levels[course.levels.length - 1] || course.levels[0];
                    if (lvl) this.activeLevelByCourse[course.id] = lvl.id;
                }
                return lvl || null;
            }

            getActiveSection(course) {
                if (!course) return null;
                const lvl = this.getActiveLevel(course);
                if (!lvl) return null;
                const key = `${course.id}_${lvl.id}`;
                const targetModId = this.activeModuleByLevel[key];
                let mod = (lvl.modules || []).find(m => m.id === targetModId);
                if (!mod) {
                    mod = lvl.modules[lvl.modules.length - 1] || lvl.modules[0];
                    if (mod) this.activeModuleByLevel[key] = mod.id;
                }
                return mod || null;
            }

            getModuleStudents(course, module) {
                if (!course || !module) return [];
                const ids = module.studentIds || [];
                return ids.map(id => {
                    const globalSt = (this.state.studentsDirectory || []).find(s => s.id === id);
                    if (globalSt) {
                        return {
                            id: globalSt.id,
                            name: `${globalSt.firstName} ${globalSt.lastName}`.trim(),
                            firstName: globalSt.firstName,
                            lastName: globalSt.lastName,
                            email: globalSt.email,
                            phone: globalSt.phone
                        };
                    }
                    const fallback = (course.students || []).find(s => s.id === id);
                    return fallback || { id, name: "Studente" };
                });
            }

            async persist() {
                this.state.lastUpdated = new Date().toISOString();
                this.syncAllStudentsLevels();
                await this.memoryDB.saveState(this.state);
            }

            setupSystemThemeListener() {
                if (window.matchMedia) {
                    const mq = window.matchMedia("(prefers-color-scheme: dark)");
                    mq.addEventListener("change", () => {
                        if (this.state?.settings?.theme === "system") {
                            this.applyTheme();
                        }
                    });
                }
            }

            applyTheme() {
                const mode = this.state?.settings?.theme || "system";
                let isDark = false;
                if (mode === "dark") isDark = true;
                else if (mode === "light") isDark = false;
                else if (window.matchMedia) {
                    isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                }
                document.documentElement.classList.toggle("dark", isDark);
                const btn = document.getElementById("headerThemeBtn");
                if (btn) {
                    if (mode === "system") {
                        btn.innerHTML = `<i class="fa-solid fa-circle-half-stroke"></i>`;
                        btn.title = this.t("themeAuto");
                    } else if (mode === "dark") {
                        btn.innerHTML = `<i class="fa-solid fa-moon"></i>`;
                        btn.title = this.t("themeDark");
                    } else {
                        btn.innerHTML = `<i class="fa-solid fa-sun"></i>`;
                        btn.title = this.t("themeLight");
                    }
                }
            }

            cycleThemeMode() {
                const order = ["system", "light", "dark"];
                const curr = this.state.settings.theme || "system";
                const next = order[(order.indexOf(curr) + 1) % order.length];
                this.state.settings.theme = next;
                this.applyTheme();
                this.persist();
                const labels = { system: this.t("themeAuto"), light: this.t("themeLight"), dark: this.t("themeDark") };
                this.showToast(labels[next], "info");
                if (this.currentTab === "settings") this.renderMainView();
            }

            toggleSidebarMini() {
                this.state.settings.sidebarMini = !this.state.settings.sidebarMini;
                this.applySidebarState();
                this.persist();
            }

            applySidebarState() {
                const sidebar = document.getElementById("appSidebar");
                const icon = document.getElementById("sidebarCollapseIcon");
                if (!sidebar) return;
                const isMini = !!this.state?.settings?.sidebarMini;
                sidebar.classList.toggle("sidebar-mini", isMini);
                if (icon) {
                    icon.className = isMini ? "fa-solid fa-angles-right text-xs" : "fa-solid fa-angles-left text-xs";
                }
            }

            openMobileSidebar() {
                const sb = document.getElementById("appSidebar");
                const bd = document.getElementById("sidebarBackdrop");
                if (sb) sb.classList.remove("-translate-x-full");
                if (bd) bd.classList.remove("hidden");
            }

            closeMobileSidebar() {
                const sb = document.getElementById("appSidebar");
                const bd = document.getElementById("sidebarBackdrop");
                if (sb) sb.classList.add("-translate-x-full");
                if (bd) bd.classList.add("hidden");
            }

            formatDateDisplay(dateStr) {
                if (!dateStr) return "";
                const parts = String(dateStr).split("-");
                if (parts.length !== 3) return dateStr;
                const [y, m, d] = parts;
                const fmt = this.state?.settings?.dateFormat || "DD/MM/YYYY";
                if (fmt === "MM/DD/YYYY") return `${m}/${d}/${y}`;
                if (fmt === "YYYY-MM-DD") return `${y}-${m}-${d}`;
                return `${d}/${m}/${y}`;
            }

            deepClone(obj) {
                if (typeof structuredClone === "function") {
                    try { return structuredClone(obj); } catch (e) {}
                }
                return JSON.parse(JSON.stringify(obj));
            }

            formatShortWeekdayDate(dateStr) {
                if (!dateStr) return "";
                if (!this._shortDateCache) this._shortDateCache = new Map();
                const cached = this._shortDateCache.get(dateStr);
                if (cached) return cached;
                const d = new Date(dateStr + "T12:00:00");
                if (isNaN(d.getTime())) return dateStr;
                const daysSun = this.t("daysShortSun");
                const months = this.t("months");
                const dayName = daysSun[d.getDay()];
                const mShort = (months[d.getMonth()] || "").substring(0, 3);
                const res = `${dayName} ${d.getDate()} ${mShort}`;
                this._shortDateCache.set(dateStr, res);
                return res;
            }

            formatTimeDisplay(timeStr) {
                if (!timeStr) return "";
                if (this.state?.settings?.timeFormat !== "12h") return timeStr;
                const [hStr, mStr] = String(timeStr).split(":");
                let h = parseInt(hStr, 10);
                if (isNaN(h)) return timeStr;
                const ampm = h >= 12 ? "PM" : "AM";
                h = h % 12 || 12;
                return `${String(h).padStart(2, "0")}:${mStr || "00"} ${ampm}`;
            }

            renderAll() {
                this._shortDateCache = new Map();
                this.applyActiveCourseColorTheme();
                this.renderHeaderAndSidebarControls();
                this.renderCourseContextHeaderBar();
                this.renderMainView();

            renderHeaderAndSidebarControls() {

            switchTab(tabId) {
                if (tabId === "billing" && this.currentTab !== "billing") {
                    this.selectedBillingCourseId = null;
                    this.showGroupBillingData = false;
                }
                this.currentTab = tabId;
                this.closeMobileSidebar();
                this.renderAll();
            }

            switchCourse(courseId, targetTab = null) {
                const course = (this.state.courses || []).find(c => c.id === courseId);
                if (!course) return;
                this.state.activeCourseId = course.id;
                this.selectLatestLevelAndModule(course);
                if (targetTab) this.currentTab = targetTab;
                else if (this.currentTab === "home") this.currentTab = "attendance";
                this.persist();
                this.renderAll();
            }

            switchLevel(levelId) {
                const course = this.getActiveCourse();
                if (!course) return;
                this.activeLevelByCourse[course.id] = levelId;
                const lvl = this.getActiveLevel(course);
                if (lvl && Array.isArray(lvl.modules) && lvl.modules.length > 0) {
                    const lastMod = lvl.modules[lvl.modules.length - 1];
                    this.activeModuleByLevel[`${course.id}_${lvl.id}`] = lastMod.id;
                }
                this.renderAll();
            }

            switchSection(modId) {
                const course = this.getActiveCourse();
                const lvl = this.getActiveLevel(course);
                if (!course || !lvl) return;
                this.activeModuleByLevel[`${course.id}_${lvl.id}`] = modId;
                this.renderAll();
            }

            renderMainView() {
                const container = document.getElementById("mainViewContainer");
                if (!container) return;

                // Capture scroll positions before re-rendering
                const scrollStates = [];
                const scrollables = container.querySelectorAll(".overflow-x-auto, .overflow-y-auto, [id*='Scroll']");
                scrollables.forEach(el => {
                    scrollStates.push({
                        id: el.id,
                        scrollLeft: el.scrollLeft,
                        scrollTop: el.scrollTop
                    });
                });
                const mainArea = document.getElementById("mainContentArea");
                const mainScrollTop = mainArea ? mainArea.scrollTop : 0;
                const mainScrollLeft = mainArea ? mainArea.scrollLeft : 0;

                switch (this.currentTab) {
                    case "home":
                        this.renderHomeView(container);
                        break;
                    case "attendance":
                        this.renderAttendanceView(container);
                        break;
                    case "grades":
                        this.renderGradesView(container);
                        break;
                    case "activities":
                        this.renderActivitiesView(container);
                        break;
                    case "rubrics":
                        this.renderRubricsView(container);
                        break;
                    case "courseConfig":
                        this.renderCourseConfigView(container);
                        break;
                    case "moduleStudentCalendar":
                        this.renderModuleStudentCalendarView(container);
                        break;
                    case "formerStudents":
                        this.renderFormerStudentsView(container);
                        break;
                    case "calendar":
                        this.renderCalendarView(container);
                        break;
                    case "students":
                        this.renderStudentsDirectoryView(container);
                        break;
                    case "archived":
                        this.renderArchivedCoursesView(container);
                        break;
                    case "trashBin":
                        this.renderTrashBinView(container);
                        break;
                    case "settings":
                        this.renderSettingsView(container);
                        break;
                    case "credits":
                        this.renderCreditsView(container);
                        break;
                    case "billing":
                        this.renderBillingView(container);
                        break;
                    default:
                        this.renderHomeView(container);
                }

                // Restore scroll positions after re-rendering
                if (mainArea) {
                    mainArea.scrollTop = mainScrollTop;
                    mainArea.scrollLeft = mainScrollLeft;
                }
                const newScrollables = container.querySelectorAll(".overflow-x-auto, .overflow-y-auto, [id*='Scroll']");
                newScrollables.forEach((el, idx) => {
                    if (idx < scrollStates.length) {
                        el.scrollLeft = scrollStates[idx].scrollLeft;
                        el.scrollTop = scrollStates[idx].scrollTop;
                    }
                });

                                                    <i class="fa-regular fa-calendar text-sky-600 text-xs"></i>
                                                    <span>${this.formatDateDisplay(sl.dateIso)}</span>
                                                    <span class="text-slate-300 dark:text-slate-600">•</span>
                                                    <span class="text-slate-500 dark:text-slate-400 font-mono text-[10.5px]">${this.formatTimeDisplay(sl.sTime)}</span>

                                            <div class="flex items-center gap-1.5 pt-2 border-t border-slate-100 dark:border-slate-800/80">

                                                            class="flex-1 py-1.5 px-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-[10.5px] flex items-center justify-center gap-1 transition"

                                                        class="${sl.meetUrl ? 'p-1.5' : 'flex-1 py-1.5 px-2'} rounded-lg border border-sky-200 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-navy-800 text-sky-700 dark:text-sky-300 font-bold text-[10.5px] flex items-center justify-center gap-1 transition"
                                                        title="${this.t('copyLessonInviteBtn')}">
                                                    <i class="fa-solid fa-share-nodes text-xs"></i> ${sl.meetUrl ? '' : this.t('copyLessonInviteBtn')}

                                                <button type="button" onclick="app.openLessonPlanModal('${sl.course.id}', '${sl.module.id}', '${sl.slotKey}')"
                                                        class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-navy-800 text-slate-600 dark:text-slate-400 text-xs transition"
                                                        title="${this.t('lessonPlanTitle')}">

                        <!-- Active Courses Grid Heading & Cards -->
                        <div class="space-y-3 pt-2">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                                    <i class="fa-solid fa-folder-open text-sky-600"></i>
                                    <span>${this.t("yourCoursesHeading")}</span>
                                </h3>
                                <span class="text-xs text-slate-400 font-semibold">${activeCourses.length} corsi</span>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                ${activeCourses.map(c => {
                                    const lvl = this.getActiveLevel(c);
                                    const mod = this.getActiveSection(c);
                                    const badge = this.formatLevelModuleBadge(c, lvl, mod);
                                    const stCount = (mod?.studentIds || []).length;
                                    const datesCount = (mod?.dates || []).length;
                                    const isCurrent = c.id === this.state.activeCourseId;
                                    const pal = this.getCourseColorObj(c.color);

                                    return `
                                        <div class="bg-white dark:bg-navy-900 rounded-2xl border-2 p-5 shadow-xs flex flex-col justify-between gap-4 hover:shadow-md transition" style="border-color: ${isCurrent ? pal.hex : pal.border}; border-top-width: 6px; border-top-color: ${pal.hex};">
                                            <div class="space-y-3">
                                                <div>
                                                    <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(c.name)}</h3>
                                                </div>
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="px-2.5 py-0.5 rounded-lg text-white text-xs font-extrabold" style="background-color:${pal.hex}">${this.escapeHtml(badge)}</span>
                                                    <span class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-navy-800 text-slate-600 dark:text-slate-300 text-[11px] font-semibold">
                                                        ${c.type === "private" ? this.t("privateBadge") : this.t("groupBadge")}
                                                    </span>
                                                </div>
                                                <div class="grid grid-cols-2 gap-2 pt-1 text-xs">
                                                    <div class="p-2.5 rounded-xl bg-sky-50/60 dark:bg-navy-800/70">
                                                        <span class="text-[10px] text-slate-400 block">${this.t("studentsCountLabel")}</span>
                                                        <span class="font-extrabold text-slate-800 dark:text-slate-100">${stCount}</span>
                                                    </div>
                                                    <div class="p-2.5 rounded-xl bg-sky-50/60 dark:bg-navy-800/70">
                                                        <span class="text-[10px] text-slate-400 block">${this.t("lessonsCountLabel")}</span>
                                                        <span class="font-extrabold text-slate-800 dark:text-slate-100">${datesCount}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="flex items-center justify-between gap-2 pt-3 border-t border-sky-100/80 dark:border-slate-800">
                                                <button onclick="app.switchCourse('${c.id}', 'attendance')" class="flex-1 py-2 px-3 rounded-xl text-white text-xs font-bold flex items-center justify-center gap-1.5 transition" style="background-color:${pal.hex}">
                                                    <i class="fa-solid fa-clipboard-user"></i> ${this.t("openCourseBtn")}
                                                </button>
                                                <button onclick="app.confirmDeleteOrArchiveCourse('${c.id}')" class="py-2 px-3 rounded-xl border border-rose-200 dark:border-rose-900/50 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-xs font-bold" title="${this.t("deleteBtn")}">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>

                                        </div>

                                }).join("")}
