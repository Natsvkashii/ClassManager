                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>
                `;
            }

            /**
             * Continuous Module Calendar ("Calendario Modulo") View
             * - Starts from the Monday/Sunday of the week of the first lesson and displays all weeks continuously until the end of the module.
             * - Shows lesson number without '#' in front, time, and title.
             */

            // ==============================================================================
            // DYNAMIC DRAG & DROP MODULE CALENDAR ("CALENDARIO MODULO")
            // ==============================================================================
            handleLessonDragStart(e, slotKey) {
                this.draggedSlotKey = slotKey;
                e.dataTransfer.setData("text/plain", slotKey);
                e.dataTransfer.effectAllowed = "move";
                if (e.currentTarget) e.currentTarget.classList.add("opacity-40");
            }

            handleLessonDragEnd(e) {
                this.draggedSlotKey = null;
                this.stopAutoScroll();
                if (e.currentTarget) e.currentTarget.classList.remove("opacity-40");
                document.querySelectorAll(".calendar-day-cell").forEach(el => {
                    el.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                });
            }

            handleDayDragOver(e, dayIso) {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                const cell = e.currentTarget;
                if (cell) {
                    cell.classList.add("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                }
            }

            handleDayDragLeave(e, dayIso) {
                const cell = e.currentTarget;
                if (cell) {
                    cell.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                }
            }

            handleDayDrop(e, newDateStr) {
                e.preventDefault();
                this.stopAutoScroll();
                const slotKey = this.draggedSlotKey || e.dataTransfer.getData("text/plain");
                this.draggedSlotKey = null;
                document.querySelectorAll(".calendar-day-cell").forEach(el => {
                    el.classList.remove("bg-sky-100", "dark:bg-sky-950/60", "border-sky-500");
                });
                if (!slotKey || !newDateStr) return;
                this.moveLesson(slotKey, newDateStr);
            }

            startAutoScrollUp() {
                const scrollEl = document.getElementById("calendarScrollContainer");
                if (!scrollEl) return;
                if (this.autoScrollTimer) clearInterval(this.autoScrollTimer);
                this.autoScrollTimer = setInterval(() => {
                    scrollEl.scrollTop -= 20;
                }, 40);
            }

            startAutoScrollDown() {
                const scrollEl = document.getElementById("calendarScrollContainer");
                if (!scrollEl) return;
                if (this.autoScrollTimer) clearInterval(this.autoScrollTimer);
                this.autoScrollTimer = setInterval(() => {
                    scrollEl.scrollTop += 20;
                }, 40);
            }

            stopAutoScroll() {
                if (this.autoScrollTimer) {
                    clearInterval(this.autoScrollTimer);
                    this.autoScrollTimer = null;
                }
            }

            moveLesson(slotKey, newDateStr) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                const oldDate = this.extractDateFromSlotKey(slotKey);
                if (oldDate === newDateStr) return;

                // Capture current scroll positions before modifying state and re-rendering
                const scrollEl = document.getElementById("calendarScrollContainer");
                const savedCalendarScrollTop = scrollEl ? scrollEl.scrollTop : 0;
                const savedWindowScrollY = window.scrollY || document.documentElement.scrollTop || 0;

                this.recordUndoSnapshot();

                let candidate = newDateStr;
                if ((sec.dates || []).includes(candidate)) {
                    candidate = `${newDateStr}__${Math.random().toString(36).substr(2, 5)}`;
                }

                // Update section dates array
                const idx = (sec.dates || []).indexOf(slotKey);
                if (idx >= 0) {
                    sec.dates[idx] = candidate;
                } else {
                    sec.dates.push(candidate);
                }

                // Migrate student attendance
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        if (sec.attendance[stId] && sec.attendance[stId][slotKey] !== undefined) {
                            sec.attendance[stId][candidate] = sec.attendance[stId][slotKey];
                            delete sec.attendance[stId][slotKey];
                        }
                    });
                }

                // Update lesson plan date and slotKey
                if (course.lessons) {
                    const les = course.lessons.find(l => l.slotKey === slotKey && (l.sectionId === null || l.sectionId === sec.id));
                    if (les) {
                        les.date = newDateStr;
                        les.slotKey = candidate;
                    }
                }

                this.sortModuleSlots(course, sec);
                this.persist();
                this.renderAll();

                // Restore scroll positions so the screen NEVER jumps to the top
                const restoreScroll = () => {
                    const newScrollEl = document.getElementById("calendarScrollContainer");
                    if (newScrollEl && savedCalendarScrollTop > 0) {
                        newScrollEl.scrollTop = savedCalendarScrollTop;
                    }
                    if (savedWindowScrollY > 0) {
                        window.scrollTo({ top: savedWindowScrollY, behavior: "instant" });
                    }
                };
                restoreScroll();
                requestAnimationFrame(restoreScroll);
                setTimeout(restoreScroll, 20);

                this.showToast(`📅 Lezione spostata al ${this.formatDateDisplay(newDateStr)}`, "success");
            }

            copyWhatsAppScheduleText() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const slots = [...this.sortModuleSlots(course, sec)];
                if (slots.length === 0) return;

                let txt = `📚 *${course.name}* — ${this.formatLevelModuleBadge(course)}
`;
                txt += `🗓️ *Programma Lezioni (${slots.length} lezioni)*

`;

                slots.forEach((sKey, i) => {
                    const d = this.extractDateFromSlotKey(sKey);
                    const les = this.findLessonForSlot(course, sec.id, sKey);
                    const st = les?.time || sec.startTime || course.startTime || "19:00";
                    const et = les?.endTime || sec.endTime || course.endTime || "20:30";
                    txt += `🔹 *Lez. ${i + 1}* • ${this.formatShortWeekdayDate(d)} (${st}-${et})`;
                    if (les?.title) txt += `
   ✍️ ${les.title}`;
                    txt += `
`;
                });

                txt += `
✨ *Gestione Corsi*`;
                navigator.clipboard.writeText(txt).then(() => {
                    this.showToast("📋 Testo copiato per WhatsApp con successo!", "success");
                }).catch(() => {
                    this.showToast("Testo copiato", "info");
                });
            }

            downloadCalendarSquarePng() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const slots = [...this.sortModuleSlots(course, sec)];

                const canvas = document.createElement("canvas");
                canvas.width = 1200;
                canvas.height = 1200;
                const ctx = canvas.getContext("2d");

                const pal = this.getCourseColorObj(course.color);

                // Background gradient
                const grad = ctx.createLinearGradient(0, 0, 1200, 1200);
                grad.addColorStop(0, "#0b1329");
                grad.addColorStop(1, "#18223c");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1200, 1200);

                // Top Accent Bar
                ctx.fillStyle = pal.hex || "#0284c7";
                ctx.fillRect(0, 0, 1200, 20);

                // Header
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 44px sans-serif";
                ctx.fillText(course.name, 70, 100);

                ctx.fillStyle = pal.hex || "#38bdf8";
                ctx.font = "bold 26px sans-serif";
                ctx.fillText(this.formatLevelModuleBadge(course) + " • Calendario Ufficiale Lezioni", 70, 145);

                ctx.fillStyle = "#94a3b8";
                ctx.font = "20px sans-serif";
                ctx.fillText(`Totale: ${slots.length} lezioni programmate`, 70, 185);

                // Lessons Grid (up to 20 lessons displayed)
                const startY = 240;
                const cardW = 510;
                const cardH = 75;
                const gap = 16;

                slots.slice(0, 20).forEach((slotKey, idx) => {
                    const col = idx % 2;
                    const row = Math.floor(idx / 2);
                    const x = 70 + col * (cardW + 40);
                    const y = startY + row * (cardH + gap);

                    ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(x, y, cardW, cardH, 12);
                    ctx.fill();
                    ctx.stroke();

                    // Lesson Num badge
                    ctx.fillStyle = pal.hex || "#0284c7";
                    ctx.beginPath();
                    ctx.roundRect(x + 12, y + 16, 42, 42, 8);
                    ctx.fill();

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 20px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(`${idx + 1}`, x + 33, y + 43);
                    ctx.textAlign = "left";

                    // Date & Time
                    const d = this.extractDateFromSlotKey(slotKey);
                    const les = this.findLessonForSlot(course, sec.id, slotKey);
                    const st = les?.time || sec.startTime || course.startTime || "19:00";
                    const et = les?.endTime || sec.endTime || course.endTime || "20:30";

                    ctx.fillStyle = "#f8fafc";
                    ctx.font = "bold 18px sans-serif";
                    ctx.fillText(this.formatShortWeekdayDate(d), x + 66, y + 36);

                    ctx.fillStyle = "#94a3b8";
                    ctx.font = "14px sans-serif";
                    ctx.fillText(`${st} - ${et}`, x + 66, y + 56);

                    if (les?.title) {
                        ctx.fillStyle = "#34d399";
                        ctx.font = "bold 14px sans-serif";
                        ctx.fillText(les.title.length > 25 ? les.title.substring(0, 25) + "..." : les.title, x + 230, y + 45);
                    }
                });

                // Footer watermark
                ctx.fillStyle = "#64748b";
                ctx.font = "16px sans-serif";
                ctx.fillText("Gestione Corsi • Concepito e Sviluppato da Guaira Jaramillo Nitoglia", 70, 1150);

                const a = document.createElement("a");
                a.download = `calendario_${course.name.replace(/\s+/g, "_")}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
                this.showToast("🖼️ Immagine calendario generata e scaricata!", "success");
            }

            renderModuleStudentCalendarView(container) {
                const prevScrollEl = document.getElementById("calendarScrollContainer");
                const savedScrollTop = prevScrollEl ? prevScrollEl.scrollTop : null;
                const savedWinScroll = window.scrollY || document.documentElement.scrollTop || 0;

                const course = this.getActiveCourse();
                if (!course) {
                    this.renderHomeView(container);
                    return;
                }
                const activeSection = this.getActiveSection(course);
                if (!activeSection) return;
                const slots = [...this.sortModuleSlots(course, activeSection)];
                const pal = this.getCourseColorObj(course.color);

                if (slots.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-10 text-center space-y-3 text-xs">
                            <p class="text-slate-400 font-bold">${this.t("noScheduledLessonsMsg")}</p>
                            <div class="flex justify-center gap-2">
                                <button onclick="app.openAddDateModal()" class="px-3.5 py-2 rounded-xl bg-sky-600 text-white font-bold">${this.t("addDateBtn")}</button>
                                <button onclick="app.openRecurringGeneratorModal()" class="px-3.5 py-2 rounded-xl border border-sky-200 dark:border-slate-700 font-bold">${this.t("recurringBtn")}</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                if (!this.calendarAdditionalMonths) this.calendarAdditionalMonths = 0;

                const startFirstDayMon = (this.state?.settings?.firstDayOfWeek || "monday") === "monday";
                const dayHeaders = startFirstDayMon ? this.t("daysShortMon") : this.t("daysShortSun");

                const firstDateStr = this.extractDateFromSlotKey(slots[0]);
                const lastDateStr = this.extractDateFromSlotKey(slots[slots.length - 1]);
                const firstDate = new Date(firstDateStr + "T12:00:00");
                const lastDate = new Date(lastDateStr + "T12:00:00");

                // Map slots by ISO date
                const slotsByDate = {};
                slots.forEach((slotKey, idx) => {
                    const dStr = this.extractDateFromSlotKey(slotKey);
                    if (!slotsByDate[dStr]) slotsByDate[dStr] = [];
                    const les = this.findLessonForSlot(course, activeSection.id, slotKey);
                    slotsByDate[dStr].push({
                        slotKey,
                        lessonNumber: idx + 1,
                        time: les?.time || activeSection.startTime || course.startTime || "19:00",
                        endTime: les?.endTime || activeSection.endTime || course.endTime || "20:30",
                        title: les?.title || ""
                    });
                });

                // Generate Month Sections from start month to end month + additionalMonths
                const monthsData = [];
                let mCursor = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
                const maxMonth = new Date(lastDate.getFullYear(), lastDate.getMonth() + this.calendarAdditionalMonths + 1, 1);

                const monthNames = this.t("months");

                while (mCursor < maxMonth) {
                    const y = mCursor.getFullYear();
                    const m = mCursor.getMonth();
                    const monthTitle = `${monthNames[m]} ${y}`;

                    // Build weeks for this specific month
                    const firstDayOfMonth = new Date(y, m, 1);
                    const lastDayOfMonth = new Date(y, m + 1, 0);

                    const startCursor = new Date(firstDayOfMonth);
                    const fDow = startCursor.getDay();
                    const startOffset = startFirstDayMon ? (fDow === 0 ? -6 : 1 - fDow) : -fDow;
                    startCursor.setDate(startCursor.getDate() + startOffset);

                    const endCursor = new Date(lastDayOfMonth);
                    const lDow = endCursor.getDay();
                    const endOffset = startFirstDayMon ? (lDow === 0 ? 0 : 7 - lDow) : (6 - lDow);
                    endCursor.setDate(endCursor.getDate() + endOffset);

                    const weeks = [];
                    let wCursor = new Date(startCursor);
                    let monthSessionCount = 0;

                    while (wCursor <= endCursor) {
                        const weekDays = [];
                        for (let i = 0; i < 7; i++) {
                            const curY = wCursor.getFullYear();
                            const curM = String(wCursor.getMonth() + 1).padStart(2, "0");
                            const curD = String(wCursor.getDate()).padStart(2, "0");
                            const iso = `${curY}-${curM}-${curD}`;
                            const isCurrentMonth = wCursor.getMonth() === m;
                            const sessions = slotsByDate[iso] || [];
                            if (isCurrentMonth) monthSessionCount += sessions.length;

                            weekDays.push({
                                iso,
                                dayNum: wCursor.getDate(),
                                isCurrentMonth,
                                sessions
                            });
                            wCursor.setDate(wCursor.getDate() + 1);
                        }
                        weeks.push(weekDays);
                    }

                    monthsData.push({
                        id: `month-${y}-${m}`,
                        title: monthTitle,
                        sessionCount: monthSessionCount,
                        weeks
                    });

                    mCursor.setMonth(mCursor.getMonth() + 1);
                }

                container.innerHTML = `
                    <div class="space-y-4">
                        <!-- Top Toolbar with Actions and Drag Hint -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-4 shadow-xs flex flex-wrap items-center justify-between gap-3 text-xs">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2 font-extrabold text-slate-800 dark:text-slate-100">
                                    <i class="fa-solid fa-calendar-check text-sky-600"></i>
                                    <span>${this.t("totalLabel")}: <strong>${slots.length}</strong> ${this.t("lessonsLower")}</span>
                                </div>
                                <p class="text-[11px] text-slate-400">${this.t("dragLessonHint")}</p>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="app.copyWhatsAppScheduleText()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold flex items-center gap-1.5 shadow-2xs transition">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> ${this.t("copyTextBtn")}
                                </button>
                                <button onclick="app.downloadCalendarSquarePng()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold flex items-center gap-1.5 shadow-2xs transition">
                                    <i class="fa-regular fa-image"></i> Scarica PNG
                                </button>
                                <button onclick="window.print()" class="px-3 py-2 rounded-xl border border-sky-200 dark:border-slate-700 font-bold hover:bg-sky-50 dark:hover:bg-navy-800 flex items-center gap-1.5">
                                    <i class="fa-solid fa-print text-sky-600"></i> ${this.t("printBtn")}
                                </button>
                            </div>
                        </div>

                        <!-- Top Auto-Scroll Sensor -->
                        <div ondragover="app.startAutoScrollUp()" ondragleave="app.stopAutoScroll()" class="h-6 rounded-xl bg-gradient-to-b from-sky-100/50 dark:from-sky-950/40 to-transparent flex items-center justify-center text-[10px] text-sky-600 font-bold opacity-0 hover:opacity-100 transition cursor-ns-resize">
                            <i class="fa-solid fa-chevron-up mr-1"></i> Trascina qui per scorrere verso l'alto
                        </div>

                        <!-- Multi-Month Scroll View -->
                        <div id="calendarScrollContainer" class="space-y-6 max-h-[72vh] overflow-y-auto custom-scrollbar p-1">
                            ${monthsData.map(mSec => `
                                <div id="${mSec.id}" class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs space-y-3">
                                    <!-- Month Header Banner -->
                                    <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-2.5">
                                        <div class="flex items-center gap-2">
                                            <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(mSec.title)}</h3>
                                            ${mSec.sessionCount > 0 ? `
                                                <span class="px-2 py-0.5 rounded-full bg-sky-100 dark:bg-navy-800 text-sky-700 dark:text-sky-300 text-[10px] font-extrabold">${mSec.sessionCount} lezioni</span>
                                            ` : ''}
                                        </div>
                                    </div>

                                    <!-- Weekdays -->
                                    <div class="grid grid-cols-7 gap-2 text-center text-[11px] font-extrabold uppercase text-slate-400">
                                        ${dayHeaders.map(dh => `<div>${this.escapeHtml(dh)}</div>`).join("")}
                                    </div>

                                    <!-- Weeks & Days Grid -->
                                    <div class="space-y-2">
                                        ${mSec.weeks.map(week => `
                                            <div class="grid grid-cols-7 gap-2">
                                                ${week.map(day => {
                                                    if (!day.isCurrentMonth) {
                                                        return `<div class="min-h-[92px] rounded-xl bg-slate-50/50 dark:bg-navy-950/40 border border-transparent"></div>`;
                                                    }
                                                    const hasLessons = day.sessions.length > 0;
                                                    return `
                                                        <div ondragover="app.handleDayDragOver(event, '${day.iso}')"
                                                             ondragleave="app.handleDayDragLeave(event, '${day.iso}')"
                                                             ondrop="app.handleDayDrop(event, '${day.iso}')"
                                                             class="calendar-day-cell min-h-[92px] rounded-xl p-2 border transition flex flex-col justify-between gap-1.5 ${hasLessons ? 'border-sky-300 dark:border-sky-800 bg-sky-50/30 dark:bg-navy-800/40' : 'border-sky-100 dark:border-slate-800 bg-white dark:bg-navy-900'}">
                                                            <div class="flex items-center justify-between">
                                                                <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${day.dayNum}</span>
                                                            </div>
                                                            <div class="space-y-1.5">
                                                                ${day.sessions.map(sess => `
                                                                    <div draggable="true"
                                                                         ondragstart="app.handleLessonDragStart(event, '${sess.slotKey}')"
                                                                         ondragend="app.handleLessonDragEnd(event)"
                                                                         onclick="app.openLessonPlanModal('${course.id}', '${activeSection.id}', '${sess.slotKey}')"
                                                                         class="cursor-grab active:cursor-grabbing p-1.5 rounded-lg text-white shadow-2xs transition hover:brightness-110 select-none text-[10px]"
                                                                         style="background-color: ${pal.hex || '#0284c7'}">
                                                                        <div class="flex items-center justify-between font-extrabold">
                                                                            <span class="px-1 rounded bg-black/20">${sess.lessonNumber}</span>
                                                                            <span class="opacity-90">${this.formatTimeDisplay(sess.time)}</span>

            copyModuleScheduleText() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const slots = [...this.sortModuleSlots(course, sec)];
                const lines = slots.map((slotKey, idx) => {
                    const dStr = this.extractDateFromSlotKey(slotKey);
                    const les = this.findLessonForSlot(course, sec.id, slotKey);
                    const sTime = les?.time || sec.startTime || "19:00";
                    const eTime = les?.endTime || sec.endTime || "20:30";
                    return `${idx + 1}. ${this.formatDateDisplay(dStr)} (${this.formatTimeDisplay(sTime)} - ${this.formatTimeDisplay(eTime)})${les?.title ? ` - ${les.title}` : ''}`;
                });
                navigator.clipboard?.writeText(lines.join("\n"));
                this.showToast(this.t("copyTextBtn"), "success");
            }

            excludeStudentToFormer(studentId) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                sec.studentIds = (sec.studentIds || []).filter(id => id !== studentId);
                if (!Array.isArray(course.formerStudentIds)) course.formerStudentIds = [];
                if (!course.formerStudentIds.includes(studentId)) course.formerStudentIds.push(studentId);
                this.persist();
                this.closeModal();
                this.renderAll();
            }

            removeStudentFromModuleCompletely(studentId) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                sec.studentIds = (sec.studentIds || []).filter(id => id !== studentId);
                if (Array.isArray(course.formerStudentIds)) {
                    course.formerStudentIds = course.formerStudentIds.filter(id => id !== studentId);
                }
                this.persist();
                this.closeModal();
                this.renderAll();
            }

            reinsertFormerStudent(studentId) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                if (!sec.studentIds.includes(studentId)) sec.studentIds.push(studentId);
                if (Array.isArray(course.formerStudentIds)) {
                    course.formerStudentIds = course.formerStudentIds.filter(id => id !== studentId);

                this.persist();
                this.renderAll();

            /**
             * Global Calendar View (Day, Week, Month, Year + Course Colors + Conflict Detection)
             */
            renderCalendarView(container) {
                const activeCourses = (this.state.courses || []).filter(c => !c.archived);
                const months = this.t("months");
                const startFirstDayMon = (this.state?.settings?.firstDayOfWeek || "monday") === "monday";
                const dayHeaders = startFirstDayMon ? this.t("daysShortMon") : this.t("daysShortSun");

                const allEventsByDate = {};
                activeCourses.forEach(c => {
                    if (this.calendarFilterCourseId !== "ALL" && c.id !== this.calendarFilterCourseId) return;
                    const pal = this.getCourseColorObj(c.color);
                    (c.levels || []).forEach(lvl => {
                        (lvl.modules || []).forEach(mod => {
                            if (this.calendarFilterModuleId !== "ALL" && mod.id !== this.calendarFilterModuleId) return;
                            (mod.dates || []).forEach((slotKey, sIdx) => {
                                const dStr = this.extractDateFromSlotKey(slotKey);
                                const les = this.findLessonForSlot(c, mod.id, slotKey);
                                const sTime = les?.time || mod.startTime || c.startTime || "19:00";
                                const eTime = les?.endTime || mod.endTime || c.endTime || "20:30";
                                if (!allEventsByDate[dStr]) allEventsByDate[dStr] = [];
                                allEventsByDate[dStr].push({
                                    courseId: c.id,
                                    courseName: c.name,
                                    sectionId: mod.id,
                                    modName: mod.name,
                                    slotKey,
                                    lessonNum: sIdx + 1,
                                    time: sTime,
                                    endTime: eTime,
                                    title: les?.title || "",
                                    pal
                                });
                            });
                        });
                    });
                });

                Object.values(allEventsByDate).forEach(list => {
                    list.sort((a, b) => a.time.localeCompare(b.time));
                    for (let i = 0; i < list.length; i++) {
                        for (let j = i + 1; j < list.length; j++) {
                            if (list[i].endTime > list[j].time && list[i].time < list[j].endTime) {
                                list[i].conflict = true;
                                list[j].conflict = true;
                            }
                        }
                    }
                });

                const year = this.calendarCursor.getFullYear();
                const month = this.calendarCursor.getMonth();
                const firstOfMonth = new Date(year, month, 1);
                const firstDow = firstOfMonth.getDay();
                const offset = startFirstDayMon ? (firstDow === 0 ? -6 : 1 - firstDow) : -firstDow;
                const gridStart = new Date(year, month, 1 + offset);

                const cells = [];
                for (let i = 0; i < 42; i++) {
                    const d = new Date(gridStart);
                    d.setDate(gridStart.getDate() + i);
                    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
                    cells.push({
                        iso,
                        dayNum: d.getDate(),
                        inMonth: d.getMonth() === month,
                        events: allEventsByDate[iso] || []
                    });
                }

                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-3.5 shadow-xs flex flex-wrap items-center justify-between gap-3 text-xs">
                            <div class="flex items-center gap-2">
                                <button onclick="app.navigateCalendar(-1)" class="w-8 h-8 rounded-xl border border-sky-200 dark:border-slate-700 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
                                <button onclick="app.calendarCursor = new Date(); app.renderMainView();" class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 font-bold">${this.t("todayBtn")}</button>
                                <button onclick="app.navigateCalendar(1)" class="w-8 h-8 rounded-xl border border-sky-200 dark:border-slate-700 flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
                                <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white ml-2">${months[month]} ${year}</h3>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <select onchange="app.calendarFilterCourseId = this.value; app.renderMainView();" class="rounded-xl border border-sky-200 dark:border-slate-700 bg-sky-50/50 dark:bg-navy-800 px-3 py-1.5 font-bold">
                                    <option value="ALL">${this.t("allGroupsOpt")}</option>
                                    ${activeCourses.map(c => `<option value="${c.id}" ${this.calendarFilterCourseId === c.id ? 'selected' : ''}>${this.escapeHtml(c.name)}</option>`).join("")}
                                </select>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-4 shadow-xs overflow-x-auto custom-scrollbar">
                            <div class="min-w-[720px] space-y-2">
                                <div class="grid grid-cols-7 gap-2 text-center text-[11px] font-extrabold uppercase text-slate-400">
                                    ${dayHeaders.map(h => `<div>${this.escapeHtml(h)}</div>`).join("")}
                                </div>
                                <div class="grid grid-cols-7 gap-2">
                                    ${cells.map(cell => `
                                        <div class="min-h-[100px] p-2 rounded-xl border ${cell.inMonth ? 'bg-white dark:bg-navy-900 border-sky-100 dark:border-slate-800' : 'bg-slate-50/50 dark:bg-navy-950/40 border-slate-100 dark:border-slate-800/50 opacity-50'} flex flex-col justify-between">
                                            <div class="text-[11px] font-extrabold text-slate-600 dark:text-slate-300">${cell.dayNum}</div>
                                            <div class="space-y-1 mt-1">
                                                ${cell.events.map(ev => `
                                                    <button onclick="app.openLessonPlanModal('${ev.courseId}', '${ev.sectionId}', '${ev.slotKey}')"
                                                        class="w-full text-left p-1.5 rounded-lg text-white text-[10px] font-bold transition hover:opacity-95"
                                                        style="background-color:${ev.pal.hex}">
                                                        <div class="flex items-center justify-between gap-1">
                                                            <span class="truncate">${this.escapeHtml(ev.courseName)}</span>
                                                            ${ev.conflict ? `<i class="fa-solid fa-triangle-exclamation text-amber-200" title="${this.t("timeConflictWarning")}"></i>` : ''}
                                                        </div>
                                                        <div class="text-[9px] opacity-90">${this.formatTimeDisplay(ev.time)}-${this.formatTimeDisplay(ev.endTime)}</div>
                                                    </button>
                                                `).join("")}
                                            </div>
                                        </div>
                                    `).join("")}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            navigateCalendar(delta) {
                this.calendarCursor.setMonth(this.calendarCursor.getMonth() + delta);
                this.renderMainView();

                    lastName: document.getElementById("newStLast")?.value.trim() || "",
                    phone: document.getElementById("newStPhone")?.value.trim() || "",
                    email: document.getElementById("newStEmail")?.value.trim() || "",
                    city: document.getElementById("newStCity")?.value.trim() || "",
                    birthDate: document.getElementById("newStBirth")?.value || "",
                    notes: "",
                    currentLevel: "A1",
                    billingInfo: {
                        idType: "cedula",
                        idNumber: "",
                        fullName: `${firstName} ${document.getElementById("newStLast")?.value.trim() || ""}`.trim(),
                        city: document.getElementById("newStCity")?.value.trim() || "",
                        address: "",
                        phone: document.getElementById("newStPhone")?.value.trim() || "",
                        email: document.getElementById("newStEmail")?.value.trim() || ""
                    }
                };
                this.state.studentsDirectory.push(st);
                document.querySelectorAll("input[name='newStCourseEnroll']:checked").forEach(cb => {
                    const c = (this.state.courses || []).find(x => x.id === cb.value);
                    const mod = this.getActiveSection(c);
                    if (mod && !mod.studentIds.includes(st.id)) {
                        mod.studentIds.push(st.id);
                    }
                });
                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");

                    this.moveToTrash("student", `${st.firstName} ${st.lastName}`, st.city || st.email || "", st);
                    this.state.studentsDirectory = this.state.studentsDirectory.filter(s => s.id !== studentId);
                    (this.state.courses || []).forEach(c => {
                        (c.levels || []).forEach(l => (l.modules || []).forEach(m => {
                            m.studentIds = (m.studentIds || []).filter(id => id !== studentId);
                        }));
                    });
                    this.persist();
                    this.renderAll();

            restoreArchivedCourse(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (!c) return;
                c.archived = false;
                this.state.activeCourseId = c.id;
                this.persist();
                this.renderAll();
            }

            deleteCoursePermanently(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (c) {
                    this.moveToTrash("course", c.name, this.formatLevelModuleBadge(c), c);
                    this.state.courses = (this.state.courses || []).filter(x => x.id !== courseId);
                    if (this.state.activeCourseId === courseId) {
                        const first = this.state.courses.find(x => !x.archived);
                        this.state.activeCourseId = first ? first.id : "";
                    }
                    this.persist();
                    this.closeModal();
                    this.renderAll();

            confirmDeleteOrArchiveCourse(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);

                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">

                            <button onclick="app.deleteCoursePermanently('${c.id}')" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold">${this.t("deleteBtn")}</button>
                        </div>
                    </div>
                `, "max-w-md");
            }

            archiveCourse(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (!c) return;
                c.archived = true;
                if (this.state.activeCourseId === courseId) {
                    const next = (this.state.courses || []).find(x => !x.archived);
                    this.state.activeCourseId = next ? next.id : "";
                }
                this.persist();
                this.closeModal();
                this.renderAll();
            }

            /**
             * Billing ("Fatturazione") View
             * - Supports applying prices, VAT, and discounts to current module only, subsequent modules/levels, or all modules/levels of the group (v0.6.0b)
             */
            renderBillingView(container) {
                const activeCourses = (this.state.courses || []).filter(c => !c.archived);
                const course = activeCourses.find(c => c.id === this.selectedBillingCourseId) || this.getActiveCourse() || activeCourses[0];

                if (!course) {
                    container.innerHTML = `<div class="p-10 text-center text-xs text-slate-400">${this.t("noActiveCoursesTitle")}</div>`;
                    return;
                }

                const activeLevel = this.getActiveLevel(course);
                const activeSection = this.getActiveSection(course);
                if (!activeSection.billing) {
                    activeSection.billing = { hourlyRateNet: 10, lessonDurationHours: 1.5, vatPercent: 15, discountType: "percent", discountTarget: "total", discountValue: 0 };
                }
                const b = activeSection.billing;
                const lessonsCount = (activeSection.dates || []).length;
                const totalHours = Number((lessonsCount * (parseFloat(b.lessonDurationHours) || 1.5)).toFixed(2));
                const subtotalNet = totalHours * (parseFloat(b.hourlyRateNet) || 0);
                const discVal = parseFloat(b.discountValue) || 0;
                const discountAmt = b.discountType === "percent" ? (subtotalNet * (discVal / 100)) : discVal;
                const netAfterDiscount = Math.max(0, subtotalNet - discountAmt);
                const vatAmt = netAfterDiscount * ((parseFloat(b.vatPercent) || 0) / 100);
                const totalGross = netAfterDiscount + vatAmt;
                const fInfo = course.billingConfig?.billingInfo || {};

                container.innerHTML = `
                    <div class="space-y-5 text-xs">
                        <div class="flex flex-wrap items-center gap-2">

                                const pal = this.getCourseColorObj(c.color);

                                        class="px-3.5 py-2 rounded-xl border font-extrabold flex items-center gap-2 transition ${isSel ? 'text-white shadow-xs' : 'bg-white dark:bg-navy-900 border-sky-100 dark:border-slate-800'}"
                                        style="${isSel ? `background-color:${pal.hex}; border-color:${pal.hex}` : ''}">
                                        <span class="w-2.5 h-2.5 rounded-full" style="background-color:${isSel ? '#fff' : pal.hex}"></span>
                                        <span>${this.escapeHtml(c.name)}</span>
                                    </button>
                                `;
                            }).join("")}
                        </div>

                            <!-- Module Pricing & Scope Card -->
                            <form onsubmit="app.saveModuleBillingConfig(event)" class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs flex flex-col justify-between h-full space-y-4">
                                <div class="space-y-4">
                                    <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3 min-h-[52px]">
                                        <div>
                                            <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(course.name)} — ${this.escapeHtml(this.formatLevelModuleBadge(course, activeLevel, activeSection))}</h3>
                                            <p class="text-[11px] text-slate-400">${lessonsCount} ${this.t("lessonsLower")} • ${totalHours} h</p>
                                        </div>
                                        <span class="text-base font-extrabold text-emerald-600">${this.formatMoney(totalGross)}</span>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label class="block font-bold mb-1">Tariffa Oraria (${this.getCurrency()})</label>
                                            <input type="number" step="0.01" id="billHourlyNet" value="${b.hourlyRateNet}" class="w-full h-9 rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 font-bold">
                                        </div>
                                        <div>
                                            <label class="block font-bold mb-1">Durata Lezione (h)</label>

                                        </div>
                                        <div>
                                            <label class="block font-bold mb-1">IVA (%)</label>
                                            <input type="number" step="0.1" id="billVatPct" value="${b.vatPercent}" class="w-full h-9 rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 font-bold">
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label class="block font-bold mb-1">Tipo Sconto</label>
                                            <select id="billDiscType" class="w-full h-9 rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 font-bold">

                                            </select>
                                        </div>
                                        <div>
                                            <label class="block font-bold mb-1">Valore Sconto</label>
                                            <input type="number" step="0.01" id="billDiscVal" value="${b.discountValue}" class="w-full h-9 rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 font-bold">
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block font-bold mb-1">Applica tariffe, IVA e sconti a:</label>

            saveModuleBillingConfig(e) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                const activeLvl = this.getActiveLevel(course);
                const activeMod = this.getActiveSection(course);
                if (!course || !activeLvl || !activeMod) return;

                const newBilling = {
                    hourlyRateNet: parseFloat(document.getElementById("billHourlyNet")?.value) || 0,
                    lessonDurationHours: parseFloat(document.getElementById("billLessonDur")?.value) || 1.5,
                    vatPercent: parseFloat(document.getElementById("billVatPct")?.value) || 0,
                    discountType: document.getElementById("billDiscType")?.value || "percent",
                    discountTarget: "total",
                    discountValue: parseFloat(document.getElementById("billDiscVal")?.value) || 0
                };
                const scope = document.getElementById("billApplyScope")?.value || "current";

                if (scope === "current") {
                    activeMod.billing = { ...newBilling };
                } else if (scope === "all") {
                    (course.levels || []).forEach(l => (l.modules || []).forEach(m => {
                        m.billing = { ...newBilling };
                    }));
                } else if (scope === "subsequent") {
                    let reached = false;
                    (course.levels || []).forEach(l => {
                        (l.modules || []).forEach(m => {
                            if (l.id === activeLvl.id && m.id === activeMod.id) reached = true;
                            if (reached) m.billing = { ...newBilling };
                        });
                    });
                }

                this.persist();
                this.renderMainView();
                this.showToast(this.t("saveBillingBtn"), "success");
            }

                if (e) e.preventDefault();

            async performPreUpdateBackup() {
                const now = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
                const filename = `backup_pre_aggiornamento_${stamp}.json`;
                const jsonStr = JSON.stringify(this.state, null, 2);

                if (window.electronAPI && typeof window.electronAPI.saveAutoBackup === "function") {
                    try {
                        const res = await window.electronAPI.saveAutoBackup(filename, jsonStr);
                        if (res.success) {
                            console.log("Pre-update backup saved to:", res.path);
                        }
                    } catch (e) {
                        console.error("Auto backup error:", e);
                    }
                }
            }

            parseAppVersion(str) {
                const clean = (str || "").trim().replace(/^[vV\s]+/, "");
                const parts = clean.split("-");
                const semverParts = (parts[0] || "").split(".");
                const major = semverParts.length > 0 ? (parseInt(semverParts[0], 10) || 0) : 0;
                const minor = semverParts.length > 1 ? (parseInt(semverParts[1], 10) || 0) : 0;
                const patch = semverParts.length > 2 ? (parseInt(semverParts[2], 10) || 0) : 0;
                let betaNum = null;
                if (parts.length > 1) {
                    const betaStr = String(parts[1]).toLowerCase().replace(/[^0-9]/g, "");
                    betaNum = parseInt(betaStr, 10) || 1;
                }
                return { major, minor, patch, betaNum, isBeta: betaNum !== null, raw: clean };
            }

            compareAppVersions(lhs, rhs) {
                if (lhs.major !== rhs.major) return lhs.major - rhs.major;
                if (lhs.minor !== rhs.minor) return lhs.minor - rhs.minor;
                if (lhs.patch !== rhs.patch) return lhs.patch - rhs.patch;
                // Stable release (isBeta == false) is newer than any beta with same base
                if (!lhs.isBeta && rhs.isBeta) return 1;
                if (lhs.isBeta && !rhs.isBeta) return -1;
                if (lhs.isBeta && rhs.isBeta) return (lhs.betaNum || 0) - (rhs.betaNum || 0);
                return 0;
            }

            async checkForUpdates(manual = false) {
                if (manual) {
                    this.showToast("Controllo aggiornamenti in corso...", "info");
                }
                const nowIso = new Date().toISOString();
                if (this.state.settings) {
                    this.state.settings.lastUpdateCheckDate = nowIso;
                    this.persist();
                }

                try {
                    const res = await fetch("https://api.github.com/repos/Natsvkashii/ClassManager/releases");
                    if (!res.ok) {
                        if (manual) this.showToast("Nessun aggiornamento o rete non disponibile", "info");
                        return;
                    }
                    const releases = await res.json();
                    if (!Array.isArray(releases) || releases.length === 0) {
                        if (manual) this.showToast("L'applicazione è già aggiornata all'ultima versione!", "success");
                        return;
                    }

                    const currentVer = this.parseAppVersion(this.state.version || "2.2.0");
                    let highestCandidate = null;

                    for (const rel of releases) {
                        const parsed = this.parseAppVersion(rel.tag_name || "");
                        if (!highestCandidate || this.compareAppVersions(parsed, highestCandidate.parsed) > 0) {
                            highestCandidate = { release: rel, parsed };
                        }
                    }

                    if (highestCandidate && this.compareAppVersions(highestCandidate.parsed, currentVer) > 0) {
                        // Pre-update automatic backup
                        await this.performPreUpdateBackup();

                        const rel = highestCandidate.release;
                        const assets = rel.assets || [];
                        const setupAsset = assets.find(a => (a.name || "").toLowerCase().includes("setup") && (a.name || "").toLowerCase().endsWith(".exe"));
                        const portableAsset = assets.find(a => (a.name || "").toLowerCase().includes("portable") && (a.name || "").toLowerCase().endsWith(".exe"));
                        const anyExe = setupAsset || portableAsset || assets.find(a => (a.name || "").toLowerCase().endsWith(".exe"));
                        const primaryUrl = setupAsset ? setupAsset.browser_download_url : (anyExe ? anyExe.browser_download_url : (rel.html_url || "https://github.com/Natsvkashii/ClassManager/releases"));
                        const portableUrl = portableAsset ? portableAsset.browser_download_url : null;

                        // Show Startup/Detected Update Modal
                        this.openModal(`
                            <div class="p-6 space-y-4 text-xs max-w-md">
                                <div class="flex items-center gap-2.5 text-sky-600">
                                    <i class="fa-solid fa-cloud-arrow-down text-xl"></i>
                                    <h4 class="text-sm font-extrabold text-slate-900 dark:text-white">${this.t("startupUpdateTitle")}</h4>
                                </div>
                                <p class="text-slate-600 dark:text-slate-300 leading-relaxed">
                                    È disponibile la nuova versione <strong>${this.escapeHtml(rel.tag_name)}</strong> di Gestione Corsi.
                                    È già stato creato un backup di sicurezza dei tuoi dati.
                                </p>
                                <div class="flex flex-wrap items-center justify-end gap-2 pt-2">
                                    <button onclick="app.closeModal()" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("updateLaterBtn")}</button>
                                    ${portableUrl ? `
                                        <button onclick="if(window.electronAPI){window.electronAPI.openExternal('${portableUrl}');}else{window.open('${portableUrl}','_blank');}app.closeModal();" class="px-3.5 py-2 rounded-xl border border-sky-300 dark:border-sky-700 bg-sky-50 dark:bg-navy-800 text-sky-700 dark:text-sky-300 font-bold hover:bg-sky-100 flex items-center gap-1.5">
                                            <i class="fa-solid fa-box-archive"></i> Portable .exe
                                        </button>
                                    ` : ''}
                                    <button onclick="if(window.electronAPI){window.electronAPI.openExternal('${primaryUrl}');}else{window.open('${primaryUrl}','_blank');}app.closeModal();" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold shadow-2xs inline-flex items-center gap-1.5">
                                        <i class="fa-solid fa-download"></i> ${setupAsset ? 'Scarica Setup (.exe)' : this.t("updateNowBtn")}
                                    </button>
                                </div>
                            </div>
                        `, "max-w-md");
                    } else if (manual) {
                        this.showToast("L'applicazione è già aggiornata all'ultima versione!", "success");
                    }
                } catch (e) {
                    console.error("Update check error:", e);
                    if (manual) this.showToast("Impossibile verificare gli aggiornamenti al momento", "info");
                }
            }

                if (freq === "startup") {

            saveLessonPlanModal(e, courseId, sectionId, oldSlotKey = null) {
                if (e) e.preventDefault();
                const course = (this.state.courses || []).find(c => c.id === courseId);
                if (!course) return;
                let sec = null;
                (course.levels || []).forEach(l => {
                    const m = (l.modules || []).find(x => x.id === sectionId);
                    if (m) sec = m;
                });
                if (!sec) return;

                const newDate = document.getElementById("lpDateInput")?.value;
                const time = document.getElementById("lpStartTimeInput")?.value || "19:00";
                const endTime = document.getElementById("lpEndTimeInput")?.value || "20:30";
                if (!newDate) return;

                let finalSlotKey = oldSlotKey;
                if (!finalSlotKey) {
                    finalSlotKey = sec.dates.includes(newDate)
                        ? `${newDate}__${Math.random().toString(36).substr(2, 5)}`
                        : newDate;
                    sec.dates.push(finalSlotKey);
                } else {
                    const oldDateOnly = this.extractDateFromSlotKey(oldSlotKey);
                    if (oldDateOnly !== newDate) {
                        const candidate = sec.dates.includes(newDate)
                            ? `${newDate}__${Math.random().toString(36).substr(2, 5)}`
                            : newDate;
                        const idx = sec.dates.indexOf(oldSlotKey);
                        if (idx >= 0) sec.dates[idx] = candidate;
                        if (sec.attendance) {
                            Object.keys(sec.attendance).forEach(stId => {
                                if (sec.attendance[stId]?.[oldSlotKey] !== undefined) {
                                    sec.attendance[stId][candidate] = sec.attendance[stId][oldSlotKey];
                                    delete sec.attendance[stId][oldSlotKey];
                                }
                            });
                        }
                        finalSlotKey = candidate;
                    }
                }

                if (!Array.isArray(course.lessons)) course.lessons = [];
                let les = oldSlotKey ? this.findLessonForSlot(course, sec.id, oldSlotKey) : null;
                const lessonData = {
                    id: les?.id || ("les-" + Math.random().toString(36).substr(2, 6)),
                    sectionId: sec.id,
                    date: newDate,
                    slotKey: finalSlotKey,
                    time,
                    endTime,
                    title: document.getElementById("lpTitleInput")?.value.trim() || "",
                    objectives: document.getElementById("lpObjectivesInput")?.value.trim() || "",
                    topics: document.getElementById("lpTopicsInput")?.value.trim() || "",
                    methodology: document.getElementById("lpMethodInput")?.value.trim() || "",
                    materials: document.getElementById("lpMaterialsInput")?.value.trim() || "",
                    homework: document.getElementById("lpHomeworkInput")?.value.trim() || "",
                    notes: document.getElementById("lpNotesInput")?.value.trim() || ""
                };

                if (les) {
                    Object.assign(les, lessonData);
                } else {
                    course.lessons.push(lessonData);
                }

                this.sortModuleSlots(course, sec);
                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }

            confirmRemoveDateFromModule(slotKey) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                sec.dates = (sec.dates || []).filter(d => d !== slotKey);
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        if (sec.attendance[stId]) delete sec.attendance[stId][slotKey];
                    });
                }
                if (Array.isArray(course.lessons)) {
                    course.lessons = course.lessons.filter(l => !(l.slotKey === slotKey && (!l.sectionId || l.sectionId === sec.id)));
                }
                this.persist();
                this.closeModal(true);
                this.renderAll();
            }

            openRecurringGeneratorModal() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const today = new Date().toISOString().substring(0, 10);
                const daysMon = this.t("daysShortMon");

                this.openModal(`
                    <form onsubmit="app.executeRecurringGenerator(event)" class="p-6 space-y-4 text-xs">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("recurringBtn")}</h3>
                            <button type="button" onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">Data Inizio *</label>
                                <input type="date" id="recStartDate" required value="${today}" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">Numero di Lezioni *</label>
                                <input type="number" id="recCount" min="1" max="120" required value="12" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">${this.t("startLabel")}</label>
                                <input type="time" id="recStartTime" value="${sec.startTime || '19:00'}" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">${this.t("endLabel")}</label>
                                <input type="time" id="recEndTime" value="${sec.endTime || '20:30'}" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1.5">Giorni della Settimana</label>
                            <div class="flex flex-wrap gap-2">
                                ${[1, 2, 3, 4, 5, 6, 0].map((dow, idx) => `
                                    <label class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 flex items-center gap-1.5 cursor-pointer">
                                        <input type="checkbox" name="recDow" value="${dow}" ${dow === 1 || dow === 3 ? 'checked' : ''} class="accent-sky-600">
                                        <span class="font-bold">${daysMon[idx]}</span>
                                    </label>
                                `).join("")}
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("cancelBtn")}</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-sky-600 text-white font-extrabold">${this.t("confirmBtn")}</button>
                        </div>
                    </form>
                `, "max-w-lg");
            }

            executeRecurringGenerator(e) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                const startStr = document.getElementById("recStartDate")?.value;
                const count = Math.min(200, Math.max(1, parseInt(document.getElementById("recCount")?.value, 10) || 10));
                const sTime = document.getElementById("recStartTime")?.value || "19:00";
                const eTime = document.getElementById("recEndTime")?.value || "20:30";
                const dows = Array.from(document.querySelectorAll("input[name='recDow']:checked")).map(cb => parseInt(cb.value, 10));
                if (!startStr || dows.length === 0) return;

                sec.startTime = sTime;
                sec.endTime = eTime;
                if (!Array.isArray(course.lessons)) course.lessons = [];

                const cur = new Date(startStr + "T12:00:00");
                let added = 0;
                let guard = 0;
                while (added < count && guard < 1000) {
                    guard++;
                    if (dows.includes(cur.getDay())) {
                        const iso = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}-${String(cur.getDate()).padStart(2, "0")}`;
                        const slotKey = sec.dates.includes(iso) ? `${iso}__${Math.random().toString(36).substr(2, 5)}` : iso;
                        sec.dates.push(slotKey);
                        course.lessons.push({
                            id: "les-" + Math.random().toString(36).substr(2, 6),
                            sectionId: sec.id,
                            date: iso,
                            slotKey,
                            time: sTime,
                            endTime: eTime,
                            title: ""
                        });
                        added++;
                    }
                    cur.setDate(cur.getDate() + 1);
                }

                this.sortModuleSlots(course, sec);
                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(`+${added} ${this.t("lessonsLower")}`, "success");
            }

            /**
             * Export & Import Backup JSON Modals
             */
            openExportModal() {
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("exportJsonBtn")}</h3>
                            <button onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <p class="text-slate-500">Salva una copia completa di tutti i corsi, presenze, voti, attività, anagrafica e fatturazione in formato JSON.</p>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("cancelBtn")}</button>
                            <button onclick="app.downloadBackupJson()" class="px-5 py-2 rounded-xl bg-sky-600 text-white font-extrabold"><i class="fa-solid fa-download mr-1.5"></i>${this.t("exportJsonBtn")}</button>
                        </div>
                    </div>
                `, "max-w-md");
            }

            downloadBackupJson() {
                const jsonStr = JSON.stringify(this.state, null, 2);
                const fileName = `gestione_corsi_backup_${new Date().toISOString().substring(0, 10)}.json`;
                if (window.webkit?.messageHandlers?.saveJsonBackup) {
                    window.webkit.messageHandlers.saveJsonBackup.postMessage({ filename: fileName, content: jsonStr });
                    this.closeModal(true);
                    return;
                }
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.closeModal(true);
                this.showToast(this.t("exportJsonBtn"), "success");
            }

            openImportModal() {
                this.openModal(`
                    <form onsubmit="app.handleImportJson(event)" class="p-6 space-y-4 text-xs">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("importBackupBtn")}</h3>
                            <button type="button" onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="file" id="importJsonFileInput" accept=".json,application/json" required class="w-full rounded-xl border border-sky-200 dark:border-slate-700 p-2.5">
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("cancelBtn")}</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-sky-600 text-white font-extrabold">${this.t("importBackupBtn")}</button>
                        </div>
                    </form>
                `, "max-w-md");
            }

            handleImportJson(e) {
                if (e) e.preventDefault();
                const fileInput = document.getElementById("importJsonFileInput");
                const file = fileInput?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (parsed && typeof parsed === "object") {
                            this.state = parsed;
                            this.ensureDataMigration();
                            await this.persist();
                            this.closeModal(true);
                            this.renderAll();
                            this.showToast(this.t("importBackupBtn"), "success");
                        }
                    } catch (err) {
                        this.showToast("File JSON non valido", "error");
                    }
                };
                reader.readAsText(file);
            }

            /**
             * Universal Modal & Unsaved Form Confirmation System (v0.6.0b)
             */
            serializeModalFormState() {
                const modal = document.getElementById("modalContent");
                if (!modal) return "";
                const fields = modal.querySelectorAll("input, textarea, select");
                return Array.from(fields).map(el => {
                    if (el.type === "checkbox" || el.type === "radio") return `${el.name || el.id}:${el.checked}`;
                    return `${el.name || el.id}:${el.value}`;
                }).join("|");
            }

            openModal(htmlContent, maxWidthClass = "max-w-2xl", keepManualDirty = false) {
                const bd = document.getElementById("modalBackdrop");
                const mc = document.getElementById("modalContent");
                if (!bd || !mc) return;
                mc.className = `bg-white dark:bg-navy-900 border border-sky-100 dark:border-slate-800 rounded-2xl shadow-2xl w-full ${maxWidthClass} overflow-hidden my-4 transition-all duration-200 relative`;
                mc.innerHTML = htmlContent;
                bd.classList.remove("hidden");
                bd.classList.add("flex");
                if (!keepManualDirty) {
                    this.modalHasManualChanges = false;
                    requestAnimationFrame(() => {
                        this.modalInitialSnapshot = this.serializeModalFormState();
                    });
                }
            }

            isModalDirty() {
                if (this.modalHasManualChanges) return true;
                const mc = document.getElementById("modalContent");
                if (!mc || !mc.querySelector("form")) return false;
                if (this.modalInitialSnapshot === null) return false;
                return this.serializeModalFormState() !== this.modalInitialSnapshot;
            }

            closeModal(force = false) {
                if (!force && this.isModalDirty()) {
                    const promptBd = document.getElementById("unsavedPromptBackdrop");
                    if (promptBd) {
                        promptBd.classList.remove("hidden");
                        promptBd.classList.add("flex");
                    }
                    return;
                }
                this.forceCloseModalWithoutSaving();
            }

            dismissUnsavedClosePrompt() {
                const promptBd = document.getElementById("unsavedPromptBackdrop");
                if (promptBd) {
                    promptBd.classList.add("hidden");
                    promptBd.classList.remove("flex");
                }
            }

            forceCloseModalWithoutSaving() {
                this.dismissUnsavedClosePrompt();
                const bd = document.getElementById("modalBackdrop");
                const mc = document.getElementById("modalContent");
                if (bd) {
                    bd.classList.add("hidden");
                    bd.classList.remove("flex");
                }
                if (mc) mc.innerHTML = "";
                this.modalInitialSnapshot = null;
                this.modalHasManualChanges = false;
                this.tempRubricDraft = null;
            }

            saveAndCloseCurrentModal() {
                this.dismissUnsavedClosePrompt();
                const mc = document.getElementById("modalContent");
                const form = mc?.querySelector("form");
                if (form) {
                    form.requestSubmit();
                } else {
                    this.forceCloseModalWithoutSaving();
                }
            }

            showToast(message, type = "info") {
                const container = document.getElementById("toastContainer");
                if (!container) return;
                const toast = document.createElement("div");
                let bg = "bg-slate-900 dark:bg-sky-600 text-white";
                if (type === "success") bg = "bg-emerald-600 text-white";
                else if (type === "error") bg = "bg-rose-600 text-white";
                toast.className = `${bg} px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold flex items-center justify-between gap-2 pointer-events-auto transition-all duration-200`;
                toast.innerHTML = `<span>${this.escapeHtml(message)}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add("opacity-0", "translate-y-2");
                    setTimeout(() => toast.remove(), 220);
                }, 2600);
            }
        }

        const app = new ClassRegisterApp();
        window.app = app;
        
        // Global Keyboard Shortcut: Ctrl+Z / Cmd+Z for Undo
        window.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z") && !e.shiftKey) {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
                if (activeTag === "input" || activeTag === "textarea") return;
                e.preventDefault();
                if (window.app && typeof window.app.performUndo === "function") {
                    window.app.performUndo();
                }
            }
        });
        window.addEventListener("DOMContentLoaded", () => app.init());
    </script>
</body>
</html>
