                                                                    <i class="fa-solid fa-calendar-day"></i>
                                                                </button>
                                                                <button onclick="app.confirmRemoveDateFromModule('${slotKey}')" class="w-6 h-6 rounded-md bg-rose-100 dark:bg-rose-950/70 text-rose-600 dark:text-rose-300 hover:bg-rose-200 flex items-center justify-center text-[10px]" title="${this.t("deleteBtn")}">
                                                                    <i class="fa-solid fa-trash-can"></i>
                                                                </button>
                                                            </div>
                                                        ` : ''}
                                                    </th>
                                                `;
                                            }).join("")}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-sky-100/60 dark:divide-slate-800">
                                        ${modStudents.length === 0 ? `
                                            <tr>
                                                <td colspan="${Math.max(2, dates.length + 1)}" class="px-6 py-10 text-center text-slate-400">
                                                    ${this.t("noStudentsInModulePrompt")} <strong>"${this.t("addStudentToModBtn")}"</strong> ${this.t("toEnrollThem")}
                                                </td>
                                            </tr>
                                        ` : modStudents.map(st => {
                                            const stAtt = activeSection.attendance?.[st.id] || {};
                                            return `
                                                <tr class="hover:bg-sky-50/40 dark:hover:bg-navy-800/50 transition">
                                                    <td class="sticky-col bg-white dark:bg-navy-900 px-4 py-3 font-bold text-slate-900 dark:text-white border-r border-sky-100 dark:border-slate-800">
                                                        <button onclick="app.openStudentDetailModal('${st.id}')" class="hover:text-sky-600 dark:hover:text-sky-400 text-left truncate block w-full">
                                                            ${this.escapeHtml(st.name)}
                                                        </button>
                                                    </td>
                                                    ${dates.map(dStr => {
                                                        const val = stAtt[dStr] || "";
                                                        let btnClass = "bg-slate-100 dark:bg-navy-800 text-slate-400";
                                                        if (val === "P") btnClass = "bg-emerald-500 text-white font-extrabold shadow-2xs";
                                                        else if (val === "A") btnClass = "bg-rose-500 text-white font-extrabold shadow-2xs";
                                                        else if (val === "G") btnClass = "bg-amber-500 text-white font-extrabold shadow-2xs";
                                                        return `
                                                            <td class="px-2 py-2 text-center border-r border-sky-100/50 dark:border-slate-800/70">
                                                                <button onclick="app.cycleAttendance('${st.id}', '${dStr}')" class="w-9 h-8 rounded-lg text-xs transition ${btnClass}">
                                                                    ${val || "·"}
                                                                </button>
                                                            </td>
                                                        `;
                                                    }).join("")}
                                                </tr>
                                            `;
                                        }).join("")}
                                    </tbody>
                                </table>
                            </div>
                            <div class="px-4 py-2.5 bg-sky-50/50 dark:bg-navy-800/50 border-t border-sky-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400">
                                <div class="flex items-center gap-4">
                                    <span><strong class="text-emerald-600">P</strong> = ${this.t("presentLabel")}</span>
                                    <span><strong class="text-rose-600">A</strong> = ${this.t("absentLabel")}</span>
                                    <span><strong class="text-amber-600">G</strong> = ${this.t("justifiedLabel")}</span>
                                </div>
                                <span>${this.t("attendanceFooterHint")}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            toggleAttendanceDateEditMode() {
                this.attendanceDateEditMode = !this.attendanceDateEditMode;
                if (!this.attendanceDateEditMode) {
                    this.selectedDatesForDelete.clear();
                }
                this.renderMainView();
            }

            toggleDateSelectionForDelete(dateStr, isChecked) {
                if (isChecked) this.selectedDatesForDelete.add(dateStr);
                else this.selectedDatesForDelete.delete(dateStr);
                this.renderMainView();
            }

            toggleSelectAllModuleDates(isChecked) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!sec) return;
                if (isChecked) {
                    (sec.dates || []).forEach(d => this.selectedDatesForDelete.add(d));
                } else {
                    this.selectedDatesForDelete.clear();
                }
                this.renderMainView();
            }

            confirmBatchDeleteDates() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const toDelete = Array.from(this.selectedDatesForDelete).filter(d => (sec.dates || []).includes(d)).sort();
                if (toDelete.length === 0) return;

                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <h3 class="text-base font-bold text-rose-600">${this.t("confirmDeleteTitle")} (${toDelete.length} ${this.t("lessonsLower")})</h3>
                        <div class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2.5 rounded-xl bg-rose-50/60 dark:bg-rose-950/30 border border-rose-200/70 dark:border-rose-900/50">
                            ${toDelete.map(d => `<span class="px-2 py-1 rounded-lg bg-white dark:bg-navy-800 font-bold text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800">${this.formatDateDisplay(this.extractDateFromSlotKey(d))}</span>`).join("")}
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700">${this.t("cancelBtn")}</button>
                            <button onclick="app.executeBatchDeleteDates()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">${this.t("deleteBtn")} (${toDelete.length})</button>
                        </div>
                    </div>
                `);
            }

            executeBatchDeleteDates() {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const toDeleteSet = new Set(this.selectedDatesForDelete);
                const removedCount = (sec.dates || []).filter(d => toDeleteSet.has(d)).length;

                sec.dates = (sec.dates || []).filter(d => !toDeleteSet.has(d));
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        toDeleteSet.forEach(d => {
                            if (sec.attendance[stId]) delete sec.attendance[stId][d];
                        });
                    });
                }
                if (Array.isArray(course.lessons)) {
                    course.lessons = course.lessons.filter(l => {
                        if (l.sectionId && l.sectionId !== sec.id) return true;
                        if (l.slotKey && toDeleteSet.has(l.slotKey)) return false;
                        if (!l.slotKey && toDeleteSet.has(l.date)) return false;
                        return true;
                    });
                }
                this.selectedDatesForDelete.clear();
                this.persist();
                this.closeModal();
                this.renderAll();
                this.showToast(`${removedCount} ${this.t("lessonsLower")}`, "info");
            }

            openEditSingleDateModal(oldSlotKey) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                const dOnly = this.extractDateFromSlotKey(oldSlotKey);
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white">${this.t("editBtn")} (${this.formatDateDisplay(dOnly)})</h3>
                        <form onsubmit="app.confirmEditSingleDate(event, '${oldSlotKey}')" class="space-y-3">
                            <div>
                                <input type="date" id="editedSingleDateInput" required value="${dOnly}" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700">${this.t("cancelBtn")}</button>
                                <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-bold">${this.t("saveBtn")}</button>
                            </div>
                        </form>
                    </div>
                `);
            }

            confirmEditSingleDate(e, oldSlotKey) {
                e.preventDefault();
                const newDateStr = document.getElementById("editedSingleDateInput").value;
                const oldDateOnly = this.extractDateFromSlotKey(oldSlotKey);
                if (!newDateStr || newDateStr === oldDateOnly) {
                    this.closeModal(true);
                    return;
                }
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;

                let newSlotKey = newDateStr;
                if (sec.dates.includes(newSlotKey)) {
                    newSlotKey = `${newDateStr}__${Math.random().toString(36).substr(2, 5)}`;
                }

                const idx = sec.dates.indexOf(oldSlotKey);
                if (idx >= 0) {
                    sec.dates[idx] = newSlotKey;
                }
                if (sec.attendance) {
                    Object.keys(sec.attendance).forEach(stId => {
                        if (sec.attendance[stId] && sec.attendance[stId][oldSlotKey] !== undefined) {
                            sec.attendance[stId][newSlotKey] = sec.attendance[stId][oldSlotKey];
                            delete sec.attendance[stId][oldSlotKey];
                        }
                    });
                }
                const les = this.findLessonForSlot(course, sec.id, oldSlotKey);
                if (les) {
                    les.date = newDateStr;
                    les.slotKey = newSlotKey;
                }
                this.sortModuleSlots(course, sec);
                this.persist();
                this.closeModal(true);
                this.renderAll();
            }

            cycleAttendance(studentId, dateStr) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                if (!sec.attendance[studentId]) sec.attendance[studentId] = {};
                const order = ["", "P", "A", "G"];
                const curr = sec.attendance[studentId][dateStr] || "";
                const next = order[(order.indexOf(curr) + 1) % order.length];
                if (next === "") delete sec.attendance[studentId][dateStr];
                else sec.attendance[studentId][dateStr] = next;
                this.persist();
                this.renderMainView();
            }

            getStudentAttendanceEvaluationInfo(course, studentId, moduleObj = null) {
                if (!course) return { score: 0, recordedCount: 0, totalLessons: 0, isComplete: false };
                const mod = moduleObj || this.getActiveSection(course);
                const dates = Array.isArray(mod?.dates) ? mod.dates : [];
                const totalLessons = dates.length;
                if (totalLessons === 0) {
                    return { score: 0, recordedCount: 0, totalLessons: 0, isComplete: false };
                }
                const stAtt = (mod.attendance && mod.attendance[studentId]) || {};
                let recordedCount = 0;
                let creditCount = 0;
                dates.forEach(dStr => {
                    const status = stAtt[dStr];
                    if (status === "P" || status === "G" || status === "A") {
                        recordedCount++;
                        if (status === "P" || status === "G") {
                            creditCount++;
                        }
                    }
                });
                const score = Number(((creditCount / totalLessons) * 10).toFixed(2));
                const isComplete = totalLessons > 0 && recordedCount === totalLessons;
                return { score, recordedCount, totalLessons, isComplete };
            }

            calculateStudentAttendanceScore(course, studentId, moduleObj = null) {
                const info = this.getStudentAttendanceEvaluationInfo(course, studentId, moduleObj);
                return info.isComplete ? info.score : null;
            }

            isAttendanceEvaluationEnabled(course, moduleObj = null) {
                if (!course) return false;
                const mod = moduleObj || this.getActiveSection(course);
                if (mod && mod.evaluateAttendance !== undefined) {
                    return !!mod.evaluateAttendance;
                }
                return !!course.gradeConfig?.evaluateAttendance;
            }

            getAttendanceWeight(course, moduleObj = null) {
                if (!course) return 5;
                const mod = moduleObj || this.getActiveSection(course);
                if (mod && mod.attendanceWeight !== undefined) {
                    return Math.max(0, parseFloat(mod.attendanceWeight) || 0);
                }
                return Math.max(0, parseFloat(course.gradeConfig?.attendanceWeight) ?? 5);
            }

            /**
             * Checks whether ALL required evaluations for a student are present:
             * - Every activity in the course must have a numeric grade recorded for the student
             * - If attendance evaluation is enabled, all module lessons must be recorded for the student
             * - At least one evaluation element (activity or attendance) must exist
             */
            areAllStudentGradesPresent(course, studentId, moduleObj = null) {
                if (!course || !course.gradeConfig) return false;
                const cfg = course.gradeConfig;
                const acts = cfg.activities || [];
                const evalAtt = this.isAttendanceEvaluationEnabled(course, moduleObj);
                const stGrades = (course.grades && course.grades[studentId]) ? course.grades[studentId] : {};

                if (acts.length === 0 && !evalAtt) return false;

                for (const a of acts) {
                    const raw = stGrades[a.id];
                    if (raw === undefined || raw === "" || raw === null || isNaN(parseFloat(raw))) {
                        return false;
                    }
                }

                if (evalAtt) {
                    const attInfo = this.getStudentAttendanceEvaluationInfo(course, studentId, moduleObj);
                    if (!attInfo.isComplete) return false;
                }

                return true;
            }

            toggleCourseAttendanceEvaluation(isChecked) {
                const course = this.getActiveCourse();
                const mod = this.getActiveSection(course);
                if (!course) return;
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.evaluateAttendance = !!isChecked;
                if (course.gradeConfig.attendanceWeight === undefined) course.gradeConfig.attendanceWeight = 5;
                if (mod) {
                    mod.evaluateAttendance = !!isChecked;
                    if (mod.attendanceWeight === undefined) mod.attendanceWeight = course.gradeConfig.attendanceWeight || 5;
                }
                this.persist();
                this.renderMainView();
            }

            updateCourseAttendanceWeight(val) {
                const course = this.getActiveCourse();
                const mod = this.getActiveSection(course);
                if (!course) return;
                const num = Math.min(100, Math.max(0, parseFloat(val) || 0));
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.attendanceWeight = num;
                if (mod) mod.attendanceWeight = num;
                this.persist();
                this.renderMainView();
            }

            /**
             * Dedicated "Voti" View:
             * - Presenze header shows no icon and only the percentage below (no "Peso:" or "(Auto)")
             * - Media header and student average badge do not display "/ 10"
             * - Student outcome (Promosso / Recupero) is shown ONLY when all grades are present
             */
            renderGradesView(container) {
                const course = this.getActiveCourse();
                if (!course) {
                    this.renderHomeView(container);
                    return;
                }
                const activeSection = this.getActiveSection(course);
                const modStudents = this.getModuleStudents(course, activeSection);
                if (!course.gradeConfig) {
                    course.gradeConfig = { calcMethod: "average", minPass: 6, evaluateAttendance: false, attendanceWeight: 5, activities: [] };
                }
                const cfg = course.gradeConfig;
                const activities = cfg.activities || [];
                const rubrics = this.state.rubrics || [];
                const evalAtt = this.isAttendanceEvaluationEnabled(course, activeSection);
                const attWeight = this.getAttendanceWeight(course, activeSection);

                container.innerHTML = `
                    <div class="space-y-5">
                        <!-- Grades Toolbar -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-3.5 shadow-xs flex flex-wrap items-center justify-end gap-2 text-xs">
                            <select onchange="app.updateGradeConfigMethod(this.value)" class="rounded-xl border border-sky-200 dark:border-slate-700 bg-sky-50/50 dark:bg-navy-800 px-3 py-1.5 font-bold">
                                <option value="average" ${cfg.calcMethod === 'average' ? 'selected' : ''}>${this.t("calcMethodAverage")}</option>
                                <option value="weighted" ${cfg.calcMethod === 'weighted' ? 'selected' : ''}>${this.t("calcMethodWeighted")}</option>
                            </select>
                            <div class="flex items-center gap-1.5 bg-sky-50/60 dark:bg-navy-800 px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700">
                                <span class="font-semibold">Min:</span>
                                <input type="text" inputmode="decimal" value="${cfg.minPass ?? 6}" onchange="app.updateGradeMinPass(this.value)" class="w-12 bg-transparent font-extrabold text-center focus:outline-none">
                            </div>
                            <!-- Attendance Evaluation Quick Control (Base 5%) -->
                            <div class="flex items-center gap-2 bg-emerald-50/70 dark:bg-emerald-950/30 px-3 py-1.5 rounded-xl border border-emerald-200 dark:border-emerald-800/70">
                                <label class="flex items-center gap-1.5 font-bold text-emerald-800 dark:text-emerald-300 cursor-pointer">
                                    <input type="checkbox" onchange="app.toggleCourseAttendanceEvaluation(this.checked)" ${evalAtt ? 'checked' : ''} class="w-3.5 h-3.5 accent-emerald-600 rounded">
                                    <span>${this.t("evalAttendanceLabel")}</span>
                                </label>
                                ${evalAtt ? `
                                    <div class="flex items-center gap-1 pl-1 border-l border-emerald-300 dark:border-emerald-700">
                                        <input type="text" inputmode="decimal" value="${attWeight}" onchange="app.updateCourseAttendanceWeight(this.value)" class="w-11 text-center font-extrabold bg-white dark:bg-navy-900 rounded border border-emerald-300 dark:border-emerald-700 py-0.5">
                                        <span class="font-bold text-emerald-700 dark:text-emerald-300">%</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Grades Table -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 shadow-xs overflow-hidden">
                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-sky-50/80 dark:bg-navy-800 border-b border-sky-100 dark:border-slate-800">
                                            <th class="sticky-col bg-sky-50 dark:bg-navy-800 px-4 py-3 font-extrabold min-w-[270px] border-r border-sky-100 dark:border-slate-800">
                                                <div class="flex items-center justify-between gap-2">
                                                    <span>${this.t("statusCol")} & ${this.t("studentCol")}</span>
                                                    <span class="text-[10px] uppercase tracking-wider text-sky-700 dark:text-sky-400">${this.t("finalAvgCol")}</span>
                                                </div>
                                            </th>
                                            ${evalAtt ? `
                                                <th class="px-3 py-3 text-center font-extrabold min-w-[120px] bg-emerald-50/50 dark:bg-emerald-950/20 border-r border-sky-100/60 dark:border-slate-800">
                                                    <div class="text-emerald-700 dark:text-emerald-300 flex items-center justify-center">
                                                        <span>${this.t("navAttendance")}</span>
                                                    </div>
                                                    <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold block mt-0.5">${attWeight}%</span>
                                                </th>
                                            ` : ''}
                                            ${activities.map(act => {
                                                const rubricEnabled = !!(act.useRubric && act.rubricId && rubrics.some(r => r.id === act.rubricId));
                                                return `
                                                    <th class="px-3 py-3 text-center font-bold min-w-[150px] border-r border-sky-100/60 dark:border-slate-800">
                                                        <button onclick="app.openActivityModal('${act.id}')" class="hover:text-sky-600 underline decoration-dotted">${this.escapeHtml(act.name)}</button>
                                                        <div class="flex items-center justify-center gap-1.5 mt-0.5">
                                                            ${cfg.calcMethod === 'weighted' ? `<span class="text-[10px] text-sky-600">${act.weight || 0}%</span>` : ''}
                                                            ${rubricEnabled ? `<span class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-extrabold"><i class="fa-solid fa-table-cells-large mr-0.5"></i>${this.t("rubricBadgeShort")}</span>` : ''}
                                                        </div>
                                                    </th>
                                                `;
                                            }).join("")}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-sky-100/60 dark:divide-slate-800">
                                        ${modStudents.length === 0 ? `
                                            <tr>
                                                <td colspan="${Math.max(2, activities.length + (evalAtt ? 2 : 1))}" class="px-6 py-10 text-center text-slate-400">
                                                    ${this.t("noEnrolledInModMsg")}
                                                </td>
                                            </tr>
                                        ` : modStudents.map(st => {
                                            const stGrades = (course.grades && course.grades[st.id]) ? course.grades[st.id] : {};
                                            const avg = this.calculateStudentCourseAverage(course, st.id, activeSection);
                                            const allEvaluated = this.areAllStudentGradesPresent(course, st.id, activeSection);
                                            const passed = allEvaluated && avg !== null && avg >= (cfg.minPass || 6);
                                            const attInfo = evalAtt ? this.getStudentAttendanceEvaluationInfo(course, st.id, activeSection) : null;

                                            let statusIconHtml = `<span class="w-6 h-6 rounded-full bg-slate-100 dark:bg-navy-800 text-slate-400 inline-flex items-center justify-center shrink-0" title="${this.t("pendingBadge")} (${this.t("pendingEvalSub")})"><i class="fa-solid fa-minus text-[10px]"></i></span>`;
                                            if (allEvaluated && avg !== null) {
                                                if (passed) {
                                                    statusIconHtml = `<span class="w-6 h-6 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 inline-flex items-center justify-center shrink-0 shadow-2xs" title="${this.t("passedBadge")} (≥ ${cfg.minPass || 6})"><i class="fa-solid fa-circle-check text-xs"></i></span>`;
                                                } else {
                                                    statusIconHtml = `<span class="w-6 h-6 rounded-full bg-rose-100 dark:bg-rose-950/80 text-rose-600 dark:text-rose-400 inline-flex items-center justify-center shrink-0 shadow-2xs" title="${this.t("recoverBadge")} (< ${cfg.minPass || 6})"><i class="fa-solid fa-triangle-exclamation text-xs"></i></span>`;
                                                }
                                            }

                                            let avgBadgeClass = "bg-slate-100 dark:bg-navy-800 text-slate-400";
                                            if (avg !== null) {
                                                if (!allEvaluated) {
                                                    avgBadgeClass = "bg-slate-100 dark:bg-navy-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700";
                                                } else if (passed) {
                                                    avgBadgeClass = "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800";
                                                } else {
                                                    avgBadgeClass = "bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800";
                                                }
                                            }

                                            return `
                                                <tr class="hover:bg-sky-50/40 dark:hover:bg-navy-800/50">
                                                    <td class="sticky-col bg-white dark:bg-navy-900 px-4 py-3 font-bold border-r border-sky-100 dark:border-slate-800">
                                                        <div class="flex items-center justify-between gap-2">
                                                            <div class="flex items-center gap-2.5 min-w-0">
                                                                ${statusIconHtml}
                                                                <button onclick="app.openStudentDetailModal('${st.id}')" class="hover:text-sky-600 truncate text-left">${this.escapeHtml(st.name)}</button>
                                                            </div>
                                                            <span class="px-2.5 py-1 rounded-lg font-extrabold text-xs shrink-0 ${avgBadgeClass}" title="${this.t("finalAvgCol")}">
                                                                ${avg !== null ? `${avg.toFixed(2)}` : "—"}
                                                            </span>
                                                        </div>
                                                    </td>
                                                    ${evalAtt ? `
                                                        <td class="px-3 py-2 text-center border-r border-sky-100/50 dark:border-slate-800/70 ${attInfo?.isComplete ? 'bg-emerald-50/20 dark:bg-emerald-950/10' : 'bg-slate-50/40 dark:bg-navy-950/20'}">
                                                            ${attInfo && attInfo.totalLessons > 0 ? (
                                                                attInfo.isComplete ? `
                                                                    <span class="px-2.5 py-1 rounded-xl bg-emerald-100/90 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 font-extrabold inline-flex items-center gap-1 shadow-2xs" title="${this.t("attendanceCompletedHint")}">
                                                                        <i class="fa-solid fa-check text-[10px]"></i>
                                                                        ${attInfo.score.toFixed(2)}
                                                                    </span>
                                                                ` : `

                                </table>
                            </div>

                            <!-- Bottom Outcome & Evaluation Legend -->
                            <div class="px-4 py-3 bg-sky-50/50 dark:bg-navy-800/50 border-t border-sky-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-[11px] text-slate-600 dark:text-slate-300">
                                <div class="flex flex-wrap items-center gap-4">
                                    <span class="font-extrabold uppercase tracking-wider text-[10px] text-slate-400">${this.t("outcomeLegendTitle")}</span>
                                    <span class="inline-flex items-center gap-1.5">
                                        <span class="w-5 h-5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 inline-flex items-center justify-center"><i class="fa-solid fa-circle-check text-[10px]"></i></span>
                                        <strong>${this.t("passedBadge")}</strong> (≥ ${cfg.minPass ?? 6})
                                    </span>
                                    <span class="inline-flex items-center gap-1.5">
                                        <span class="w-5 h-5 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 inline-flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></span>
                                        <strong>${this.t("recoverBadge")}</strong> (&lt; ${cfg.minPass ?? 6})
                                    </span>
                                    <span class="inline-flex items-center gap-1.5">
                                        <span class="w-5 h-5 rounded-full bg-slate-100 dark:bg-navy-800 text-slate-400 inline-flex items-center justify-center"><i class="fa-solid fa-minus text-[9px]"></i></span>
                                        <strong>${this.t("pendingBadge")}</strong> (${this.t("pendingEvalSub")})
                                    </span>
                                </div>
                                <div class="text-slate-500">
                                    <i class="fa-solid fa-table-cells-large text-emerald-600 mr-1"></i>${this.t("rubricIconLegendHint")}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            /**
             * Dedicated "Attività" View (Removed "Valutazione libera (senza griglia)" and its alternatives)
             */
            renderActivitiesView(container) {
                const course = this.getActiveCourse();
                if (!course) {
                    this.renderHomeView(container);
                    return;
                }
                if (!course.gradeConfig) {
                    course.gradeConfig = { calcMethod: "average", minPass: 6, evaluateAttendance: false, attendanceWeight: 5, activities: [] };
                }
                const cfg = course.gradeConfig;
                const activities = cfg.activities || [];
                const rubrics = this.state.rubrics || [];

                container.innerHTML = `
                    <div class="space-y-5">
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs space-y-4">
                            <div class="flex flex-wrap items-center justify-end gap-2 text-xs">
                                <button onclick="app.openRubricsManagerModal()" class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 hover:bg-sky-50 dark:hover:bg-navy-800 font-bold flex items-center gap-1.5 text-sky-700 dark:text-sky-300">
                                    <i class="fa-solid fa-table-cells-large"></i> ${this.t("rubricsLabel")}
                                </button>
                                <button onclick="app.openActivityModal()" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center gap-1.5 shadow-2xs">
                                    <i class="fa-solid fa-plus"></i> ${this.t("newActivityBtn")}
                                </button>
                            </div>

                            ${activities.length === 0 ? `
                                <div class="p-10 rounded-2xl border border-dashed border-sky-200 dark:border-slate-700 text-center space-y-3 bg-sky-50/30 dark:bg-navy-950/40">
                                    <p class="text-xs font-bold text-slate-600 dark:text-slate-300">${this.t("noActivitiesPrompt")}</p>
                                </div>
                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 pt-2">
                                    ${activities.map(act => {
                                        const linkedRubric = act.useRubric ? rubrics.find(r => r.id === act.rubricId) : null;
                                        return `
                                            <div onclick="app.openActivityModal('${act.id}')" class="cursor-pointer p-4 rounded-xl border border-sky-100 dark:border-slate-800 hover:border-sky-400 dark:hover:border-sky-500 bg-sky-50/40 dark:bg-navy-800/60 flex flex-col justify-between gap-3 text-xs transition group">
                                                <div class="space-y-1.5">
                                                    <div class="flex items-start justify-between gap-2">
                                                        <h4 class="font-extrabold text-slate-900 dark:text-white group-hover:text-sky-600 dark:group-hover:text-sky-400 transition">${this.escapeHtml(act.name)}</h4>
                                                        <div class="flex items-center gap-1 shrink-0">
                                                            ${linkedRubric ? `<span class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold" title="${this.escapeHtml(linkedRubric.name)}"><i class="fa-solid fa-table-cells mr-1"></i>${this.t("rubricBadgeShort")}</span>` : ''}
                                                            ${cfg.calcMethod === 'weighted' ? `<span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 text-[10px] font-bold">${act.weight || 0}%</span>` : ''}
                                                        </div>
                                                    </div>
                                                    ${(act.startDate || act.endDate) ? `
                                                        <div class="text-[11px] font-semibold text-sky-700 dark:text-sky-400 flex flex-wrap items-center gap-2">
                                                            ${act.startDate ? `<span><i class="fa-regular fa-calendar mr-1"></i>${this.formatDateDisplay(act.startDate)}</span>` : ''}
                                                            ${act.endDate && act.endDate !== act.startDate ? `<span>→ ${this.formatDateDisplay(act.endDate)}</span>` : ''}
                                                        </div>
                                                    ` : ''}
                                                    ${act.objectives ? `<p class="text-[11px] text-slate-600 dark:text-slate-300 line-clamp-2">${this.escapeHtml(act.objectives)}</p>` : ''}
                                                </div>
                                                <div class="flex items-center justify-between gap-2 pt-2 border-t border-sky-100/70 dark:border-slate-700/60" onclick="event.stopPropagation()">
                                                    <span class="text-[10px] text-slate-400">${act.createdAt ? this.formatCreatedAtDisplay(act.createdAt) : ''}</span>
                                                    <div class="flex items-center gap-2">
                                                        <button onclick="app.deleteActivity('${act.id}')" class="text-rose-500 hover:underline text-[11px] font-semibold">${this.t("deleteBtn")}</button>
                                                    </div>
                                                </div>
                                            </div>
                                        `;
                                    }).join("")}
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            openRubricsManagerModal() {
                const rubrics = this.state.rubrics || [];
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs max-h-[88vh] overflow-y-auto custom-scrollbar">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <div>
                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("rubricsLabel")}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="app.openRubricEditorModal()" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> ${this.t("newRubricBtn")}
                                </button>
                                <button onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>

                        ${rubrics.length === 0 ? `
                            <p class="text-slate-400 text-center py-8">—</p>
                        ` : `
                            <div class="space-y-3">
                                ${rubrics.map(rub => {
                                    const maxPts = this.calculateRubricMaxPoints(rub);
                                    return `
                                        <div class="p-4 rounded-2xl border border-sky-100 dark:border-slate-800 bg-sky-50/40 dark:bg-navy-800/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <h4 class="font-extrabold text-sm text-slate-900 dark:text-white">${this.escapeHtml(rub.name)}</h4>
                                                    <span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 text-[10px] font-extrabold">${(rub.criteria || []).length} • Max ${maxPts} pt</span>
                                                </div>
                                                ${rub.description ? `<p class="text-slate-500">${this.escapeHtml(rub.description)}</p>` : ''}
                                            </div>
                                            <div class="flex items-center gap-2 shrink-0">
                                                <button onclick="app.openRubricEditorModal('${rub.id}')" class="px-3 py-1.5 rounded-xl bg-white dark:bg-navy-900 border border-sky-200 dark:border-slate-700 font-bold text-sky-700 dark:text-sky-300 hover:bg-sky-50">
                                                    <i class="fa-solid fa-pen mr-1"></i>${this.t("editBtn")}
                                                </button>
                                                <button onclick="app.deleteRubric('${rub.id}')" class="px-3 py-1.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 font-bold">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `;
                                }).join("")}
                            </div>
                        `}
                    </div>
                `, "max-w-3xl");
            }

            calculateRubricMaxPoints(rubric) {
                if (!rubric || !Array.isArray(rubric.criteria)) return 0;
                return rubric.criteria.reduce((sum, crit) => {
                    const maxLvl = (crit.levels || []).reduce((m, l) => Math.max(m, parseFloat(l.points) || 0), 0);
                    return sum + maxLvl;
                }, 0);
            }

            openRubricEditorModal(rubricId = null) {
                const existing = rubricId ? (this.state.rubrics || []).find(r => r.id === rubricId) : null;
                if (existing) {
                    this.tempRubricDraft = JSON.parse(JSON.stringify(existing));
                } else {
                    this.tempRubricDraft = {
                        id: "rub-" + Math.random().toString(36).substr(2, 6),
                        name: "",
                        description: "",
                        criteria: [
                            {
                                id: "crit-" + Math.random().toString(36).substr(2, 5),
                                name: "Valutazione Generale della Prova",
                                levels: [
                                    { id: "lvl-1", label: "Insufficiente", points: 4, desc: "Obiettivi raggiunti in modo parziale." },
                                    { id: "lvl-2", label: "Sufficiente", points: 6, desc: "Obiettivi di base raggiunti." },
                                    { id: "lvl-3", label: "Buono", points: 8, desc: "Prova svolta con sicurezza e correttezza." },
                                    { id: "lvl-4", label: "Eccellente", points: 10, desc: "Padronanza completa ed efficace." }
                                ]
                            }
                        ]
                    };
                }
                this.renderRubricEditorModalContent(!!existing);
            }

            syncRubricDraftFromInputs() {
                if (!this.tempRubricDraft) return;
                const nameEl = document.getElementById("rubEditName");
                const descEl = document.getElementById("rubEditDesc");
                if (nameEl) this.tempRubricDraft.name = nameEl.value;
                if (descEl) this.tempRubricDraft.description = descEl.value;

                (this.tempRubricDraft.criteria || []).forEach((crit, cIdx) => {
                    const cNameEl = document.getElementById(`rubCritName_${cIdx}`);
                    if (cNameEl) crit.name = cNameEl.value;
                    (crit.levels || []).forEach((lvl, lIdx) => {
                        const lLab = document.getElementById(`rubLvlLabel_${cIdx}_${lIdx}`);
                        const lPts = document.getElementById(`rubLvlPts_${cIdx}_${lIdx}`);
                        const lDesc = document.getElementById(`rubLvlDesc_${cIdx}_${lIdx}`);
                        if (lLab) lvl.label = lLab.value;
                        if (lPts) lvl.points = parseFloat(lPts.value) || 0;
                        if (lDesc) lvl.desc = lDesc.value;
                    });
                });
            }

            addRubricCriterion() {
                this.syncRubricDraftFromInputs();
                if (!this.tempRubricDraft) return;
                this.modalHasManualChanges = true;
                const nextNum = (this.tempRubricDraft.criteria?.length || 0) + 1;
                this.tempRubricDraft.criteria.push({
                    id: "crit-" + Math.random().toString(36).substr(2, 5),
                    name: `Criterio ${nextNum}`,
                    levels: [
                        { id: "l1-" + Math.random().toString(36).substr(2, 4), label: "Base", points: 1, desc: "" },
                        { id: "l2-" + Math.random().toString(36).substr(2, 4), label: "Intermedio", points: 2, desc: "" },
                        { id: "l3-" + Math.random().toString(36).substr(2, 4), label: "Avanzato", points: 2.5, desc: "" }
                    ]
                });
                this.renderRubricEditorModalContent(true);
            }

            removeRubricCriterion(cIdx) {
                this.syncRubricDraftFromInputs();
                if (!this.tempRubricDraft || this.tempRubricDraft.criteria.length <= 1) return;
                this.modalHasManualChanges = true;
                this.tempRubricDraft.criteria.splice(cIdx, 1);
                this.renderRubricEditorModalContent(true);
            }

            addRubricLevelToCriterion(cIdx) {
                this.syncRubricDraftFromInputs();
                const crit = this.tempRubricDraft?.criteria?.[cIdx];
                if (!crit) return;
                this.modalHasManualChanges = true;
                crit.levels.push({
                    id: "lvl-" + Math.random().toString(36).substr(2, 5),
                    label: `${this.t("levelShort")} ${crit.levels.length + 1}`,
                    points: crit.levels.length + 1,
                    desc: ""
                });
                this.renderRubricEditorModalContent(true);
            }

            removeRubricLevelFromCriterion(cIdx, lIdx) {
                this.syncRubricDraftFromInputs();
                const crit = this.tempRubricDraft?.criteria?.[cIdx];
                if (!crit || crit.levels.length <= 1) return;
                this.modalHasManualChanges = true;
                crit.levels.splice(lIdx, 1);
                this.renderRubricEditorModalContent(true);
            }

            renderRubricEditorModalContent(keepManualDirty = false) {
                const rub = this.tempRubricDraft;
                if (!rub) return;
                const maxPts = this.calculateRubricMaxPoints(rub);
                this.openModal(`
                    <form id="rubricEditorForm" onsubmit="app.saveRubricFromEditor(event)" class="p-6 space-y-4 text-xs max-h-[88vh] overflow-y-auto custom-scrollbar">
                        <div class="flex items-center justify-between border-b border-sky-100 dark:border-slate-800 pb-3">
                            <div>
                                <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("rubricsLabel")}</h3>
                                <p class="text-[11px] text-slate-500">Max: <strong>${maxPts} pt</strong></p>
                            </div>
                            <button type="button" onclick="app.closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-navy-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">Nome Scheda *</label>
                                <input type="text" id="rubEditName" required value="${this.escapeHtml(rub.name)}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2 font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">Descrizione</label>
                                <input type="text" id="rubEditDesc" value="${this.escapeHtml(rub.description || '')}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-xl border border-sky-200 dark:border-slate-700 bg-transparent px-3 py-2">
                            </div>
                        </div>

                        <div class="space-y-4 pt-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-extrabold text-slate-800 dark:text-slate-200 uppercase tracking-wider text-[11px]">Criteri di Valutazione</h4>
                                <button type="button" onclick="app.addRubricCriterion()" class="px-3 py-1.5 rounded-xl bg-sky-100 dark:bg-navy-800 text-sky-700 dark:text-sky-300 font-bold hover:bg-sky-200">
                                    <i class="fa-solid fa-plus mr-1"></i>+ Criterio
                                </button>
                            </div>

                            ${(rub.criteria || []).map((crit, cIdx) => `
                                <div class="p-4 rounded-2xl border border-sky-200/80 dark:border-slate-700 bg-sky-50/30 dark:bg-navy-800/50 space-y-3">
                                    <div class="flex items-center justify-between gap-2">
                                        <input type="text" id="rubCritName_${cIdx}" required value="${this.escapeHtml(crit.name)}" oninput="app.syncRubricDraftFromInputs()" class="flex-1 rounded-xl border border-sky-200 dark:border-slate-700 bg-white dark:bg-navy-900 px-3 py-1.5 font-extrabold">
                                        <div class="flex items-center gap-1.5">
                                            <button type="button" onclick="app.addRubricLevelToCriterion(${cIdx})" class="px-2.5 py-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 font-bold text-[11px]">+ ${this.t("levelShort")}</button>
                                            ${rub.criteria.length > 1 ? `
                                                <button type="button" onclick="app.removeRubricCriterion(${cIdx})" class="w-7 h-7 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 flex items-center justify-center">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                                        ${(crit.levels || []).map((lvl, lIdx) => `
                                            <div class="p-2.5 rounded-xl bg-white dark:bg-navy-900 border border-sky-100 dark:border-slate-800 space-y-2 flex flex-col justify-between">
                                                <div class="space-y-1.5">
                                                    <div class="flex items-center justify-between gap-1.5">
                                                        <input type="text" id="rubLvlLabel_${cIdx}_${lIdx}" value="${this.escapeHtml(lvl.label)}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 font-bold text-[11px]" placeholder="Livello">
                                                        ${crit.levels.length > 1 ? `
                                                            <button type="button" onclick="app.removeRubricLevelFromCriterion(${cIdx}, ${lIdx})" class="text-rose-500 hover:text-rose-700 px-1"><i class="fa-solid fa-xmark"></i></button>
                                                        ` : ''}
                                                    </div>
                                                    <div class="flex items-center gap-1.5">
                                                        <span class="text-[10px] text-slate-400 font-bold">Pt:</span>
                                                        <input type="number" step="0.25" id="rubLvlPts_${cIdx}_${lIdx}" value="${lvl.points}" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 font-extrabold text-sky-700 dark:text-sky-400">
                                                    </div>
                                                    <textarea id="rubLvlDesc_${cIdx}_${lIdx}" rows="2" oninput="app.syncRubricDraftFromInputs()" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent p-1.5 text-[11px]" placeholder="Descrittore...">${this.escapeHtml(lvl.desc || '')}</textarea>
                                                </div>
                                            </div>
                                        `).join("")}
                                    </div>
                                </div>
                            `).join("")}
                        </div>

                        <div class="flex justify-end gap-2 pt-3 border-t border-sky-100 dark:border-slate-800">
                            <button type="button" onclick="app.openRubricsManagerModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("backBtn")}</button>
                            <button type="submit" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold shadow-xs">${this.t("saveBtn")}</button>
                        </div>
                    </form>
                `, "max-w-4xl", keepManualDirty);
            }

            saveRubricFromEditor(e) {
                if (e) e.preventDefault();
                this.syncRubricDraftFromInputs();
                const draft = this.tempRubricDraft;
                if (!draft || !draft.name.trim()) return;
                if (!Array.isArray(this.state.rubrics)) this.state.rubrics = [];
                const idx = this.state.rubrics.findIndex(r => r.id === draft.id);
                if (idx >= 0) this.state.rubrics[idx] = draft;
                else this.state.rubrics.push(draft);
                this.tempRubricDraft = null;
                this.persist();
                this.openRubricsManagerModal();
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }

            deleteRubric(rubricId) {
                if ((this.state.rubrics || []).length <= 1) {
                    this.showToast("Mantieni almeno una scheda di valutazione", "error");
                    return;
                }
                this.state.rubrics = (this.state.rubrics || []).filter(r => r.id !== rubricId);
                this.persist();
                this.openRubricsManagerModal();
                this.renderAll();
            }

            openStudentRubricEvaluationModal(studentId, activityId) {

                        <div>

            selectStudentRubricLevel(studentId, activityId, critId, levelId) {

                const key = `${studentId}_${activityId}`;

                course.rubricEvaluations[key].selections[critId] = levelId;
                this.openStudentRubricEvaluationModal(studentId, activityId);
            }

            saveStudentRubricEvaluation(e, studentId, activityId) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                if (!course) return;
                const act = (course.gradeConfig?.activities || []).find(a => a.id === activityId);
                if (!act) return;
                const rubric = (this.state.rubrics || []).find(r => r.id === act.rubricId) || this.state.rubrics[0];
                if (!rubric) return;

                if (!course.rubricEvaluations) course.rubricEvaluations = {};
                const key = `${studentId}_${activityId}`;
                if (!course.rubricEvaluations[key]) {
                    course.rubricEvaluations[key] = { selections: {}, notes: "" };
                }
                const notesEl = document.getElementById("rubricEvalNotesInput");
                if (notesEl) course.rubricEvaluations[key].notes = notesEl.value;

                const selections = course.rubricEvaluations[key].selections || {};
                const maxPoints = this.calculateRubricMaxPoints(rubric);
                let rawPoints = 0;
                (rubric.criteria || []).forEach(c => {
                    const selLvlId = selections[c.id];
                    const lvl = (c.levels || []).find(l => l.id === selLvlId);
                    if (lvl) rawPoints += parseFloat(lvl.points) || 0;
                });
                const gradeOutOf10 = maxPoints > 0 ? Number(((rawPoints / maxPoints) * 10).toFixed(2)) : 0;

                if (!course.grades) course.grades = {};
                if (!course.grades[studentId]) course.grades[studentId] = {};
                course.grades[studentId][activityId] = gradeOutOf10;

                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }

            updateGradeConfigMethod(method) {
                const course = this.getActiveCourse();
                if (!course) return;
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.calcMethod = method === "weighted" ? "weighted" : "average";
                this.persist();
                this.renderMainView();
            }

            updateGradeMinPass(val) {
                const course = this.getActiveCourse();
                if (!course) return;
                const num = Math.min(10, Math.max(1, parseFloat(String(val).replace(",", ".")) || 6));
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                course.gradeConfig.minPass = num;
                this.persist();
                this.renderMainView();
            }

            updateStudentGrade(studentId, activityId, rawVal) {
                const course = this.getActiveCourse();
                if (!course) return;
                if (!course.grades) course.grades = {};
                if (!course.grades[studentId]) course.grades[studentId] = {};
                const str = String(rawVal ?? "").trim().replace(",", ".");
                if (str === "") {
                    delete course.grades[studentId][activityId];
                } else {
                    const num = parseFloat(str);
                    if (!isNaN(num)) {
                        course.grades[studentId][activityId] = Math.min(10, Math.max(0, Number(num.toFixed(2))));
                    }
                }
                this.persist();
                this.renderMainView();
            }

            calculateStudentCourseAverage(course, studentId, moduleObj = null) {
                if (!course || !course.gradeConfig) return null;
                const cfg = course.gradeConfig;
                const acts = cfg.activities || [];
                const stGrades = (course.grades && course.grades[studentId]) ? course.grades[studentId] : {};
                const evalAtt = this.isAttendanceEvaluationEnabled(course, moduleObj);
                const attWeight = this.getAttendanceWeight(course, moduleObj);
                const attScore = evalAtt ? this.calculateStudentAttendanceScore(course, studentId, moduleObj) : null;

                if (cfg.calcMethod === "weighted") {
                    let weightedSum = 0;
                    let weightTotal = 0;
                    acts.forEach(a => {
                        const g = parseFloat(stGrades[a.id]);
                        const w = parseFloat(a.weight) || 0;
                        if (!isNaN(g) && w > 0) {
                            weightedSum += g * w;
                            weightTotal += w;
                        }
                    });
                    if (evalAtt && attScore !== null && attWeight > 0) {
                        weightedSum += attScore * attWeight;
                        weightTotal += attWeight;
                    }
                    if (weightTotal <= 0) return null;
                    return Number((weightedSum / weightTotal).toFixed(2));
                } else {
                    const vals = [];
                    acts.forEach(a => {
                        const g = parseFloat(stGrades[a.id]);
                        if (!isNaN(g)) vals.push(g);
                    });
                    if (evalAtt && attScore !== null) {
                        if (attWeight > 0 && vals.length > 0) {
                            const actAvg = vals.reduce((s, v) => s + v, 0) / vals.length;
                            const w = Math.min(100, Math.max(0, attWeight)) / 100;
                            return Number((actAvg * (1 - w) + attScore * w).toFixed(2));
                        }
                        vals.push(attScore);
                    }
                    if (vals.length === 0) return null;
                    return Number((vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(2));
                }
            }

            saveActivity(e, activityId = null) {
                if (e) e.preventDefault();
                const course = this.getActiveCourse();
                if (!course) return;
                if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                const name = document.getElementById("actNameInput")?.value.trim();
                if (!name) return;
                const useRubric = !!document.getElementById("actUseRubricInput")?.checked;
                const rubricId = document.getElementById("actRubricIdInput")?.value || (this.state.rubrics[0]?.id || "");

                const payload = {
                    id: activityId || ("act-" + Math.random().toString(36).substr(2, 6)),
                    name,
                    weight: parseFloat(document.getElementById("actWeightInput")?.value) || 0,
                    startDate: document.getElementById("actStartDateInput")?.value || "",
                    endDate: document.getElementById("actEndDateInput")?.value || "",
                    useRubric,
                    rubricId: useRubric ? rubricId : "",
                    objectives: document.getElementById("actObjectivesInput")?.value.trim() || "",
                    contents: document.getElementById("actContentsInput")?.value.trim() || "",
                    instructions: document.getElementById("actInstructionsInput")?.value.trim() || "",
                    materials: document.getElementById("actMaterialsInput")?.value.trim() || "",
                    criteriaNotes: document.getElementById("actCriteriaNotesInput")?.value.trim() || "",
                    createdAt: new Date().toISOString()
                };

                const idx = course.gradeConfig.activities.findIndex(a => a.id === activityId);
                if (idx >= 0) {
                    payload.createdAt = course.gradeConfig.activities[idx].createdAt || payload.createdAt;
                    course.gradeConfig.activities[idx] = payload;
                } else {
                    course.gradeConfig.activities.push(payload);
                }
                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }


            // ==============================================================================
            // UNDO & SNAPSHOT SYSTEM (Ctrl+Z)
            // ==============================================================================
            recordUndoSnapshot() {
                if (!this.state) return;
                try {
                    if (!this.undoStack) this.undoStack = [];
                    const snap = JSON.stringify(this.state);
                    this.undoStack.push(snap);
                    if (this.undoStack.length > 25) this.undoStack.shift();
                } catch (e) {
                    console.error("Undo snapshot error:", e);
                }
            }

            performUndo() {
                if (!this.undoStack || this.undoStack.length === 0) {
                    this.showToast("Nessuna modifica da annullare", "info");
                    return;
                }
                try {
                    const prev = this.undoStack.pop();
                    this.state = JSON.parse(prev);
                    this.persist();
                    this.renderAll();
                    this.showToast("↩️ Modifica annullata con successo", "success");
                } catch (e) {
                    console.error("Undo error:", e);
                }
            }

            // ==============================================================================
            // 30-DAY TRASH BIN ("CESTINO")
            // ==============================================================================
            moveToTrash(itemType, title, subtitle, payload, courseId = null, sectionId = null) {
                this.recordUndoSnapshot();
                if (!Array.isArray(this.state.deletedItems)) this.state.deletedItems = [];
                const item = {
                    id: "bin-" + Math.random().toString(36).substr(2, 8),
                    itemType,
                    title: title || "Elemento",
                    subtitle: subtitle || "",
                    deletedAt: new Date().toISOString(),
                    courseId,
                    sectionId,
                    payloadJSON: JSON.stringify(payload)
                };
                this.state.deletedItems.unshift(item);
                this.persist();
                this.showToast(`🗑️ "${title}" spostato nel cestino (30 giorni)`, "info");
            }

            daysRemainingInTrash(item) {
                if (!item || !item.deletedAt) return 30;
                const d = new Date(item.deletedAt).getTime();
                const now = Date.now();
                const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
                return Math.max(0, 30 - diffDays);
            }

            restoreTrashItem(id) {
                this.recordUndoSnapshot();
                const idx = (this.state.deletedItems || []).findIndex(x => x.id === id);
                if (idx < 0) return;
                const item = this.state.deletedItems[idx];
                try {
                    const data = JSON.parse(item.payloadJSON);
                    if (item.itemType === "course") {
                        data.archived = false;
                        this.state.courses.push(data);
                        this.state.activeCourseId = data.id;
                    } else if (item.itemType === "student") {
                        this.state.studentsDirectory.push(data);
                    } else if (item.itemType === "activity") {
                        const course = this.state.courses.find(c => c.id === item.courseId) || this.getActiveCourse();
                        if (course) {
                            if (!course.gradeConfig) course.gradeConfig = { calcMethod: "average", minPass: 6, activities: [] };
                            course.gradeConfig.activities.push(data);
                        }
                    } else if (item.itemType === "rubric") {
                        this.state.rubrics.push(data);
                    } else if (item.itemType === "module") {
                        const course = this.state.courses.find(c => c.id === item.courseId) || this.getActiveCourse();
                        if (course && course.levels && course.levels.length > 0) {
                            course.levels[0].modules.push(data);
                        }
                    }
                    this.state.deletedItems.splice(idx, 1);
                    this.persist();
                    this.renderAll();
                    this.showToast(`♻️ "${item.title}" ripristinato con successo`, "success");
                } catch (e) {
                    console.error("Restore error:", e);
                    this.showToast("Errore durante il ripristino", "error");
                }
            }

            permanentDeleteTrashItem(id) {
                this.recordUndoSnapshot();
                this.state.deletedItems = (this.state.deletedItems || []).filter(x => x.id !== id);
                this.persist();
                this.renderAll();
                this.showToast("Elemento rimosso definitivamente", "info");
            }

            emptyTrash() {
                if (!this.state.deletedItems || this.state.deletedItems.length === 0) return;
                this.recordUndoSnapshot();
                this.state.deletedItems = [];
                this.persist();
                this.renderAll();
                this.showToast("Cestino svuotato", "info");
            }

                                    let icon = "fa-file";
                                    if (item.itemType === "course") icon = "fa-graduation-cap";
                                    else if (item.itemType === "student") icon = "fa-user";

                                                        <i class="fa-solid fa-rotate-left"></i> ${this.t("restoreBtn")}

                                                    <button onclick="app.permanentDeleteTrashItem('${item.id}')" class="px-3 py-1.5 rounded-xl border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 font-bold transition">
                                                        <i class="fa-solid fa-trash-can"></i>

                                            </div>

            deleteActivity(activityId) {
                const course = this.getActiveCourse();
                if (!course || !course.gradeConfig) return;

                if (!rub || !newName.trim()) return;
                this.recordUndoSnapshot();
                rub.name = newName.trim();
                this.persist();
                this.renderAll();
            }

            duplicateRubric(rubId) {
                const orig = (this.state.rubrics || []).find(r => r.id === rubId);
                if (!orig) return;
                this.recordUndoSnapshot();
                const copy = JSON.parse(JSON.stringify(orig));
                copy.id = "rub-" + Math.random().toString(36).substr(2, 7);
                copy.name = orig.name + " (Copia)";
                this.state.rubrics.push(copy);
                this.selectedRubricId = copy.id;
                this.persist();
                this.renderAll();
                this.showToast("Scheda duplicata", "success");
            }

                this.state.rubrics = this.state.rubrics.filter(r => r.id !== rubId);

                                                <span class="text-xs text-slate-400">${(lvl.modules || []).length} ${this.t("modulesLabel")}</span>

                                            <div class="flex items-center gap-2 text-xs">

                                                        <div class="space-y-1">
                                                            <div class="flex items-center justify-between gap-2">
                                                                <h4 class="font-extrabold text-sm text-slate-900 dark:text-white">${this.escapeHtml(mod.name)}</h4>

                                                                ${this.t("activateBtn")}
