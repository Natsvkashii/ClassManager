                                                            <button onclick="app.openStudentDetailModal('${st.id}')" class="px-2.5 py-1 rounded-lg border border-sky-200 dark:border-slate-700 font-bold">${this.t("profileCardBtn")}</button>
                                                            ${this.showFormerGroupStudents ? `
                                                                <button onclick="app.reinsertFormerStudent('${st.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold">${this.t("reinsertBtn")}</button>
                                                            ` : `
                                                                <button onclick="app.openExcludeOrRemoveStudentModal('${st.id}')" class="px-2.5 py-1 rounded-lg border border-rose-200 text-rose-600 font-bold">${this.t("excludeRemoveBtn")}</button>
                                                            `}
                                                        </div>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join("")}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                `;
            }

            openExcludeOrRemoveStudentModal(studentId) {
                const st = (this.state.studentsDirectory || []).find(s => s.id === studentId);
                const name = st ? `${st.firstName} ${st.lastName}`.trim() : "Studente";
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("excludeRemoveBtn")}: ${this.escapeHtml(name)}</h3>
                        <div class="flex flex-wrap justify-end gap-2 pt-3">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("cancelBtn")}</button>
                            <button onclick="app.excludeStudentToFormer('${studentId}')" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-white font-bold">${this.t("formerStudentsBtn")}</button>
                            <button onclick="app.removeStudentFromModuleCompletely('${studentId}')" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">${this.t("removeFromGroupBtn")}</button>
                        </div>
                    </div>
                `, "max-w-md");
            }

            excludeStudentToFormer(studentId) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                sec.studentIds = (sec.studentIds || []).filter(id => id !== studentId);
                if (!Array.isArray(course.formerStudentIds)) course.formerStudentIds = [];
                if (!course.formerStudentIds.includes(studentId)) course.formerStudentIds.push(studentId);
                this.persist();
                this.closeModal();
                this.renderAll();
            }

            removeStudentFromModuleCompletely(studentId) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                sec.studentIds = (sec.studentIds || []).filter(id => id !== studentId);
                if (Array.isArray(course.formerStudentIds)) {
                    course.formerStudentIds = course.formerStudentIds.filter(id => id !== studentId);
                }
                this.persist();
                this.closeModal();
                this.renderAll();
            }

            reinsertFormerStudent(studentId) {
                const course = this.getActiveCourse();
                const sec = this.getActiveSection(course);
                if (!course || !sec) return;
                if (!sec.studentIds.includes(studentId)) sec.studentIds.push(studentId);
                if (Array.isArray(course.formerStudentIds)) {
                    course.formerStudentIds = course.formerStudentIds.filter(id => id !== studentId);
                }
                this.persist();
                this.renderAll();
            }

            /**
             * Global Calendar View (Day, Week, Month + Course Colors + Conflict Detection + Google Calendar Layout)
             */
            renderCalEventCard(ev, compact = false, fullHeight = false) {
                const heightCls = fullHeight ? "h-full" : "min-h-[38px] shrink-0";
                if (ev.isGoogleEvent) {
                    return `
                        <button onclick="if(window.electronAPI){window.electronAPI.openExternal('${this.escapeHtml(ev.hangoutLink || ev.htmlLink || 'https://calendar.google.com')}');}else{window.open('${this.escapeHtml(ev.hangoutLink || ev.htmlLink || 'https://calendar.google.com')}','_blank');}"
                            class="w-full ${heightCls} text-left p-1.5 rounded-lg text-white font-bold transition hover:opacity-95 shadow-2xs flex flex-col justify-center overflow-hidden"
                            style="background-color:#2563eb;" title="Evento Google Calendar personale: ${this.escapeHtml(ev.title)}">
                            <div class="flex items-center justify-between gap-1 w-full min-w-0">
                                <span class="truncate text-[10px] flex items-center gap-1 font-extrabold"><i class="fa-brands fa-google text-[9px] shrink-0"></i> <span class="truncate">${this.escapeHtml(ev.title)}</span></span>
                                ${ev.hangoutLink ? `<i class="fa-solid fa-video text-emerald-200 text-[9px] shrink-0" title="Link Meet disponibile"></i>` : ''}
                            </div>
                            ${!compact ? `<div class="text-[9px] opacity-90 truncate leading-tight mt-0.5">${this.formatTimeDisplay(ev.time)} - ${this.formatTimeDisplay(ev.endTime)}</div>` : ''}
                        </button>
                    `;
                }
                return `
                    <button onclick="app.openLessonPlanModal('${ev.courseId}', '${ev.sectionId}', '${ev.slotKey}')"
                        class="w-full ${heightCls} text-left p-1.5 rounded-lg text-white font-bold transition hover:opacity-95 flex flex-col justify-center overflow-hidden shadow-2xs"
                        style="background-color:${ev.pal.hex}" title="${this.escapeHtml(ev.courseName)}${ev.title ? ' — ' + this.escapeHtml(ev.title) : ''}">
                        <div class="flex items-center justify-between gap-1 w-full min-w-0">
                            <span class="truncate text-[10.5px] font-extrabold leading-tight">${this.escapeHtml(ev.courseName)}</span>
                            ${ev.conflict ? `<i class="fa-solid fa-triangle-exclamation text-amber-200 text-[10px] shrink-0" title="${this.t("timeConflictWarning")}"></i>` : ''}
                        </div>
                        ${!compact ? `
                            <div class="text-[9.5px] opacity-90 truncate leading-tight mt-0.5">${ev.title ? this.escapeHtml(ev.title) + ' • ' : ''}${this.formatTimeDisplay(ev.time)} - ${this.formatTimeDisplay(ev.endTime)}</div>
                        ` : `
                            <div class="text-[8.5px] opacity-80 truncate leading-tight mt-0.5">${this.formatTimeDisplay(ev.time)}</div>
                        `}
                    </button>
                `;
            }

            calculateSideBySideLayout(events) {
                if (!events || !events.length) return [];
                const parseMin = (tStr) => {
                    if (!tStr) return 9 * 60;
                    const p = tStr.split(":").map(Number);
                    if (p.length >= 2 && !isNaN(p[0]) && !isNaN(p[1])) return p[0] * 60 + p[1];
                    return 9 * 60;
                };

                const items = events.map(ev => {
                    const s = parseMin(ev.time);
                    const e = Math.max(s + 30, parseMin(ev.endTime));
                    return { event: ev, start: s, end: e };
                }).sort((a, b) => a.start !== b.start ? a.start - b.start : b.end - a.end);

                const clusters = [];
                let curCluster = [];
                let clusterMaxEnd = -1;

                for (const it of items) {
                    if (!curCluster.length) {
                        curCluster.push(it);
                        clusterMaxEnd = it.end;
                    } else {
                        if (it.start < clusterMaxEnd) {
                            curCluster.push(it);
                            clusterMaxEnd = Math.max(clusterMaxEnd, it.end);
                        } else {
                            clusters.push(curCluster);
                            curCluster = [it];
                            clusterMaxEnd = it.end;
                        }
                    }
                }
                if (curCluster.length) clusters.push(curCluster);

                const result = [];
                for (const cluster of clusters) {
                    const colEndTimes = [];
                    const placedInCluster = [];
                    for (const it of cluster) {
                        let assignedCol = -1;
                        for (let cIdx = 0; cIdx < colEndTimes.length; cIdx++) {
                            if (colEndTimes[cIdx] <= it.start) {
                                assignedCol = cIdx;
                                colEndTimes[cIdx] = it.end;
                                break;
                            }
                        }
                        if (assignedCol === -1) {
                            assignedCol = colEndTimes.length;
                            colEndTimes.push(it.end);
                        }
                        placedInCluster.push({ ...it, col: assignedCol });
                    }
                    const totalCols = Math.max(1, colEndTimes.length);
                    for (const it of placedInCluster) {
                        result.push({
                            event: it.event,
                            startMin: it.start,
                            endMin: it.end,
                            colIndex: it.col,
                            totalCols: totalCols
                        });
                    }
                }
                return result;
            }

            getCalendarHeaderTitle() {
                const months = this.t("months");
                const year = this.calendarCursor.getFullYear();
                const month = this.calendarCursor.getMonth();

                if (this.calendarViewMode === "day") {
                    const daysLong = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
                    const dayName = daysLong[this.calendarCursor.getDay()];
                    return `${dayName} ${this.calendarCursor.getDate()} ${months[month]} ${year}`;
                }

                if (this.calendarViewMode === "week") {
                    const startFirstDayMon = (this.state?.settings?.firstDayOfWeek || "monday") === "monday";
                    const cur = new Date(this.calendarCursor);
                    const dow = cur.getDay();
                    const offset = startFirstDayMon ? (dow === 0 ? -6 : 1 - dow) : -dow;
                    const weekStart = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + offset);
                    const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 6);
                    const sMonth = months[weekStart.getMonth()];
                    const eMonth = months[weekEnd.getMonth()];
                    if (weekStart.getMonth() === weekEnd.getMonth()) {
                        return `${weekStart.getDate()} – ${weekEnd.getDate()} ${eMonth} ${weekEnd.getFullYear()}`;
                    }
                    return `${weekStart.getDate()} ${sMonth} – ${weekEnd.getDate()} ${eMonth} ${weekEnd.getFullYear()}`;
                }

                return `${months[month]} ${year}`;
            }

            renderCalendarView(container) {
                const activeCourses = (this.state.courses || []).filter(c => !c.archived);
                const months = this.t("months");
                const startFirstDayMon = (this.state?.settings?.firstDayOfWeek || "monday") === "monday";
                const dayHeaders = startFirstDayMon ? this.t("daysShortMon") : this.t("daysShortSun");

                const allEventsByDate = {};
                activeCourses.forEach(c => {
                    if (this.calendarFilterCourseId !== "ALL" && c.id !== this.calendarFilterCourseId) return;
                    const pal = this.getCourseColorObj(c.color);
                    (c.levels || []).forEach(lvl => {
                        (lvl.modules || []).forEach(mod => {
                            if (this.calendarFilterModuleId !== "ALL" && mod.id !== this.calendarFilterModuleId) return;
                            (mod.dates || []).forEach((slotKey, sIdx) => {
                                const dStr = this.extractDateFromSlotKey(slotKey);
                                const les = this.findLessonForSlot(c, mod.id, slotKey);
                                const sTime = les?.time || mod.startTime || c.startTime || "19:00";
                                const eTime = les?.endTime || mod.endTime || c.endTime || "20:30";
                                if (!allEventsByDate[dStr]) allEventsByDate[dStr] = [];
                                allEventsByDate[dStr].push({
                                    courseId: c.id,
                                    courseName: c.name,
                                    sectionId: mod.id,
                                    modName: mod.name,
                                    slotKey,
                                    lessonNum: sIdx + 1,
                                    time: sTime,
                                    endTime: eTime,
                                    title: les?.title || "",
                                    isAllDay: false,
                                    pal
                                });
                            });
                        });
                    });
                });

                // Integrate personal Google Calendar events if connected & enabled
                if (this.state?.settings?.googleCalendarConnected && this.state?.settings?.showGoogleCalendarEvents !== false && Array.isArray(this.googleEvents)) {
                    this.googleEvents.forEach(gev => {
                        const sStr = gev.start?.dateTime || gev.start?.date;
                        if (!sStr) return;
                        const dStr = sStr.substring(0, 10);
                        const isAllDay = !gev.start?.dateTime && !!gev.start?.date;
                        let sTime = "09:00";
                        let eTime = "10:00";
                        if (gev.start?.dateTime && gev.start.dateTime.length >= 16) {
                            sTime = gev.start.dateTime.substring(11, 16);
                        }
                        if (gev.end?.dateTime && gev.end.dateTime.length >= 16) {
                            eTime = gev.end.dateTime.substring(11, 16);
                        }
                        if (!allEventsByDate[dStr]) allEventsByDate[dStr] = [];
                        allEventsByDate[dStr].push({
                            isGoogleEvent: true,
                            id: gev.id,
                            title: gev.summary || "(Senza titolo)",
                            time: sTime,
                            endTime: eTime,
                            isAllDay,
                            hangoutLink: gev.hangoutLink || "",
                            htmlLink: gev.htmlLink || "",
                            pal: { hex: "#2563eb" }
                        });
                    });
                }

                Object.values(allEventsByDate).forEach(list => {
                    list.sort((a, b) => a.time.localeCompare(b.time));
                    for (let i = 0; i < list.length; i++) {
                        for (let j = i + 1; j < list.length; j++) {
                            if (list[i].endTime > list[j].time && list[i].time < list[j].endTime) {
                                list[i].conflict = true;
                                list[j].conflict = true;
                            }
                        }
                    }
                });

                const curMode = this.calendarViewMode || "month";
                const headerTitle = this.getCalendarHeaderTitle();

                // Compute month cells if in month mode
                const year = this.calendarCursor.getFullYear();
                const month = this.calendarCursor.getMonth();
                const firstOfMonth = new Date(year, month, 1);
                const firstDow = firstOfMonth.getDay();
                const offset = startFirstDayMon ? (firstDow === 0 ? -6 : 1 - dowSafe(firstDow)) : -firstDow;
                function dowSafe(d) { return d === 0 ? 7 : d; }
                const monthOffset = startFirstDayMon ? (firstDow === 0 ? -6 : 1 - firstDow) : -firstDow;
                const gridStart = new Date(year, month, 1 + monthOffset);

                const cells = [];
                for (let i = 0; i < 42; i++) {
                    const d = new Date(gridStart);
                    d.setDate(gridStart.getDate() + i);
                    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
                    cells.push({
                        iso,
                        dayNum: d.getDate(),
                        inMonth: d.getMonth() === month,
                        events: allEventsByDate[iso] || []
                    });
                }

                // Render main container with Toolbar & Selected Mode Content
                container.innerHTML = `
                    <div class="space-y-4">
                        <!-- Calendar Toolbar -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-3.5 shadow-xs flex flex-wrap items-center justify-between gap-3 text-xs">
                            <div class="flex items-center gap-2">
                                <button onclick="app.navigateCalendar(-1)" class="w-8 h-8 rounded-xl border border-sky-200 dark:border-slate-700 flex items-center justify-center hover:bg-sky-50 dark:hover:bg-navy-800 transition"><i class="fa-solid fa-chevron-left"></i></button>
                                <button onclick="app.calendarCursor = new Date(); app.renderMainView();" class="px-3 py-1.5 rounded-xl border border-sky-200 dark:border-slate-700 font-bold hover:bg-sky-50 dark:hover:bg-navy-800 transition">${this.t("todayBtn")}</button>
                                <button onclick="app.navigateCalendar(1)" class="w-8 h-8 rounded-xl border border-sky-200 dark:border-slate-700 flex items-center justify-center hover:bg-sky-50 dark:hover:bg-navy-800 transition"><i class="fa-solid fa-chevron-right"></i></button>
                                <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white ml-2">${headerTitle}</h3>
                            </div>

                            <div class="flex flex-wrap items-center gap-2">
                                <!-- View Mode Selector (Giorno, Settimana, Mese) -->
                                <div class="inline-flex rounded-xl p-0.5 bg-sky-100/70 dark:bg-navy-800 border border-sky-200 dark:border-slate-700">
                                    <button type="button" onclick="app.calendarViewMode = 'day'; app.renderMainView();" class="px-3 py-1 rounded-lg font-bold text-xs transition ${curMode === 'day' ? 'bg-white dark:bg-navy-900 text-sky-600 dark:text-sky-300 shadow-xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Giorno</button>
                                    <button type="button" onclick="app.calendarViewMode = 'week'; app.renderMainView();" class="px-3 py-1 rounded-lg font-bold text-xs transition ${curMode === 'week' ? 'bg-white dark:bg-navy-900 text-sky-600 dark:text-sky-300 shadow-xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Settimana</button>
                                    <button type="button" onclick="app.calendarViewMode = 'month'; app.renderMainView();" class="px-3 py-1 rounded-lg font-bold text-xs transition ${curMode === 'month' ? 'bg-white dark:bg-navy-900 text-sky-600 dark:text-sky-300 shadow-xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}">Mese</button>
                                </div>

                                ${this.state?.settings?.googleCalendarConnected ? `
                                    <button onclick="app.refreshGoogleCalendarEvents(true)" class="px-2.5 py-1.5 rounded-xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 font-bold flex items-center gap-1.5 text-xs hover:bg-blue-100 dark:hover:bg-blue-900/50 transition" title="Sincronizza eventi Google Calendar">
                                        <i class="fa-brands fa-google text-blue-600"></i>
                                        <span>Google Calendar</span>
                                        <i class="fa-solid fa-arrows-rotate text-[10px] ${this.isSyncingGoogle ? 'fa-spin' : ''}"></i>
                                    </button>
                                ` : `
                                    <button onclick="app.startGoogleOAuth()" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold flex items-center gap-1.5 text-xs transition" title="Collega il tuo account Google Calendar">
                                        <i class="fa-brands fa-google text-blue-500"></i>
                                        <span>Collega Google</span>
                                    </button>
                                `}

                                <select onchange="app.calendarFilterCourseId = this.value; app.renderMainView();" class="rounded-xl border border-sky-200 dark:border-slate-700 bg-sky-50/50 dark:bg-navy-800 px-3 py-1.5 font-bold">
                                    <option value="ALL">${this.t("allGroupsOpt")}</option>
                                    ${activeCourses.map(c => `<option value="${c.id}" ${this.calendarFilterCourseId === c.id ? 'selected' : ''}>${this.escapeHtml(c.name)}</option>`).join("")}
                                </select>
                            </div>
                        </div>

                        <!-- Calendar Body Content -->
                        ${curMode === "day" ? this.buildCalendarDayView(allEventsByDate) : (curMode === "week" ? this.buildCalendarWeekView(allEventsByDate, dayHeaders, startFirstDayMon) : this.buildCalendarMonthView(cells, dayHeaders))}
                    </div>
                `;
            }

            buildCalendarDayView(allEventsByDate) {
                const cur = new Date(this.calendarCursor);
                const curIso = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}-${String(cur.getDate()).padStart(2, "0")}`;
                const now = new Date();
                const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
                const isToday = curIso === todayIso;

                const dayEvents = allEventsByDate[curIso] || [];
                const allDayEvents = dayEvents.filter(e => e.isAllDay);
                const timedEvents = dayEvents.filter(e => !e.isAllDay);

                const startGridHour = 7;
                const endGridHour = 23;
                const totalHours = endGridHour - startGridHour; // 16 hours
                const hourHeight = 64; // px per hour
                const totalHeight = totalHours * hourHeight;

                const placedTimedEvents = this.calculateSideBySideLayout(timedEvents);

                let redLineHtml = "";
                if (isToday) {
                    const curMin = now.getHours() * 60 + now.getMinutes();
                    if (curMin >= startGridHour * 60 && curMin <= endGridHour * 60) {
                        const curY = (curMin - startGridHour * 60) * (hourHeight / 60);
                        redLineHtml = `
                            <div class="absolute left-14 right-2 flex items-center z-20 pointer-events-none" style="top: ${curY}px;">
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 -ml-1.5 shadow-xs"></span>
                                <div class="flex-1 h-[2px] bg-rose-500 shadow-xs"></div>
                            </div>
                        `;
                    }
                }

                return `
                    <div class="space-y-4">
                        ${allDayEvents.length > 0 ? `
                            <div class="p-3 rounded-2xl bg-white dark:bg-navy-900 border border-sky-100 dark:border-slate-800 space-y-2 shadow-xs">
                                <div class="text-[11px] font-extrabold uppercase text-slate-400">Tutto il giorno</div>
                                <div class="flex flex-wrap gap-2">
                                    ${allDayEvents.map(ev => `<div class="w-64 h-10">${this.renderCalEventCard(ev, true, true)}</div>`).join("")}
                                </div>
                            </div>
                        ` : ''}

                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-4 shadow-xs overflow-x-auto custom-scrollbar">
                            <div class="min-w-[620px] relative" style="height: ${totalHeight + 40}px;">
                                <!-- Hour lines & labels -->
                                ${Array.from({ length: totalHours + 1 }, (_, i) => {
                                    const h = startGridHour + i;
                                    const topPos = i * hourHeight;
                                    return `
                                        <div class="absolute left-0 right-0 flex items-center gap-3 text-slate-400 font-mono text-[11px]" style="top: ${topPos}px;">
                                            <span class="w-12 text-right font-semibold select-none shrink-0">${String(h).padStart(2, "0")}:00</span>
                                            <div class="flex-1 h-[1px] bg-slate-100 dark:bg-slate-800"></div>
                                        </div>
                                    `;
                                }).join("")}

                                <!-- Placed Overlapping Events Canvas -->
                                <div class="absolute top-0 bottom-0 left-16 right-2 pointer-events-auto">
                                    ${placedTimedEvents.map(placed => {
                                        const sMin = Math.max(startGridHour * 60, placed.startMin);
                                        const eMin = Math.min(endGridHour * 60, placed.endMin);
                                        const topY = (sMin - startGridHour * 60) * (hourHeight / 60);
                                        const durHeight = Math.max(34, (eMin - sMin) * (hourHeight / 60));
                                        const widthPercent = 100 / placed.totalCols;
                                        const leftPercent = placed.colIndex * widthPercent;
                                        return `
                                            <div class="absolute z-10" style="top: ${topY}px; height: ${durHeight}px; left: calc(${leftPercent}% + 2px); width: calc(${widthPercent}% - 4px);">
                                                ${this.renderCalEventCard(placed.event, durHeight < 55, true)}
                                            </div>
                                        `;
                                    }).join("")}
                                </div>

                                <!-- Current Time Indicator -->
                                ${redLineHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            buildCalendarWeekView(allEventsByDate, dayHeaders, startFirstDayMon) {
                const cur = new Date(this.calendarCursor);
                const dow = cur.getDay();
                const offset = startFirstDayMon ? (dow === 0 ? -6 : 1 - dow) : -dow;
                const weekStart = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + offset);
                const now = new Date();
                const todayIso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

                return `
                    <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-4 shadow-xs overflow-x-auto custom-scrollbar">
                        <div class="grid grid-cols-7 gap-2.5 min-w-[760px] items-stretch">
                            ${Array.from({ length: 7 }, (_, dIdx) => {
                                const d = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + dIdx);
                                const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
                                const isToday = iso === todayIso;
                                const dayEvents = allEventsByDate[iso] || [];
                                return `

            buildCalendarMonthView(cells, dayHeaders) {
                const now = new Date();
                const nowY = now.getFullYear();
                const nowM = String(now.getMonth() + 1).padStart(2, "0");
                const nowD = String(now.getDate()).padStart(2, "0");
                const todayIso = `${nowY}-${nowM}-${nowD}`;

                return `
                    <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-4 shadow-xs overflow-x-auto custom-scrollbar">
                        <div class="min-w-[760px] space-y-2.5">
                            <div class="grid grid-cols-7 gap-2 text-center text-[11px] font-extrabold uppercase text-slate-400">
                                ${dayHeaders.map(h => `<div>${this.escapeHtml(h)}</div>`).join("")}
                            </div>
                            <div class="grid grid-cols-7 gap-2 items-stretch">
                                ${cells.map(cell => {
                                    const isToday = cell.iso === todayIso;
                                    const hasEvents = cell.events && cell.events.length > 0;
                                    return `
                                        <div class="min-h-[120px] h-auto p-2 rounded-xl border transition flex flex-col justify-start gap-1.5 ${isToday ? 'border-blue-400 dark:border-blue-500 bg-blue-50/20 dark:bg-blue-950/20 ring-2 ring-blue-400/20 shadow-xs' : (cell.inMonth ? 'bg-white dark:bg-navy-900 border-sky-100 dark:border-slate-800' : 'bg-slate-50/50 dark:bg-navy-950/40 border-slate-100 dark:border-slate-800/40 opacity-45')}">
                                            <div class="flex items-center justify-between pb-0.5">
                                                <span class="text-xs font-black ${isToday ? 'text-blue-600 dark:text-blue-400 font-extrabold' : (cell.inMonth ? 'text-slate-800 dark:text-slate-200' : 'text-slate-400 dark:text-slate-500')}">${cell.dayNum}</span>
                                                ${hasEvents ? `<span class="px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[9px] font-bold text-slate-500 dark:text-slate-400">${cell.events.length}</span>` : ''}
                                            </div>
                                            <div class="flex-1 flex flex-col gap-1 min-w-0 overflow-y-auto max-h-[170px] custom-scrollbar pr-0.5">
                                                ${cell.events.map(ev => this.renderCalEventCard(ev, true, false)).join("")}
                                            </div>
                                        </div>
                                    `;
                                }).join("")}
                            </div>
                        </div>
                    </div>
                `;
            }

            navigateCalendar(delta) {
                if (this.calendarViewMode === "day") {
                    this.calendarCursor.setDate(this.calendarCursor.getDate() + delta);
                } else if (this.calendarViewMode === "week") {
                    this.calendarCursor.setDate(this.calendarCursor.getDate() + delta * 7);
                } else {
                    this.calendarCursor.setMonth(this.calendarCursor.getMonth() + delta);
                }
                this.renderMainView();
            }

            saveNewGlobalStudent(e) {
                if (e) e.preventDefault();
                const firstName = document.getElementById("newStFirst")?.value.trim();
                if (!firstName) return;
                const st = {
                    id: "st-" + Math.random().toString(36).substr(2, 6),
                    firstName,
                    lastName: document.getElementById("newStLast")?.value.trim() || "",
                    phone: document.getElementById("newStPhone")?.value.trim() || "",
                    email: document.getElementById("newStEmail")?.value.trim() || "",
                    city: document.getElementById("newStCity")?.value.trim() || "",
                    birthDate: document.getElementById("newStBirth")?.value || "",
                    notes: "",
                    currentLevel: "A1",
                    billingInfo: {
                        idType: "cedula",
                        idNumber: "",
                        fullName: `${firstName} ${document.getElementById("newStLast")?.value.trim() || ""}`.trim(),
                        city: document.getElementById("newStCity")?.value.trim() || "",
                        address: "",
                        phone: document.getElementById("newStPhone")?.value.trim() || "",
                        email: document.getElementById("newStEmail")?.value.trim() || ""
                    }
                };
                this.state.studentsDirectory.push(st);
                document.querySelectorAll("input[name='newStCourseEnroll']:checked").forEach(cb => {
                    const c = (this.state.courses || []).find(x => x.id === cb.value);
                    const mod = this.getActiveSection(c);
                    if (mod && !mod.studentIds.includes(st.id)) {
                        mod.studentIds.push(st.id);
                    }
                });
                this.persist();
                this.closeModal(true);
                this.renderAll();
                this.showToast(this.t("saveBtn"), "success");
            }

            deleteGlobalStudent(studentId) {
                const st = (this.state.studentsDirectory || []).find(s => s.id === studentId);
                if (st) {
                    this.moveToTrash("student", `${st.firstName} ${st.lastName}`, st.city || st.email || "", st);
                    this.state.studentsDirectory = this.state.studentsDirectory.filter(s => s.id !== studentId);
                    (this.state.courses || []).forEach(c => {
                        (c.levels || []).forEach(l => (l.modules || []).forEach(m => {
                            m.studentIds = (m.studentIds || []).filter(id => id !== studentId);
                        }));
                    });
                    this.persist();
                    this.renderAll();
                }
            }

            openStudentDetailModal(studentId) {
                const st = (this.state.studentsDirectory || []).find(s => s.id === studentId);
                if (!st) return;

                            Object.values(att).forEach(v => {
                                if (v === "P" || v === "G" || v === "A") {

                                    if (v === "A") totalAbsences++;

                    <div class="space-y-4">
                        ${archived.length === 0 ? `
                            <div class="flex flex-col items-center justify-center min-h-[50vh] text-center space-y-4 p-8">
                                <div class="w-24 h-24 rounded-full bg-slate-100 dark:bg-navy-800 flex items-center justify-center text-slate-300 dark:text-slate-600 text-4xl shadow-inner">
                                    <i class="fa-solid fa-box-archive"></i>
                                </div>
                                <div class="space-y-1.5 max-w-md">
                                    <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200">${this.t("noArchivedCoursesMsg")}</h3>
                                </div>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
                                ${archived.map(c => {
                                    const pal = this.getCourseColorObj(c.color);
                                    return `
                                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 flex flex-col justify-between gap-4">
                                            <div>
                                                <span class="px-2 py-0.5 rounded text-white text-[10px] font-extrabold" style="background-color:${pal.hex}">${this.escapeHtml(this.formatLevelModuleBadge(c))}</span>
                                                <h3 class="text-sm font-extrabold text-slate-900 dark:text-white mt-2">${this.escapeHtml(c.name)}</h3>
                                            </div>
                                            <div class="flex items-center justify-between gap-2 pt-3 border-t border-sky-100 dark:border-slate-800">
                                                <button onclick="app.restoreArchivedCourse('${c.id}')" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white font-bold">${this.t("restoreCourseBtn")}</button>
                                                <button onclick="app.deleteCoursePermanently('${c.id}')" class="px-3 py-2 rounded-xl border border-rose-200 text-rose-600 font-bold">${this.t("deleteBtn")}</button>
                                            </div>
                                        </div>
                                    `;
                                }).join("")}
                            </div>
                        `}
                    </div>
                `;
            }

            restoreArchivedCourse(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (!c) return;
                c.archived = false;
                this.state.activeCourseId = c.id;
                this.persist();
                this.renderAll();
            }

            deleteCoursePermanently(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (c) {
                    this.moveToTrash("course", c.name, this.formatLevelModuleBadge(c), c);
                    this.state.courses = (this.state.courses || []).filter(x => x.id !== courseId);
                    if (this.state.activeCourseId === courseId) {
                        const first = this.state.courses.find(x => !x.archived);
                        this.state.activeCourseId = first ? first.id : "";
                    }
                    this.persist();
                    this.closeModal();
                    this.renderAll();
                }
            }

            confirmDeleteOrArchiveCourse(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (!c) return;
                this.openModal(`
                    <div class="p-6 space-y-4 text-xs">
                        <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.t("confirmDeleteTitle")}: ${this.escapeHtml(c.name)}</h3>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 font-bold">${this.t("cancelBtn")}</button>
                            <button onclick="app.archiveCourse('${c.id}')" class="px-4 py-2 rounded-xl bg-amber-500 text-white font-bold">${this.t("archiveInsteadBtn")}</button>
                            <button onclick="app.deleteCoursePermanently('${c.id}')" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold">${this.t("deleteBtn")}</button>
                        </div>
                    </div>
                `, "max-w-md");
            }

            archiveCourse(courseId) {
                const c = (this.state.courses || []).find(x => x.id === courseId);
                if (!c) return;
                c.archived = true;
                if (this.state.activeCourseId === courseId) {
                    const next = (this.state.courses || []).find(x => !x.archived);
                    this.state.activeCourseId = next ? next.id : "";
                }
                this.persist();
                this.closeModal();
                this.renderAll();
            }

            /**
             * Billing ("Fatturazione") View & Pricing Helpers (v26.10.2b)
             */
            getLessonPricing(mod, slotKey) {
                if (!mod) return { net: 0, vatPct: 0, discType: 'percent', discVal: 0, discountAmount: 0, netAfterDiscount: 0, vatAmount: 0, gross: 0, hasOverride: false };
                const b = mod.billing || {};
                const defaultHourly = parseFloat(this.state?.settings?.defaultHourlyRate) || 10.0;
                const defaultDuration = parseFloat(this.state?.settings?.defaultLessonDurationHours) || 1.5;
                const defaultVat = parseFloat(this.state?.settings?.defaultVatPercent) || 15.0;

                const hourly = (b.hourlyRateNet !== undefined && b.hourlyRateNet !== null && b.hourlyRateNet !== "") ? parseFloat(b.hourlyRateNet) : defaultHourly;
                const duration = (b.lessonDurationHours !== undefined && b.lessonDurationHours !== null && b.lessonDurationHours !== "") ? parseFloat(b.lessonDurationHours) : defaultDuration;
                const baseNet = hourly * duration;

                const ov = (b.lessonOverrides && b.lessonOverrides[slotKey]) ? b.lessonOverrides[slotKey] : null;

                const net = (ov && ov.price !== undefined && ov.price !== null && ov.price !== "") ? parseFloat(ov.price) : baseNet;
                const vatPct = (ov && ov.vatPercent !== undefined && ov.vatPercent !== null && ov.vatPercent !== "") ? parseFloat(ov.vatPercent) : ((b.vatPercent !== undefined && b.vatPercent !== null && b.vatPercent !== "") ? parseFloat(b.vatPercent) : defaultVat);
                const discType = (ov && ov.discountType) ? ov.discountType : (b.discountType || "percent");
                const discVal = (ov && ov.discountValue !== undefined && ov.discountValue !== null && ov.discountValue !== "") ? parseFloat(ov.discountValue) : (parseFloat(b.discountValue) || 0);

                let discountAmount = 0;
                if (discVal > 0) {
                    discountAmount = discType === "percent" ? (net * (discVal / 100)) : discVal;
                }
                const netAfterDiscount = Math.max(0, net - discountAmount);
                const vatAmount = netAfterDiscount * (vatPct / 100);
                const gross = netAfterDiscount + vatAmount;

                return {
                    net,
                    vatPct,
                    discType,
                    discVal,
                    discountAmount,
                    netAfterDiscount,
                    vatAmount,
                    gross,
                    hasOverride: !!ov
                };
            }

            getModuleTotalGross(mod) {
                if (!mod || !Array.isArray(mod.dates)) return 0;
                const b = mod.billing || {};
                if ((!b.lessonOverrides || Object.keys(b.lessonOverrides).length === 0) && b.discountType === "fixed" && (parseFloat(b.discountValue) || 0) > 0) {
                    const defaultHourly = parseFloat(this.state?.settings?.defaultHourlyRate) || 10.0;
                    const defaultDuration = parseFloat(this.state?.settings?.defaultLessonDurationHours) || 1.5;
                    const defaultVat = parseFloat(this.state?.settings?.defaultVatPercent) || 15.0;
                    const hourly = (b.hourlyRateNet !== undefined && b.hourlyRateNet !== null && b.hourlyRateNet !== "") ? parseFloat(b.hourlyRateNet) : defaultHourly;
                    const duration = (b.lessonDurationHours !== undefined && b.lessonDurationHours !== null && b.lessonDurationHours !== "") ? parseFloat(b.lessonDurationHours) : defaultDuration;
                    const vatPct = (b.vatPercent !== undefined && b.vatPercent !== null && b.vatPercent !== "") ? parseFloat(b.vatPercent) : defaultVat;
                    const totalNet = hourly * duration * mod.dates.length;
                    const netAfter = Math.max(0, totalNet - (parseFloat(b.discountValue) || 0));
                    return netAfter + (netAfter * (vatPct / 100));
                }
                return mod.dates.reduce((sum, sk) => sum + this.getLessonPricing(mod, sk).gross, 0);
            }

            renderBillingView(container) {
                const activeCourses = (this.state.courses || []).filter(c => !c.archived);
                const course = activeCourses.find(c => c.id === this.selectedBillingCourseId) || this.getActiveCourse() || activeCourses[0];

                if (!course) {
                    container.innerHTML = `<div class="p-10 text-center text-xs text-slate-400">${this.t("noActiveCoursesTitle")}</div>`;
                    return;
                }

                const pal = this.getCourseColorObj(course.color);
                const curSettingHourly = parseFloat(this.state?.settings?.defaultHourlyRate) || 10.0;
                const curSettingDuration = parseFloat(this.state?.settings?.defaultLessonDurationHours) || 1.5;
                const curSettingVat = parseFloat(this.state?.settings?.defaultVatPercent) || 15.0;

                // Identify opened/focused module
                let currentModule = null;
                let currentLevel = null;
                if (this.selectedBillingModuleId) {
                    for (const lvl of (course.levels || [])) {
                        const found = (lvl.modules || []).find(m => m.id === this.selectedBillingModuleId);
                        if (found) {
                            currentModule = found;
                            currentLevel = lvl;
                            break;
                        }
                    }
                }
                if (!currentModule) {
                    currentLevel = this.getActiveLevel(course);
                    currentModule = this.getActiveSection(course);
                }
                if (!currentModule && course.levels?.[0]?.modules?.[0]) {
                    currentLevel = course.levels[0];
                    currentModule = course.levels[0].modules[0];
                }

                // Initialize module billing defaults if missing
                if (currentModule && !currentModule.billing) {
                    currentModule.billing = {
                        hourlyRateNet: curSettingHourly,
                        lessonDurationHours: curSettingDuration,
                        vatPercent: curSettingVat,
                        discountType: "percent",
                        discountTarget: "total",
                        discountValue: 0,
                        lessonOverrides: {}
                    };
                }

                // Compute Course-Level General Overview Statistics
                const todayIso = new Date().toISOString().substring(0, 10);
                let totalScheduledHours = 0;
                let totalCompletedHours = 0;
                let totalCourseGross = 0;
                let totalModulesCount = 0;

                (course.levels || []).forEach(lvl => {
                    (lvl.modules || []).forEach(mod => {
                        totalModulesCount++;
                        const b = mod.billing || {};
                        const dur = parseFloat(b.lessonDurationHours) || curSettingDuration;
                        totalScheduledHours += (mod.dates || []).length * dur;
                        (mod.dates || []).forEach(d => {
                            const dOnly = this.extractDateFromSlotKey(d);
                            const hasAtt = mod.attendance && Object.values(mod.attendance).some(stObj => stObj && stObj[d]);
                            if (dOnly <= todayIso || hasAtt) {
                                totalCompletedHours += dur;
                            }
                        });
                        totalCourseGross += this.getModuleTotalGross(mod);
                    });
                });

                const curBilling = currentModule?.billing || {};
                const curHourlyRate = (curBilling.hourlyRateNet !== undefined && curBilling.hourlyRateNet !== null && curBilling.hourlyRateNet !== "") ? parseFloat(curBilling.hourlyRateNet) : curSettingHourly;
                const curDuration = (curBilling.lessonDurationHours !== undefined && curBilling.lessonDurationHours !== null && curBilling.lessonDurationHours !== "") ? parseFloat(curBilling.lessonDurationHours) : curSettingDuration;
                const curVat = (curBilling.vatPercent !== undefined && curBilling.vatPercent !== null && curBilling.vatPercent !== "") ? parseFloat(curBilling.vatPercent) : curSettingVat;
                const curDiscType = curBilling.discountType || "percent";
                const curDiscVal = parseFloat(curBilling.discountValue) || 0;

                const curModuleCost = currentModule ? this.getModuleTotalGross(currentModule) : 0;
                const curSortedSlots = currentModule ? this.sortModuleSlots(course, currentModule) : [];

                // Build Calendar Data for Opened Module
                const startFirstDayMon = (this.state?.settings?.firstDayOfWeek || "monday") === "monday";
                const dayHeaders = startFirstDayMon ? this.t("daysShortMon") : this.t("daysShortSun");
                const monthNames = this.t("months");

                const monthsData = [];
                if (currentModule && curSortedSlots.length > 0) {
                    const firstDateStr = this.extractDateFromSlotKey(curSortedSlots[0]);
                    const lastDateStr = this.extractDateFromSlotKey(curSortedSlots[curSortedSlots.length - 1]);
                    const firstDate = new Date(firstDateStr + "T12:00:00");
                    const lastDate = new Date(lastDateStr + "T12:00:00");

                    const slotsByDate = {};
                    curSortedSlots.forEach((slotKey, idx) => {
                        const dStr = this.extractDateFromSlotKey(slotKey);
                        if (!slotsByDate[dStr]) slotsByDate[dStr] = [];
                        const les = this.findLessonForSlot(course, currentModule.id, slotKey);
                        const pricing = this.getLessonPricing(currentModule, slotKey);
                        slotsByDate[dStr].push({
                            slotKey,
                            lessonNumber: idx + 1,
                            time: les?.time || currentModule.startTime || course.startTime || "19:00",
                            title: les?.title || "",
                            pricing
                        });
                    });

                    if (!isNaN(firstDate.getTime()) && !isNaN(lastDate.getTime())) {
                        let mCursor = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
                        const maxMonth = new Date(lastDate.getFullYear(), lastDate.getMonth() + 1, 1);
                        let monthGuard = 0;

                        while (mCursor < maxMonth && monthGuard++ < 120) {
                            const y = mCursor.getFullYear();
                            const m = mCursor.getMonth();
                            const monthTitle = `${monthNames[m]} ${y}`;

                            const firstDayOfMonth = new Date(y, m, 1);
                            const lastDayOfMonth = new Date(y, m + 1, 0);

                            const startCursor = new Date(firstDayOfMonth);
                            const fDow = startCursor.getDay();
                            const startOffset = startFirstDayMon ? (fDow === 0 ? -6 : 1 - fDow) : -fDow;
                            startCursor.setDate(startCursor.getDate() + startOffset);

                            const endCursor = new Date(lastDayOfMonth);
                            const lDow = endCursor.getDay();
                            const endOffset = startFirstDayMon ? (lDow === 0 ? 0 : 7 - lDow) : (6 - lDow);
                            endCursor.setDate(endCursor.getDate() + endOffset);

                            const weeks = [];
                            let wCursor = new Date(startCursor);
                            let monthSessionCount = 0;
                            let weekGuard = 0;

                            while (wCursor <= endCursor && weekGuard++ < 12) {
                            const weekDays = [];
                            for (let i = 0; i < 7; i++) {
                                const curY = wCursor.getFullYear();
                                const curM = String(wCursor.getMonth() + 1).padStart(2, "0");
                                const curD = String(wCursor.getDate()).padStart(2, "0");
                                const iso = `${curY}-${curM}-${curD}`;
                                const isCurrentMonth = wCursor.getMonth() === m;
                                const lessons = slotsByDate[iso] || [];
                                if (isCurrentMonth) monthSessionCount += lessons.length;

                                weekDays.push({
                                    iso,
                                    dayNum: wCursor.getDate(),
                                    isCurrentMonth,
                                    lessons
                                });
                                wCursor.setDate(wCursor.getDate() + 1);
                            }
                            weeks.push(weekDays);
                        }

                        monthsData.push({
                            id: `bill-month-${y}-${m}`,
                            title: monthTitle,
                            sessionCount: monthSessionCount,
                            weeks
                        });

                        mCursor.setMonth(mCursor.getMonth() + 1);
                    }
                    }
                }

                container.innerHTML = `
                    <div class="space-y-5 text-xs">
                        <!-- 1. GENERAL OVERVIEW SPACE -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs space-y-4">
                            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-sky-100 dark:border-slate-800 pb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-extrabold shadow-xs" style="background-color: ${pal.hex};">
                                        <i class="fa-solid fa-file-invoice-dollar text-base"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-sm font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(course.name)} — ${this.t("billingTitle")}</h2>
                                        <p class="text-[11px] text-slate-400">${(course.levels || []).length} ${this.t("levelShort")} • ${totalModulesCount} ${this.t("modulesLabel")}</p>
                                    </div>
                                </div>
                                <button onclick="app.openFiscalInfoModal('${course.id}')"
                                    class="px-3.5 py-2 rounded-xl text-white font-extrabold flex items-center gap-2 shadow-2xs transition"
                                    style="background-color: ${pal.hex};">
                                    <i class="fa-solid fa-address-card text-xs"></i>
                                    <span>${this.t("billingFiscalDataBtn")}</span>
                                </button>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Conducted Hours Metric -->
                                <div class="p-4 rounded-xl border border-sky-100 dark:border-slate-800" style="background-color: ${pal.hex}14;">
                                    <span class="block font-bold text-slate-500 dark:text-slate-400 text-[11px] mb-1">${this.t("totalLessonsHoursConducted")}</span>
                                    <div class="flex items-baseline gap-2">
                                        <span class="text-2xl font-black" style="color: ${pal.hex};">${totalCompletedHours.toFixed(1)} h</span>
                                        <span class="text-xs font-bold text-slate-400">/ ${totalScheduledHours.toFixed(1)} h totali</span>
                                    </div>
                                </div>

                                <!-- Total Spent Metric -->
                                <div class="p-4 rounded-xl border border-emerald-100 dark:border-emerald-950/40 bg-emerald-50/50 dark:bg-emerald-950/20">
                                    <span class="block font-bold text-emerald-700 dark:text-emerald-400 text-[11px] mb-1">${this.t("totalSpentInvoiced")}</span>
                                    <div class="text-2xl font-black text-emerald-600 dark:text-emerald-400">
                                        ${this.formatMoney(totalCourseGross)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. ALL MODULES AND LEVELS LIST -->
                        <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs space-y-4">
                            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-sky-100 dark:border-slate-800 pb-3">
                                <div>
                                    <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Moduli e Livelli del Corso</h3>
                                    <p class="text-[11px] text-slate-400">Clicca su un modulo per aprirne il calendario e i costi dettagliati</p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                ${(course.levels || []).map(lvl => `
                                    <div class="space-y-2">
                                        <div class="flex items-center gap-2">
                                            <span class="px-2 py-0.5 rounded-md font-extrabold text-[10px]" style="background-color: ${pal.hex}25; color: ${pal.hex};">
                                                ${this.escapeHtml(lvl.code === 'Altro' ? (lvl.customName || this.t('otherLevelOpt')) : lvl.code)}
                                            </span>
                                            ${lvl.sublevel ? `<span class="text-[11px] text-slate-400 font-bold">(${this.escapeHtml(lvl.sublevel)})</span>` : ''}
                                        </div>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                            ${(lvl.modules || []).map(mod => {
                                                const mCost = this.getModuleTotalGross(mod);
                                                const mDur = parseFloat(mod.billing?.lessonDurationHours) || curSettingDuration;
                                                const mHours = ((mod.dates || []).length * mDur).toFixed(1);
                                                const isOpened = currentModule && currentModule.id === mod.id;
                                                return `
                                                    <button type="button" onclick="app.selectedBillingModuleId = '${mod.id}'; app.renderMainView();"
                                                        class="p-3.5 rounded-xl border text-left transition flex flex-col justify-between space-y-2 ${isOpened ? 'ring-2' : 'hover:border-sky-300 dark:hover:border-slate-700'}"
                                                        style="${isOpened ? `border-color: ${pal.hex}; background-color: ${pal.hex}12; --tw-ring-color: ${pal.hex}` : 'border-color: rgba(226,232,240,0.8); background-color: rgba(248,250,252,0.5);'}">
                                                        <div class="flex items-center justify-between gap-2">
                                                            <span class="font-extrabold text-slate-900 dark:text-white truncate">${this.escapeHtml(mod.name)}</span>
                                                            <span class="font-extrabold text-emerald-600 dark:text-emerald-400">${this.formatMoney(mCost)}</span>
                                                        </div>
                                                        <div class="flex items-center justify-between text-[11px] text-slate-400">
                                                            <span>${(mod.dates || []).length} ${this.t("lessonsLower")} • ${mHours} h</span>
                                                        </div>
                                                    </button>
                                                `;
                                            }).join("")}
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        </div>

                        <!-- 3. OPENED MODULE VIEW: GLOBAL TOOLBAR + BILLING CALENDAR -->
                        ${currentModule ? `
                            <div class="bg-white dark:bg-navy-900 rounded-2xl border border-sky-100 dark:border-slate-800 p-5 shadow-xs space-y-5">
                                <!-- Module Header & Total Module Cost -->
                                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-sky-100 dark:border-slate-800 pb-4">
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${this.escapeHtml(currentModule.name)}</h3>
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold text-white" style="background-color: ${pal.hex};">
                                                ${this.escapeHtml(this.formatLevelModuleBadge(course, currentLevel, currentModule))}
                                            </span>
                                        </div>
                                        <p class="text-[11px] text-slate-400 mt-1">${curSortedSlots.length} ${this.t("lessonsLower")} • ${(curSortedSlots.length * curDuration).toFixed(1)} h</p>
                                    </div>

                                    <div class="flex items-center gap-3">
                                        <div class="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800">
                                            <span class="text-[11px] text-emerald-700 dark:text-emerald-400 font-bold block">${this.t("moduleBillingCost")}</span>
                                            <span class="text-lg font-black text-emerald-600 dark:text-emerald-400">${this.formatMoney(curModuleCost)}</span>
                                        </div>
                                        <button onclick="app.downloadModuleBillingCalendarPng('${course.id}', '${currentModule.id}')"
                                            class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold flex items-center gap-2 shadow-2xs transition">
                                            <i class="fa-solid fa-file-image"></i>
                                            <span>${this.t("exportCalendarPngBtn")}</span>
                                        </button>
                                    </div>
                                </div>

                                <!-- Global Batch Toolbar -->
                                <div class="p-4 rounded-xl border border-sky-100 dark:border-slate-800 bg-slate-50/70 dark:bg-navy-800/40 space-y-3">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center gap-2 font-extrabold text-slate-800 dark:text-slate-100">
                                            <i class="fa-solid fa-sliders" style="color: ${pal.hex};"></i>
                                            <span>${this.t("globalPricingTool")}</span>
                                        </div>
                                        <span class="text-[11px] text-slate-400">Modifica contemporaneamente tariffe, IVA e sconti su tutte le lezioni</span>
                                    </div>

                                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 items-end">
                                        <div>
                                            <label class="block font-bold text-[11px] text-slate-500 mb-1">Tariffa Oraria (${this.getCurrency()})</label>
                                            <input type="number" step="0.01" id="batchHourlyRateNet" value="${curHourlyRate}"
                                                class="w-full h-9 rounded-xl border border-sky-200 dark:border-slate-700 bg-white dark:bg-navy-900 px-3 font-bold text-slate-800 dark:text-slate-100">
                                        </div>
                                        <div>
                                            <label class="block font-bold text-[11px] text-slate-500 mb-1">Durata (h)</label>
                                            <input type="number" step="0.25" id="batchLessonDurationHours" value="${curDuration}"
                                                class="w-full h-9 rounded-xl border border-sky-200 dark:border-slate-700 bg-white dark:bg-navy-900 px-3 font-bold text-slate-800 dark:text-slate-100">

            saveLessonPriceFromModal(courseId, moduleId, slotKey, e) {
                if (e) e.preventDefault();
                const course = (this.state.courses || []).find(c => c.id === courseId);
                if (!course) return;
                let mod = null;
                for (const lvl of (course.levels || [])) {
                    const found = (lvl.modules || []).find(m => m.id === moduleId);
                    if (found) { mod = found; break; }
                }
                if (!mod) return;

                if (!mod.billing) mod.billing = {};
                if (!mod.billing.lessonOverrides) mod.billing.lessonOverrides = {};

                mod.billing.lessonOverrides[slotKey] = {
                    price: parseFloat(document.getElementById("editLessonNetPrice")?.value) || 0,
                    vatPercent: parseFloat(document.getElementById("editLessonVatPct")?.value) || 0,
                    discountType: document.getElementById("editLessonDiscType")?.value || "percent",
                    discountValue: parseFloat(document.getElementById("editLessonDiscVal")?.value) || 0
                };

                this.persist();
                this.closeModal(true);
                this.renderMainView();
                this.showToast(this.t("lessonPricingUpdatedToast"), "success");
            }

            resetLessonPriceFromModal(courseId, moduleId, slotKey) {
                const course = (this.state.courses || []).find(c => c.id === courseId);
                if (!course) return;
                let mod = null;
                for (const lvl of (course.levels || [])) {
                    const found = (lvl.modules || []).find(m => m.id === moduleId);
                    if (found) { mod = found; break; }
                }
                if (!mod || !mod.billing?.lessonOverrides) return;

                delete mod.billing.lessonOverrides[slotKey];
                this.persist();
                this.closeModal(true);
                this.renderMainView();
                this.showToast(this.t("lessonPricingUpdatedToast"), "info");

            applyBatchPricingToModule(courseId, moduleId) {
                const course = (this.state.courses || []).find(c => c.id === courseId);
                if (!course) return;
                let mod = null;
                for (const lvl of (course.levels || [])) {
                    const found = (lvl.modules || []).find(m => m.id === moduleId);
                    if (found) { mod = found; break; }
                }
                if (!mod) return;

                mod.billing = {
                    hourlyRateNet: parseFloat(document.getElementById("batchHourlyRateNet")?.value) || 0,
                    lessonDurationHours: parseFloat(document.getElementById("batchLessonDurationHours")?.value) || 1.5,
                    vatPercent: parseFloat(document.getElementById("batchVatPercent")?.value) || 0,
                    discountType: document.getElementById("batchDiscountType")?.value || "percent",
                    discountTarget: "total",
                    discountValue: parseFloat(document.getElementById("batchDiscountValue")?.value) || 0,
                    lessonOverrides: {} // Reset individual overrides so all lessons adhere to batch settings
                };

                this.persist();
                this.renderMainView();
                this.showToast(this.t("appliedToAllLessonsToast"), "success");
            }

            downloadModuleBillingCalendarPng(courseId, moduleId, lang = null) {
                if (!lang) {
                    this.openExportLanguageModal(
                        this.t("exportLanguageTitle") || "Lingua di Esportazione",
                        this.t("exportLanguagePrompt") || "Seleziona la lingua per le intestazioni, date e testi dell'immagine PNG:",
                        (chosenLang) => this.downloadModuleBillingCalendarPng(courseId, moduleId, chosenLang)
                    );
                    return;
                }

                const course = (this.state.courses || []).find(c => c.id === courseId) || this.getActiveCourse();
                if (!course) return;
                let mod = null;
                let lvl = null;
                for (const l of (course.levels || [])) {
                    const found = (l.modules || []).find(m => m.id === moduleId);
                    if (found) { mod = found; lvl = l; break; }
                }
                if (!mod) return;

                const slots = this.sortModuleSlots(course, mod);
                if (!slots || slots.length === 0) {
                    this.showToast(this.t("noScheduledLessonsMsg"), "warning");
                    return;
                }

                const pal = this.getCourseColorObj(course.color);
                const curSettingDuration = parseFloat(this.state?.settings?.defaultLessonDurationHours) || 1.5;
                const dur = parseFloat(mod.billing?.lessonDurationHours) || curSettingDuration;
                const totalHours = (slots.length * dur).toFixed(1);
                const totalCost = this.getModuleTotalGross(mod);
                const fInfo = course.billingConfig?.billingInfo || {};

                // Dimensions
                const width = 1200;
                const bannerHeight = 130;
                const fiscalHeight = (fInfo.fullName || fInfo.idNumber || fInfo.city) ? 65 : 0;
                const tableHeaderHeight = 44;
                const rowHeight = 36;
                const tableHeight = tableHeaderHeight + (slots.length * rowHeight) + 15;
                const summaryHeight = 65;
                const footerHeight = 50;
                const totalHeight = 40 + bannerHeight + (fiscalHeight ? fiscalHeight + 15 : 0) + 20 + tableHeight + summaryHeight + footerHeight + 20;

                const canvas = document.createElement("canvas");
                const scale = 2; // Retina Crisp High DPI
                canvas.width = width * scale;
                canvas.height = totalHeight * scale;
                const ctx = canvas.getContext("2d");
                ctx.scale(scale, scale);

                // Background
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, width, totalHeight);

                let yCursor = 30;

                // 1. Header Banner
                const bannerGrad = ctx.createLinearGradient(40, yCursor, width - 40, yCursor + bannerHeight);
                bannerGrad.addColorStop(0, pal.hex || "#0284c7");
                bannerGrad.addColorStop(1, pal.hoverHex || "#0369a1");
                ctx.fillStyle = bannerGrad;
                ctx.beginPath();
                ctx.roundRect(40, yCursor, width - 80, bannerHeight, 18);
                ctx.fill();

                // Banner Course Name & Badge
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.fillText(course.name, 65, yCursor + 50);

                const badgeTxt = this.formatLevelModuleBadge(course, lvl, mod);
                const badgeWidth = ctx.measureText(badgeTxt).width + 24;
                const nameWidth = ctx.measureText(course.name).width;

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(65 + nameWidth + 18, yCursor + 25, badgeWidth, 32, 16);
                ctx.fill();

                ctx.fillStyle = pal.hex || "#0284c7";
                ctx.font = "bold 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.fillText(badgeTxt, 65 + nameWidth + 30, yCursor + 47);

                // Banner Subtitle
                const bannerSubMap = {
                    it: `Dettaglio Fatturazione e Calendario Lezioni • ${slots.length} Lezioni (${totalHours} ore)`,
                    en: `Billing Breakdown & Lessons Schedule • ${slots.length} Lessons (${totalHours} hrs)`,
                    es: `Detalle de Facturación y Calendario de Clases • ${slots.length} Clases (${totalHours} hrs)`
                };
                ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
                ctx.font = "600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.fillText(bannerSubMap[lang] || bannerSubMap.it, 65, yCursor + 92);

                // Module Total (Top Right)
                const modTotalLabelMap = {
                    it: "Totale Modulo",
                    en: "Module Total",
                    es: "Total del Módulo"
                };
                ctx.textAlign = "right";
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.font = "bold 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.fillText(modTotalLabelMap[lang] || modTotalLabelMap.it, width - 70, yCursor + 48);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.fillText(this.formatMoney(totalCost), width - 70, yCursor + 88);
                ctx.textAlign = "left";

                yCursor += bannerHeight + 20;

                // 2. Client & Fiscal Info Box
                if (fiscalHeight > 0) {
                    ctx.fillStyle = "#f8fafc";
                    ctx.strokeStyle = "#e2e8f0";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(40, yCursor, width - 80, fiscalHeight, 12);
                    ctx.fill();
                    ctx.stroke();

                    const intestMap = { it: "Intestatario:", en: "Billing Name:", es: "Titular:" };
                    let fx = 60;
                    if (fInfo.fullName) {
                        ctx.fillStyle = "#64748b";
                        ctx.font = "bold 11px sans-serif";
                        ctx.fillText(intestMap[lang] || intestMap.it, fx, yCursor + 25);
                        ctx.fillStyle = "#0f172a";
                        ctx.font = "bold 14px sans-serif";
                        ctx.fillText(fInfo.fullName, fx, yCursor + 46);
                        fx += 280;
                    }
                    if (fInfo.idNumber) {
                        ctx.fillStyle = "#64748b";
                        ctx.font = "bold 11px sans-serif";
                        ctx.fillText((fInfo.idType || "ID").toUpperCase() + ":", fx, yCursor + 25);
                        ctx.fillStyle = "#0f172a";
                        ctx.font = "bold 14px sans-serif";
                        ctx.fillText(fInfo.idNumber, fx, yCursor + 46);
                        fx += 220;
                    }
                    if (fInfo.city) {
